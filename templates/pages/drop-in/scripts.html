<script id="clockTimerSettingsFrameController">
(() => {
  const dialog = document.getElementById("clockTimerSettingsFrameDialog");
  const frame = document.getElementById("clockTimerSettingsFrame");
  if (!dialog || !frame || dialog.dataset.controllerReady) return;
  dialog.dataset.controllerReady = "true";
  const surfaces = new Set([
    "graphicalSettingsDialog",
    "audioSettingsDialog",
    "audioAnnouncementsDialog",
    "stateSettingsDialog",
    "tripSettingsDialog"
  ]);
  document.querySelectorAll("[data-open-clock-timer-settings]").forEach(button => {
    button.addEventListener("click", () => {
      const requested = button.dataset.settingsSurface;
      const surface = surfaces.has(requested) ? requested : "graphicalSettingsDialog";
      frame.dataset.settingsSurface = surface;
      frame.dataset.settingsSession = crypto.randomUUID();
      const page = surface === "graphicalSettingsDialog" ? "graphical-settings" : "settings";
      const extension = location.pathname.endsWith(".php") && page === "graphical-settings" ? ".php" : ".html";
      frame.src = page + extension + "?surface=" + encodeURIComponent(surface) + "&lang=" + encodeURIComponent(document.documentElement.lang) + "&session=" + frame.dataset.settingsSession;
      const menu = button.closest("hamburger-menu");
      if (menu && typeof menu.hidePopover === "function") {
        try { menu.hidePopover(); } catch {}
      }
      if (!dialog.open) dialog.showModal();
    });
  });
  window.addEventListener("message", event => {
    if (event.source !== frame.contentWindow || event.origin !== window.location.origin) return;
    if (frame.dataset.settingsSurface === "graphicalSettingsDialog" && event.data?.session !== frame.dataset.settingsSession) return;
    if (event.data?.type === "clocktimer-settings-closed" && dialog.open) {
      dialog.close();
      frame.src = "about:blank";
    }
  });
  dialog.addEventListener("close", () => { if (!dialog.open) frame.src = "about:blank"; });
  dialog.addEventListener("click", event => {
    if (event.target === dialog) dialog.close();
  });
})();
</script>
