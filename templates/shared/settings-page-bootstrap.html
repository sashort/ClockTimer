<script id="standaloneSettingsPageBootstrap">
(() => {
  const pageHeader = document.getElementById("settingsPageHeader");
  const embedded = window.self !== window.top;
  if (embedded) {
    document.body.classList.add("settings-embedded");
    document.documentElement.classList.add("settings-embedded-document");
    if (pageHeader) pageHeader.hidden = true;
  }
  const ids = ["graphicalSettingsDialog","audioSettingsDialog","audioAnnouncementsDialog","stateSettingsDialog","tripSettingsDialog"];
  const requestedSurface = new URLSearchParams(window.location.search).get("surface");
  const surfaceId = ids.includes(requestedSurface) ? requestedSurface : "graphicalSettingsDialog";
  const surface = document.getElementById(surfaceId);
  if (!surface) return;
  surface.setAttribute("data-primary-settings-surface", "");
  if (embedded) {
    surface.addEventListener("close", () => {
      try {
        window.parent.postMessage({ type: "clocktimer-settings-closed" }, window.location.origin);
      } catch {}
    });
  }

  const openSurface = () => {
  // Route through the original app trigger so its existing form-population,
  // validation, focus, and settings handlers run exactly as in Order-Filler.
  const originalTrigger = document.querySelector('[data-dialog="' + surfaceId + '"]');
  if (originalTrigger) {
    originalTrigger.dispatchEvent(new Event("pointerup", { bubbles: true, cancelable: true }));
    return;
  }
  const opening = new CustomEvent("opening", {
    bubbles: true,
    cancelable: true,
    detail: { reason: "user", duration: 0 }
  });
  if (surface.dispatchEvent(opening)) {
    try { surface.showModal(); } catch { surface.setAttribute("open", ""); }
  }
  };
  if (document.documentElement.dataset.clocktimerAppReady === "true") openSurface();
  else document.addEventListener("clocktimer-app-ready", openSurface, {once:true});
})();
</script>
