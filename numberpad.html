<dialog id="numberPadDialog" class="number-pad-dialog" aria-label="Number pad">
    <section class="number-pad-shell">
        <button id="numberPadCancel" class="dialog-close number-pad-close" type="button" aria-label="Back"></button>
        <div id="numberPadContext" class="number-pad-context">Standard Time</div>
        <div class="number-pad-header">
            <div id="numberPadReadout" class="number-pad-readout">
                <button id="numberPadBackspace" class="number-pad-backspace" type="button" aria-label="Clear time and AM/PM">⌫</button>
                <output id="numberPadDisplay" class="number-pad-display" aria-live="polite"></output>
                <button id="numberPadAM" class="number-pad-meridiem number-pad-am" type="button" data-meridiem="AM" aria-label="AM">AM</button>
                <label id="numberPadDateRow" class="number-pad-date-row">
                    <span class="number-pad-calendar-icon" aria-hidden="true"></span>
                    <input id="numberPadDate" type="date" aria-label="Date">
                </label>
                <button id="numberPadPM" class="number-pad-meridiem number-pad-pm" type="button" data-meridiem="PM" aria-label="PM">PM</button>
            </div>
            <div id="numberPadSettingsArea" class="number-pad-settings" data-persistence="offline">
                <button id="numberPadSettings" class="number-pad-settings-control" type="button" aria-label="Trip settings">
                    <span class="number-pad-settings-gear" aria-hidden="true"></span>
                </button>
                <button id="numberPadConnection" class="number-pad-persistence-badge" type="button" aria-label="Offline. Retry connection"></button>
            </div>
        </div>
        <div id="numberPadGrid" class="number-pad-grid">
            <button class="number-pad-key" type="button" data-number="1" data-touch-tone="697,1209">1</button>
            <button class="number-pad-key" type="button" data-number="2" data-touch-tone="697,1336">2</button>
            <button class="number-pad-key" type="button" data-number="3" data-touch-tone="697,1477">3</button>
            <button class="number-pad-key" type="button" data-number="4" data-touch-tone="770,1209">4</button>
            <button class="number-pad-key" type="button" data-number="5" data-touch-tone="770,1336">5</button>
            <button class="number-pad-key" type="button" data-number="6" data-touch-tone="770,1477">6</button>
            <button class="number-pad-key" type="button" data-number="7" data-touch-tone="852,1209">7</button>
            <button class="number-pad-key" type="button" data-number="8" data-touch-tone="852,1336">8</button>
            <button class="number-pad-key" type="button" data-number="9" data-touch-tone="852,1477">9</button>
            <div class="number-pad-clear-reset" aria-label="Clear and Reset">
                <button id="numberPadClear" class="number-pad-split-action number-pad-clear" type="button" aria-label="Clear" data-action="clear"></button>
                <button id="numberPadReset" class="number-pad-split-action number-pad-reset" type="button" aria-label="Reset"></button>
            </div>
            <button class="number-pad-key" type="button" data-number="0" data-touch-tone="941,1336">0</button>
            <button id="numberPadConfirm" class="number-pad-key number-pad-confirm" type="button" aria-label="Confirm" data-action="confirm" data-touch-tone="941,1477"></button>
        </div>
    </section>
</dialog>
