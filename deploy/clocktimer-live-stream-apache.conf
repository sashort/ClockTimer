<IfModule proxy_module>
    <IfModule proxy_wstunnel_module>
        ProxyPass "/live-stream-ws" "ws://127.0.0.1:8765/live-stream-ws" retry=0 timeout=60
        ProxyPassReverse "/live-stream-ws" "ws://127.0.0.1:8765/live-stream-ws"
    </IfModule>
    <IfModule !proxy_wstunnel_module>
        <IfModule proxy_http_module>
            ProxyPass "/live-stream-ws" "http://127.0.0.1:8765/live-stream-ws" upgrade=websocket retry=0 timeout=60
            ProxyPassReverse "/live-stream-ws" "http://127.0.0.1:8765/live-stream-ws"
        </IfModule>
    </IfModule>
</IfModule>
