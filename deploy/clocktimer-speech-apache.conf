<IfModule proxy_module>
    <IfModule proxy_wstunnel_module>
        ProxyPass "/speech-ws" "ws://127.0.0.1:8766/speech-ws" retry=0 timeout=90
        ProxyPassReverse "/speech-ws" "ws://127.0.0.1:8766/speech-ws"
    </IfModule>
    <IfModule !proxy_wstunnel_module>
        <IfModule proxy_http_module>
            ProxyPass "/speech-ws" "http://127.0.0.1:8766/speech-ws" upgrade=websocket retry=0 timeout=90
            ProxyPassReverse "/speech-ws" "http://127.0.0.1:8766/speech-ws"
        </IfModule>
    </IfModule>
</IfModule>
