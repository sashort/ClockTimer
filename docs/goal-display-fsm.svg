<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-label="Whole bar goal selector and separate Standard Time editor"><rect width="1000" height="900" fill="#f5f8fb"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="40" y="45" font-size="27" font-weight="bold">Goal editing · current shared contract</text><text x="40" y="75" font-size="16">27 October 2026 · Classic and Bar share actual / inferred goal details</text>
 <g><rect x="50" y="120" width="360" height="110" rx="14" fill="white" stroke="#446880" stroke-width="2"/><text x="230" y="150" text-anchor="middle" font-size="19" font-weight="bold">Whole bar</text><text x="230" y="177" text-anchor="middle" font-size="15">Nodes, labels, track and triangles</text><text x="230" y="198" text-anchor="middle" font-size="15">Touch / click / Enter / Space</text></g>
 <g><rect x="590" y="120" width="360" height="110" rx="14" fill="white" stroke="#446880" stroke-width="2"/><text x="770" y="150" text-anchor="middle" font-size="19" font-weight="bold">Main Standard Time header</text><text x="770" y="177" text-anchor="middle" font-size="15">Separate existing control</text><text x="770" y="198" text-anchor="middle" font-size="15">Never offered by the bar</text></g>
 <g data-state-id="GOAL-SELECT"><rect x="50" y="330" width="360" height="110" rx="14" fill="white" stroke="#446880" stroke-width="2"/><text x="230" y="360" text-anchor="middle" font-size="19" font-weight="bold">Choose goal</text><text x="230" y="387" text-anchor="middle" font-size="15">Trip: Trip · Aggregate: that goal</text><text x="230" y="408" text-anchor="middle" font-size="15">Auto: Trip + aggregate; even if failed</text></g>
 <g data-state-id="TS"><rect x="590" y="330" width="360" height="110" rx="14" fill="white" stroke="#446880" stroke-width="2"/><text x="770" y="360" text-anchor="middle" font-size="19" font-weight="bold">Trip settings</text><text x="770" y="387" text-anchor="middle" font-size="15">Existing trip Standard Time editor</text><text x="770" y="408" text-anchor="middle" font-size="15">Available in every active scope</text></g>
 <g data-state-id="GOAL-PERCENT"><rect x="50" y="560" width="360" height="110" rx="14" fill="white" stroke="#446880" stroke-width="2"/><text x="230" y="590" text-anchor="middle" font-size="19" font-weight="bold">Edit configured goal</text><text x="230" y="617" text-anchor="middle" font-size="15">Edit actual configured percentage</text><text x="230" y="638" text-anchor="middle" font-size="15">Inferred trip requirement is a preview</text></g>
 <g stroke="#446880" stroke-width="3"><path d="M230 230V330 M770 230V330 M230 440V560"/></g>
 <text x="50" y="730" font-size="16">Example: Day actual goal 110% → inferred trip requirement 125%.</text><text x="50" y="760" font-size="16">No Standard edit, Current time-mode change or failed-only selector from the bar.</text><text x="50" y="790" font-size="16">Drop-In retains existing permission gates; Classic uses the same goal details.</text><text x="50" y="820" font-size="16">Counted-time motion / pause-resume keyframes remain a proposal.</text></g></svg>