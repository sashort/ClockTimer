<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1100" viewBox="0 0 1320 1100" role="img" aria-labelledby="title desc"><title id="title">Current goal and Standard Time editor routing</title><desc id="desc">27 October 2026 local working FSM projection. Nodes and labels share one scoped action. One failed goal edits directly, several use a configurable selector. Proposed lifecycle animations are not implemented.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#446880"/></marker><style>text{font-family:Arial,sans-serif;fill:#17334b}.node-title{font-size:19px;font-weight:700}.node-line{font-size:15px}.edge-label{font-size:15px;paint-order:stroke;stroke:#f5f8fb;stroke-width:6;stroke-linejoin:round}.note{font-size:15px}</style></defs><rect width="1320" height="1100" fill="#f5f8fb"/><text x="50" y="42" font-size="27" font-weight="700">Goal / Standard Time editors · current working contract</text><text x="50" y="70" font-size="16">27 October 2026 · action routing preserves trip phase and mode · no deployment claim</text>
 <g><rect x="50" y="115" width="330" height="100" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="215" y="145" text-anchor="middle" class="node-title">Right-pointing triangle</text><text x="215" y="171" text-anchor="middle" class="node-line">Appears when at least one goal fails</text></g>
 <g><rect x="495" y="115" width="330" height="100" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="660" y="145" text-anchor="middle" class="node-title">Classic Auto goal label</text><text x="660" y="171" text-anchor="middle" class="node-line">Normal configured goal choices</text></g>
 <g><rect x="940" y="115" width="330" height="110" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="1105" y="145" text-anchor="middle" class="node-title">Bar node or any label</text><text x="1105" y="171" text-anchor="middle" class="node-line">Circle, time, percentage, name</text><text x="1105" y="192" text-anchor="middle" class="node-line">Standard Time header also enters here</text></g>
 <g><rect x="50" y="285" width="330" height="100" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="215" y="315" text-anchor="middle" class="node-title">How many failed nodes?</text><text x="215" y="341" text-anchor="middle" class="node-line">Use current failed-goal list</text></g>
 <g><rect x="50" y="465" width="330" height="100" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="215" y="495" text-anchor="middle" class="node-title">Exactly one</text><text x="215" y="521" text-anchor="middle" class="node-line">Use that goal’s existing action</text></g>
 <g data-state-id="GOAL-SELECT"><rect x="495" y="465" width="330" height="100" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="660" y="495" text-anchor="middle" class="node-title">Choose goal</text><text x="660" y="521" text-anchor="middle" class="node-line">Configure choices for this opening</text><text x="660" y="542" text-anchor="middle" class="node-line">No entry-origin history</text></g>
 <g><rect x="495" y="655" width="330" height="100" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="660" y="685" text-anchor="middle" class="node-title">Resolve scope</text><text x="660" y="711" text-anchor="middle" class="node-line">Standard, Trip, aggregate or Current</text></g>
 <g data-state-id="TS"><rect x="50" y="825" width="330" height="110" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="215" y="855" text-anchor="middle" class="node-title">Standard Time settings</text><text x="215" y="881" text-anchor="middle" class="node-line">Edits trip duration in every scope</text><text x="215" y="902" text-anchor="middle" class="node-line">Idle bar uses New Trip duration entry</text></g>
 <g data-state-id="GOAL-PERCENT"><rect x="495" y="825" width="330" height="110" rx="14" fill="#fff" stroke="#446880" stroke-width="2"/><text x="660" y="855" text-anchor="middle" class="node-title">Edit configured goal</text><text x="660" y="881" text-anchor="middle" class="node-line">Edits configured Trip / aggregate %</text><text x="660" y="902" text-anchor="middle" class="node-line">Never edits the inferred display value</text></g>
