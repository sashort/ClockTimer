name: Add number pad back action

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/add-number-pad-back.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency

      - name: Apply number pad back update
        run: python .github/scripts/add-number-pad-back.py

      - name: Syntax check
        run: node --check app.js

      - name: Verify number pad back behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text()
          css = Path('app.css').read_text()

          assert 'return peekUIReturnFrame() ? "back" : "close";' in app
          assert 'clearAction === "back"' in app
          assert 'action === "close" || action === "back"' in app
          assert '.number-pad-clear[data-action="back"]::before' in css
          assert "viewBox='0 0 88 66'" in css
          assert "stroke-linejoin='round'" in css
          PY

      - name: Commit update and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css
          git rm .github/scripts/add-number-pad-back.py .github/workflows/add-number-pad-back.yml
          git commit -m "Show back arrow for number pad returns"
          git push origin HEAD:rename-prestart-latency
