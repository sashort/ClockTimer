name: Use CSS animation duration
on:
  push:
    paths:
      - '.github/workflows/use-css-animation-duration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS duration update
        run: python .github/scripts/use-css-animation-duration.py
      - name: Syntax checks
        run: |
          node --check TimeRange.js
          node --check ClockTimer.js
      - name: Targeted checks
        run: |
          grep -q -- '--clock-timer-ring-resize-duration' TimeRange.js
          grep -q -- '--clock-timer-ring-resize-duration' ClockTimer.js
          grep -q '#getAnimationDuration()' TimeRange.js
          grep -q '#getRangeAnimationDuration()' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/use-css-animation-duration.py
          rm .github/workflows/use-css-animation-duration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js ClockTimer.js .github/scripts/use-css-animation-duration.py .github/workflows/use-css-animation-duration.yml
          git commit -m 'Use CSS ring resize duration for timer animations'
          git push
