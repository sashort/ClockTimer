name: Finalize number pad persistence

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/finalize-numberpad-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Apply finalization patch
        run: python3 .github/scripts/finalize_numberpad_persistence.py
      - name: Validate
        run: |
          node --check ClockTimer.js
          php -l api/trips/index.php
          grep -q "AND pending = 0" api/trips/index.php
          grep -q "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx" ClockTimer.js
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js api/trips/index.php
          git commit -m 'Finalize number pad persistence handling'
          git push origin HEAD:rename-prestart-latency
