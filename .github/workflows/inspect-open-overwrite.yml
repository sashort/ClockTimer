name: Inspect open overwrite elapsed interaction

on:
  push:
    paths:
      - '.github/workflows/inspect-open-overwrite.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show open overwrite code
        run: |
          grep -n -A120 -B20 '#updateOpenOverwriteRange' ClockTimer.js || true
          grep -n -A160 -B20 '#reapplyOverwriteRanges' ClockTimer.js || true
          grep -n -A120 -B20 '#renderOverwrite' ClockTimer.js || true
          grep -n -A120 -B20 'clockTimerOverwrite' ClockTimer.js || true
