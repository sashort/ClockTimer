name: Validate UI implementation

on:
  push:
    branches:
      - rename-prestart-latency

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ClockTimer.js
      - name: Verify graphical defaults and styling hooks
        run: |
          grep -F 'tickMarks: "[10]"' app.js
          grep -F 'indicatorSymbol: "▲"' app.js
          grep -F 'visibleHours: "12,3,6,9"' app.js
          grep -F 'timeFormat: "HHmm"' app.js
          grep -F 'clock-timer::part(hour-hand)' app.css
          grep -F 'clock-timer::part(tick-mark)' app.css
          grep -F ': "HHmm";' ClockTimer.js
