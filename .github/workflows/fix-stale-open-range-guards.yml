name: Fix ClockTimer stale open range guards
on:
  push:
    paths:
      - '.github/workflows/fix-stale-open-range-guards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ClockTimer patch
        run: python .github/scripts/fix_stale_open_range_guards.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify stale guard recovery
        run: |
          grep -Fq 'const hasOpenElement =' ClockTimer.js
          grep -Fq 'candidate.clockTimerInserted ===' ClockTimer.js
          grep -Fq 'candidate.clockTimerOverwrite ===' ClockTimer.js
      - name: Commit ClockTimer update and cleanup
        run: |
          rm -f .github/scripts/fix_stale_open_range_guards.py
          rm -f .github/workflows/fix-stale-open-range-guards.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix_stale_open_range_guards.py .github/workflows/fix-stale-open-range-guards.yml
          git commit -m "Recover stale open range state"
          git push origin main
