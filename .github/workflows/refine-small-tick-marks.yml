name: Update TimeRange calculations
on:
  push:
    paths:
      - '.github/workflows/refine-small-tick-marks.yml'
      - '.github/scripts/update_timerange_calculations.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/update_timerange_calculations.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify calculation API
        run: |
          grep -Fq 'static calculateTimeAngle' TimeRange.js
          grep -Fq 'static calculateCorners' TimeRange.js
          grep -Fq '"to-right"' TimeRange.js
          grep -Fq '"to-left"' TimeRange.js
          grep -Fq '"to-bottom"' TimeRange.js
          grep -Fq '"to-top"' TimeRange.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add TimeRange.js
          git commit -m "Add fitted TimeRange calculation modes" || exit 0
          git push origin main
