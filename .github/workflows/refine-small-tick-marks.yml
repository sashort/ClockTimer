name: Refine small ClockTimer tick marks
on:
  push:
    paths:
      - '.github/workflows/refine-small-tick-marks.yml'
      - '.github/scripts/refine_small_tick_marks.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/refine_small_tick_marks.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify small-clock tick defaults
        run: |
          grep -Fq 'clamp(2px, 2cqi, 10px);' ClockTimer.js
          grep -Fq 'clamp(0.5px, 0.45cqi, 2px);' ClockTimer.js
          grep -Fq 'clamp(1px, 0.75cqi, 3px);' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Refine tick marks for small clocks" || exit 0
          git push origin main
