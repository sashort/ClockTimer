name: Roll back speculative open range debugging
on:
  push:
    paths:
      - '.github/workflows/rollback-open-range-debugging.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore ClockTimer.js before speculative open-range changes
        run: git checkout c144f6132443d614b82c2eb9e61627e812fe1d6e -- ClockTimer.js
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify restored open-range behavior
        run: |
          grep -Fq 'this.#renderAllInsertedRanges();' ClockTimer.js
          grep -Fq 'if (this.#openOverwriteRange) {' ClockTimer.js
          ! grep -Fq 'const hasOpenElement =' ClockTimer.js
      - name: Commit rollback and cleanup
        run: |
          rm -f .github/workflows/rollback-open-range-debugging.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/workflows/rollback-open-range-debugging.yml
          git commit -m "Roll back speculative open range fixes"
          git push origin main
