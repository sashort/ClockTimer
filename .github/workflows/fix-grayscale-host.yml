name: Fix grayscale host target

on:
  push:
    paths:
      - '.github/workflows/fix-grayscale-host.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch ClockTimer
        run: python .github/scripts/fix-grayscale-host.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Commit functional change and self-clean
        run: |
          rm .github/scripts/fix-grayscale-host.py .github/workflows/fix-grayscale-host.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/fix-grayscale-host.py .github/workflows/fix-grayscale-host.yml
          git commit -m 'Apply grayscale to entire ClockTimer'
          git push origin main
