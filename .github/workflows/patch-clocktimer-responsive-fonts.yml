name: Patch ClockTimer responsive fonts

on:
  push:
    paths:
      - '.github/workflows/patch-clocktimer-responsive-fonts.yml'
      - '.github/scripts/patch_clocktimer_responsive_fonts.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/patch_clocktimer_responsive_fonts.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify responsive defaults
        run: |
          grep -q -- '--clock-timer-auto-time-font-size' ClockTimer.js
          grep -q -- '--clock-timer-auto-hour-font-size' ClockTimer.js
          grep -q -- 'diameter \* 0.66' ClockTimer.js
          grep -q -- 'format.startsWith' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name 'sashort'
          git config user.email '95879519+sashort@users.noreply.github.com'
          git add ClockTimer.js
          git commit -m 'Add responsive ClockTimer font defaults'
          git push origin main
