name: Refine trip settings disabled state

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/refine-trip-settings-disabled.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency

      - name: Apply trip settings refinement
        run: python .github/scripts/refine-trip-settings-disabled.py

      - name: Verify trip settings refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text()
          css = Path('app.css').read_text()
          assert '<legend>Trip Preferences</legend>' in index
          assert '<legend>Options</legend>' not in index[index.index('id="tripSettingsDialog"'):index.index('id="breakDialog"')]
          assert '.trip-settings-dialog #tripSettingsPrimary:disabled' in css
          assert 'cursor: not-allowed;' in css
          assert 'filter: grayscale(1) saturate(0.25);' in css
          PY

      - name: Commit update and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css
          git rm .github/scripts/refine-trip-settings-disabled.py .github/workflows/refine-trip-settings-disabled.yml
          git commit -m "Refine trip settings disabled state"
          git push origin HEAD:rename-prestart-latency
