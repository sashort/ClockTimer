name: Update trip settings UI

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/update-trip-settings-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency

      - name: Apply trip settings UI update
        run: python .github/scripts/update-trip-settings-ui.py

      - name: Syntax check
        run: |
          node --check app.js
          node --check ClockTimer.js

      - name: Verify trip settings UI
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text()
          app = Path('app.js').read_text()
          clock = Path('ClockTimer.js').read_text()

          assert 'id="tripSettingsTitle">Edit Trip Settings</h2>' in index
          assert '<legend>Options</legend>' in index
          assert 'Match Trip Goal to Total' in index
          assert 'When an interval elapses' not in index[index.index('id="tripSettingsDialog"'):index.index('id="breakDialog"')]

          section = index[index.index('class="trip-settings-times"'):index.index('class="trip-settings-behavior"')]
          positions = [section.index(f'data-trip-time-row="{name}"') for name in (
              'standard-time', 'scheduled-start', 'actual-start', 'creation-time'
          )]
          assert positions == sorted(positions)

          assert 'New Trip Settings' in app
          assert 'Edit Trip Settings' in app
          assert 'clockTimer.hasAggregateTrips === true' in app
          assert 'autoSyncTripGoal.disabled = !aggregateGoalAvailable' in app
          trip_submit = app[
              app.index('tripSettingsForm.addEventListener("submit"'):
              app.index('async function beginNewTripWorkflow')
          ]
          assert 'intervalElapsedBehavior' not in trip_submit
          assert 'get hasAggregateTrips()' in clock
          PY

      - name: Commit update and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html ClockTimer.js
          git rm .github/scripts/update-trip-settings-ui.py .github/workflows/update-trip-settings-ui.yml
          git commit -m "Refine trip settings UI"
          git push origin HEAD:rename-prestart-latency
