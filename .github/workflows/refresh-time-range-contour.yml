name: Refresh TimeRange contour
on:
  push:
    paths:
      - '.github/workflows/refresh-time-range-contour.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply contour refresh fix
        run: python .github/scripts/refresh-time-range-contour.py
      - name: Syntax checks
        run: |
          node --check ClockTimer.js
          node --check RingContainer.js
          node --check TimeRange.js
      - name: Targeted checks
        run: |
          grep -n 'refreshChildVisualGeometry' RingContainer.js
          grep -n 'refreshVisualGeometry' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm -f .github/workflows/refresh-time-range-contour.yml
          rm -f .github/scripts/refresh-time-range-contour.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RingContainer.js TimeRange.js .github
          git commit -m 'Refresh TimeRange contour after ring resize'
          git push
