name: Apply tolerance help and formats

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/apply_tolerance_help_and_formats.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply changes
        run: python .github/scripts/apply_tolerance_help_and_formats.py

      - name: Validate JavaScript
        run: |
          node --check TemporalFormat.js
          node --check ClockTimer.js
          node --check app.js

      - name: Validate new format tokens
        run: |
          node - <<'NODE'
          require('./TemporalFormat.js');
          const value = new Date(2026, 8, 17, 14, 37, 22);
          const time = TemporalFormat.formatTime(value, 'h:mm A', false);
          const shortDate = TemporalFormat.formatDate(value, 'ddd, MMM d, yyyy');
          const longDate = TemporalFormat.formatDate(value, 'dddd, MMMM d, yyyy');
          if (time !== '2:37 PM') throw new Error(`Unexpected time: ${time}`);
          if (shortDate !== 'Thu, Sep 17, 2026') throw new Error(`Unexpected short date: ${shortDate}`);
          if (longDate !== 'Thursday, September 17, 2026') throw new Error(`Unexpected long date: ${longDate}`);
          NODE

      - name: Check whitespace
        run: git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js TemporalFormat.js app.js app.css index.html
          git commit -m "Add tri-state tolerance and settings help"
          git push origin HEAD:rename-prestart-latency
