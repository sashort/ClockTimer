name: Apply cloud visual state and palette alignment

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-cloud-visual-state-palette.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply changes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' ' | base64 -d > /tmp/apply-cloud-palette.py
          python /tmp/apply-cloud-palette.py
          node --check app.js
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cloud-visual-state-palette.yml
          git add app.js app.css
          git diff --cached --check
          git commit -m "Fix cloud flip and restore legacy palette"
          git push origin HEAD:rename-prestart-latency
