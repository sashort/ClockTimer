name: Rollback ClockTimer

on:
  push:
    paths:
      - '.github/workflows/rollback-clocktimer.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore ClockTimer before time layout change
        run: |
          git checkout c0b5dcd8438ba139cbe629552fe8e55bbd1c628a -- ClockTimer.js
          node --check ClockTimer.js
          git rm .github/workflows/rollback-clocktimer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Rollback ClockTimer time layout change"
          git push
