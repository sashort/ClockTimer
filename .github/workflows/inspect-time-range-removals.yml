name: Inspect TimeRange removals
'on':
  push:
    branches:
      - time-range-animation-rework
    paths:
      - '.github/workflows/inspect-time-range-removals.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-range-animation-target
      - name: Show removal call sites
        run: |
          grep -n -C 6 'removeAnimated' ClockTimer.js || true
          grep -n -C 6 '\.remove();' ClockTimer.js | head -n 600 || true
