name: Refresh contours on ClockTimer resize
on:
  push:
    paths:
      - '.github/workflows/refresh-contours-on-clock-resize.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply resize contour refresh
        run: python .github/scripts/refresh-contours-on-clock-resize.py
      - name: Syntax checks
        run: node --check ClockTimer.js
      - name: Targeted checks
        run: |
          grep -n '#refreshTimeRangeVisualGeometry' ClockTimer.js
          grep -n 'refreshVisualGeometry' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm -f .github/workflows/refresh-contours-on-clock-resize.yml
          rm -f .github/scripts/refresh-contours-on-clock-resize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github
          git commit -m 'Refresh TimeRange gradients on ClockTimer resize'
          git push
