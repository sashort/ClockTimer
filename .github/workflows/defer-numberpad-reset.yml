name: Defer number pad reset
on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/defer-numberpad-reset.yml'
      - '.github/scripts/defer_numberpad_reset.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Apply deferred reset fix
        run: python .github/scripts/defer_numberpad_reset.py
      - name: Syntax check
        run: node --check app.js
      - name: Verify reset timing
        run: |
          ! grep -Fq 'if (!numberPadDialog?.open) resetNumberPad();' app.js
          grep -Fq 'numberPadDialog.addEventListener("close", () => {' app.js
      - name: Commit fix and cleanup
        run: |
          rm -f .github/scripts/defer_numberpad_reset.py
          rm -f .github/workflows/defer-numberpad-reset.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js .github/scripts/defer_numberpad_reset.py .github/workflows/defer-numberpad-reset.yml
          git commit -m "Defer number pad reset until close event"
          git push origin rename-prestart-latency
