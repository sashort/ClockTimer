name: Apply menu and Trip Log changes

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-menu-triplog-changes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply menu and Trip Log changes
        run: |
          python3 .github/scripts/apply_menu_triplog_changes.py
          node --check app.js
          node --check ClockTimer.js
          git diff --check
          grep -q 'id="syncGoalsMenuButton"' index.html
          grep -q 'id="tripLogRangeSelect"' index.html
          grep -q 'id="goalSyncButton"' index.html
          grep -q 'id="tripLogBody"' index.html
          grep -q '>Clock/Timer Settings<' index.html
          grep -q 'trip-log-merged' app.css
          grep -q 'wmof:trip-log-range-changed' app.js
          grep -q 'tripPreferences.syncGoals' app.js
          if grep -q 'matchTripGoalToTotal' app.js index.html; then
            echo 'legacy Match Trip Goal state remains' >&2
            exit 1
          fi
          if grep -q 'tripSettingsPreferences\|tripGoalSyncOption\|tripGoalSyncNoData' app.js index.html; then
            echo 'Trip Settings preference controls remain' >&2
            exit 1
          fi
          git add app.js app.css index.html
          git commit -m "Rework menu and Trip Log interactions"
      - name: Push changes
        run: git push origin HEAD:rename-prestart-latency
