name: Adjust tick inactive gap
on:
  push:
    paths:
      - '.github/workflows/adjust-tick-inactive-gap.yml'
      - '.github/scripts/adjust_tick_inactive_gap.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tick inset patch
        run: python .github/scripts/adjust_tick_inactive_gap.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify targeted behavior
        run: |
          grep -Fq 'let timerRingCount =' ClockTimer.js
          grep -Fq 'return timerRingCount > 1' ClockTimer.js
          grep -Fq 'data-clock-timer-ring' ClockTimer.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/adjust_tick_inactive_gap.py
          rm -f .github/workflows/adjust-tick-inactive-gap.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/adjust_tick_inactive_gap.py .github/workflows/adjust-tick-inactive-gap.yml
          git commit -m "Place ticks against innermost inactive ring"
          git push origin main
