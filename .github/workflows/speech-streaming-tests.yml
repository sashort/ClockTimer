name: Speech streaming tests

on:
  pull_request:
    paths:
      - "SpeechMenu.js"
      - "SpeechRecognitionProviders.js"
      - "SpeechAudioWorklet.js"
      - "SpeechMicBar.js"
      - "app.js"
      - "speech/**"
      - "tests/speech-*.mjs"
      - "tests/package.json"
      - ".github/workflows/speech-streaming-tests.yml"
  workflow_dispatch:

jobs:
  speech:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm run test:speech-pipeline
