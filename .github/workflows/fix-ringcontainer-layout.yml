name: Fix RingContainer layout

on:
  push:
    paths:
      - '.github/workflows/fix-ringcontainer-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch RingContainer
        run: python .github/scripts/fix-ringcontainer-layout.py

      - name: Syntax check
        run: node --check RingContainer.js

      - name: Targeted checks
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('RingContainer.js').read_text()
          assert '#layoutInsetTarget;' in text
          assert '::slotted(time-range)' in text
          assert 'position: absolute;' in text
          assert 'width: 100%;' in text
          assert 'height: 100%;' in text
          assert 'const resizeAnimation =' in text
          assert 'this.#resizeAnimation !==' in text
          assert 'ring.#layoutInsetTarget ??' in text
          assert 'commitAttributes: true' in text
          assert '#resizeTarget' not in text
          assert 'customElements.define' in text
          PY

      - name: Commit repair and cleanup
        run: |
          rm .github/workflows/fix-ringcontainer-layout.yml
          rm .github/scripts/fix-ringcontainer-layout.py
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add RingContainer.js .github/workflows/fix-ringcontainer-layout.yml .github/scripts/fix-ringcontainer-layout.py
          git commit -m "Stabilize RingContainer layout and range sizing"
          git push
