name: Add ClockTimer stop
on:
  push:
    paths:
      - '.github/workflows/add-stop.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch ClockTimer
        run: python .github/scripts/add-stop.py
      - name: Validate JavaScript
        run: node --check ClockTimer.js
      - name: Commit result and clean helper files
        run: |
          rm .github/scripts/add-stop.py .github/workflows/add-stop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add immediate ClockTimer stop behavior'
          git push
