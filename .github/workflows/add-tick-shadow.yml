name: Add ClockTimer tick shadows
on:
  push:
    paths:
      - '.github/workflows/add-tick-shadow.yml'
      - '.github/scripts/add_tick_shadow.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/add_tick_shadow.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify shadow
        run: |
          grep -Fq -- '--clock-timer-tick-shadow:' ClockTimer.js
          grep -Fq '0 0 1px rgb(0 0 0 / 75%)' ClockTimer.js
          grep -Fq 'box-shadow:' ClockTimer.js
      - name: Commit
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Add tick mark contrast shadows" || exit 0
          git push origin main
