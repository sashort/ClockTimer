name: Remove graphical grayscale controls
on:
  push:
    paths:
      - '.github/workflows/remove-grayscale-graphical-controls.yml'
      - '.github/scripts/remove_grayscale_graphical_controls.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply graphical grayscale removal
        run: python .github/scripts/remove_grayscale_graphical_controls.py
      - name: Validate
        run: |
          node --check app.js
          ! grep -Fq 'name="grayscale"' index.html
          ! grep -Fq 'name="grayscaleRamp"' index.html
          ! grep -Fq 'grayscale: text("grayscale")' app.js
          ! grep -Fq 'grayscaleRamp: text("grayscaleRamp")' app.js
          grep -Fq 'target.removeAttribute("grayscale");' app.js
          grep -Fq 'target.removeAttribute("grayscale-ramp");' app.js
      - name: Commit source changes and cleanup
        run: |
          rm -f .github/scripts/remove_grayscale_graphical_controls.py
          rm -f .github/workflows/remove-grayscale-graphical-controls.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add index.html app.js .github/scripts/remove_grayscale_graphical_controls.py .github/workflows/remove-grayscale-graphical-controls.yml
          git commit -m "Remove grayscale controls from graphical settings"
          git push origin rename-prestart-latency
