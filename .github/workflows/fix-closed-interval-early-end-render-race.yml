name: Fix closed interval early-end render race
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/fix-closed-interval-early-end-render-race.yml'
      - '.github/scripts/fix_closed_interval_early_end_render_race.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: python .github/scripts/fix_closed_interval_early_end_render_race.py
      - name: Syntax checks
        run: |
          node --check ClockTimer.js
          node --check TimeRange.js
      - name: Verify closed early-end rebuild is immediate
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("ClockTimer.js").read_text()

          assert '#removeInsertedSegments({\n            animate = true' in text
          assert 'animate &&\n                    typeof range.removeAnimated' in text
          assert '#renderAllInsertedRanges({\n            animateRemoval = true' in text
          assert 'animate: animateRemoval' in text

          start = text.index('        #endBufferedPendingInterval(')
          end = text.index('        #endPendingInterval(', start)
          block = text[start:end]
          assert 'this.#renderAllInsertedRanges({\n                animateRemoval: false\n            });' in block

          # The early-end helper is used for every finite pending closed interval,
          # regardless of interval type or whether buffers exist.
          pending = text[end:text.index('        #startIntervalLocal(', end)]
          assert 'this.#endBufferedPendingInterval(\n                    record,\n                    now\n                )' in pending
          PY
      - name: Commit source fix
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Fix closed interval early-end render race" || exit 0
          git push origin HEAD:rename-prestart-latency
