name: Apply Trip Log startup state

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/apply_trip_log_startup_state.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply changes
        run: python3 .github/scripts/apply_trip_log_startup_state.py

      - name: Validate JavaScript
        run: node --check app.js

      - name: Validate startup hooks
        run: |
          grep -q 'tripLogStartup' index.html
          grep -q 'data-trip-log-startup="unpinned"' app.css
          grep -q 'delete document.documentElement.dataset.tripLogStartup' app.js

      - name: Check whitespace
        run: git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css app.js
          git commit -m "Apply unpinned Trip Log before first paint"
          git push origin HEAD:rename-prestart-latency
