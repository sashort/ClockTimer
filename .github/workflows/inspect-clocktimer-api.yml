name: Inspect ClockTimer API
on:
  push:
    branches: [rename-prestart-latency]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public method definitions
        run: |
          python3 - <<'PY'
          import re
          p='ClockTimer.js'
          lines=open(p,encoding='utf-8').read().splitlines()
          for i,line in enumerate(lines,1):
              if re.match(r'^        (?:async\s+)?[A-Za-z_$][\w$]*\s*\(', line):
                  print(f'{i}: {line.strip()}')
          print('\nRelevant definitions/snippets:')
          names=['start','stop','clear','reset','startInterval','closeInterval','insert','overwrite','replaceWithNext','replaceToNext','replaceWithPrevious','replaceToPrevious','toJSON']
          for name in names:
              pat=re.compile(r'^        (?:async\s+)?'+re.escape(name)+r'\s*\(')
              for idx,line in enumerate(lines):
                  if pat.match(line):
                      lo=max(0,idx-2); hi=min(len(lines),idx+45)
                      print(f'\n--- {name} @ {idx+1} ---')
                      for j in range(lo,hi): print(f'{j+1}: {lines[j]}')
                      break
          PY
