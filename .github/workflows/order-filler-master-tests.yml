name: Order Filler master tests
on:
  push:
    branches-ignore: [pocketsphinx-experiment] # Its deployment workflow gates on both masters.
  pull_request:
  workflow_dispatch:
jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        method: [press, voice]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npm run test:order-filler:${{ matrix.method }}
        working-directory: tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-filler-${{ matrix.method }}
          path: tests/artifacts/
