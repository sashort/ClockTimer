name: Adjust transition timings
on:
  push:
    paths:
      - '.github/workflows/adjust-transition-timings.yml'
      - '.github/scripts/adjust_transition_timings.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply transition timing patch
        run: python .github/scripts/adjust_transition_timings.py
      - name: Validate
        run: |
          node --check app.js
          node --check ClockTimer.js
          grep -Fq '1500ms;' ClockTimer.js
          grep -Fq 'const STARTUP_CONNECTION_DELAY = 2000;' app.js
          grep -Fq 'const STARTUP_GRAYSCALE_RAMP = 2000;' app.js
          grep -Fq 'const LOGIN_GRAYSCALE_RAMP = 750;' app.js
          grep -Fq 'transition: filter var(--app-grayscale-ramp, 2000ms) linear;' app.css
      - name: Commit source changes and cleanup
        run: |
          rm -f .github/scripts/adjust_transition_timings.py
          rm -f .github/workflows/adjust-transition-timings.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js app.js app.css .github/scripts/adjust_transition_timings.py .github/workflows/adjust-transition-timings.yml
          git commit -m "Adjust startup and clock fade timings"
          git push origin rename-prestart-latency
