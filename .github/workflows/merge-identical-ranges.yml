name: Merge identical ranges
on:
  push:
    paths:
      - '.github/workflows/merge-identical-ranges.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/merge-identical-ranges.py
      - run: node --check ClockTimer.js
      - name: Verify merge normalization
        run: |
          grep -q '#mergeAdjacentIdenticalRanges() {' ClockTimer.js
          grep -q '#rangesAreMergeIdentical(' ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()
          start = text.index('\n        #refreshRingLayout(')
          brace = text.index('{\n', start)
          body = text[brace:brace+250]
          assert 'this.#mergeAdjacentIdenticalRanges();' in body
          assert '"overwrite"' in text[text.index('#getRangeMergeAttributes'):text.index('#getRangeMergeClockTimerState')]
          PY
      - name: Commit
        run: |
          rm .github/scripts/merge-identical-ranges.py
          rm .github/workflows/merge-identical-ranges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/merge-identical-ranges.py .github/workflows/merge-identical-ranges.yml
          git commit -m 'Merge adjacent identical time ranges'
          git push
