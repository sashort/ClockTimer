name: Remove ClockTimer ignore-overlaps
on:
  push:
    paths:
      - '.github/workflows/remove-clocktimer-ignore-overlaps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cleanup
        run: python .github/scripts/remove_clocktimer_ignore_overlaps.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify ClockTimer no longer owns ignore-overlaps
        run: |
          ! grep -q 'ignore-overlaps' ClockTimer.js
          grep -q 'ignore-overlaps' TimeRange.js
      - name: Commit update and cleanup
        run: |
          rm .github/scripts/remove_clocktimer_ignore_overlaps.py
          rm .github/workflows/remove-clocktimer-ignore-overlaps.yml
          git config user.name sashort
          git config user.email 95879519+sashort@users.noreply.github.com
          git add ClockTimer.js .github/scripts/remove_clocktimer_ignore_overlaps.py .github/workflows/remove-clocktimer-ignore-overlaps.yml
          git commit -m 'Make ignore-overlaps internal to TimeRange'
          git push
