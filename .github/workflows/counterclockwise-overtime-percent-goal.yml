name: Counterclockwise overtime percent goal
on:
  push:
    paths:
      - '.github/workflows/counterclockwise-overtime-percent-goal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply overtime direction patch
        run: python .github/scripts/counterclockwise_overtime_percent_goal.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Targeted checks
        run: |
          grep -Fq 'const previousGoal =' ClockTimer.js
          grep -Fq 'previousGoal < 1 &&' ClockTimer.js
          grep -Fq 'counterclockwiseOvertimeRemoval = false' ClockTimer.js
          grep -Fq '? "start"' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm -f .github/workflows/counterclockwise-overtime-percent-goal.yml
          rm -f .github/scripts/counterclockwise_overtime_percent_goal.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github
          git commit -m 'Sweep removed overtime counterclockwise on goal increase'
          git push origin main
