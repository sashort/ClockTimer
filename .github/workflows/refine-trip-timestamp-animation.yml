name: Refine trip timestamp animation

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/refine_trip_timestamp_animation.py
      - .github/workflows/refine-trip-timestamp-animation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Apply animation refinement
        run: python .github/scripts/refine_trip_timestamp_animation.py
      - name: Validate
        run: |
          node --check app.js
          node --check ClockTimer.js
          grep -F 'flex-basis var(--trip-start-transition-duration)' app.css
          grep -F 'tripSetStartsNowCancel.disabled = !active' app.js
          grep -F 'button.setAttribute("aria-hidden", String(!active))' app.js
      - name: Commit and cleanup
        run: |
          rm .github/scripts/refine_trip_timestamp_animation.py
          rm .github/workflows/refine-trip-timestamp-animation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css .github/scripts/refine_trip_timestamp_animation.py .github/workflows/refine-trip-timestamp-animation.yml
          git commit -m "Animate trip timestamp controls"
          git push origin HEAD:rename-prestart-latency
