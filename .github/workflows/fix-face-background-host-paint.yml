name: Fix face background host paint
on:
  push:
    paths:
      - '.github/workflows/fix-face-background-host-paint.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-face-background-host-paint.py
      - run: node --check ClockTimer.js
      - run: |
          grep -q 'this.style.setProperty' ClockTimer.js
          ! grep -q 'hostBackgroundOverride' ClockTimer.js
      - run: |
          rm .github/scripts/fix-face-background-host-paint.py
          rm .github/workflows/fix-face-background-host-paint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/fix-face-background-host-paint.py .github/workflows/fix-face-background-host-paint.yml
          git commit -m 'Keep host paint transparent outside clock face'
          git push
