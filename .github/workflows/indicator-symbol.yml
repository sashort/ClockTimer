name: Indicator symbol
on:
  push:
    paths:
      - '.github/workflows/indicator-symbol.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/indicator-symbol.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify indicator symbol
        run: |
          grep -q 'indicator-symbol-content' ClockTimer.js
          grep -q '#updateIndicatorSymbol' ClockTimer.js
          grep -q 'var(--clock-timer-ring-resize-duration)' ClockTimer.js
          grep -q '"indicator-symbol"' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm .github/workflows/indicator-symbol.yml .github/scripts/indicator-symbol.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/indicator-symbol.yml .github/scripts/indicator-symbol.py
          git commit -m 'Add elapsed indicator symbol'
          git push
