name: Fix indicator angle
on:
  push:
    paths:
      - '.github/workflows/fix-indicator-angle.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/fix-indicator-angle.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify angle uses clock hour
        run: |
          grep -q 'millisecondsIntoHour' ClockTimer.js
          grep -q 'end % ClockTimer.#HOUR' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm .github/workflows/fix-indicator-angle.yml .github/scripts/fix-indicator-angle.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/fix-indicator-angle.yml .github/scripts/fix-indicator-angle.py
          git commit -m 'Align indicator symbol to elapsed endpoint'
          git push
