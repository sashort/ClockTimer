name: Inspect fromJSON finally
on:
  push:
    paths:
      - .github/workflows/inspect-fromjson-finally.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          p=s.index('fromJSON(')
          q=s.index('\n        get status()', p)
          b=s[p:q]
          i=b.index('this.#started =\n                    true;')
          print(b[i-500:i+5000])
          PY
