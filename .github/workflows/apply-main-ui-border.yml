name: Apply main UI padding

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-main-ui-border.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply document padding
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("app.css"); s=p.read_text(); old="    padding: 0;\n    display: grid;\n    grid-template-rows: 52px 142px 62px 29px 122px 1fr 74px;"; new="    padding: 0.125in;\n    display: grid;\n    grid-template-rows: 52px 142px 62px 29px 122px 1fr 74px;"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'

      - name: Commit document padding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-main-ui-border.yml
          git add app.css
          git commit -m "Add main UI document padding"
          git push origin HEAD:rename-prestart-latency
