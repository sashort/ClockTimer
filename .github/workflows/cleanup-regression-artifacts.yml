name: Cleanup regression artifacts
on:
  push:
    paths:
      - '.github/workflows/cleanup-regression-artifacts.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove generated test artifacts
        run: |
          rm -rf node_modules
          rm -f .github/workflows/cleanup-regression-artifacts.yml
          git config user.name sashort
          git config user.email '95879519+sashort@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated regression dependencies'
          git push
