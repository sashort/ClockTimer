name: Fix Down open interval rendering
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/fix-down-open-interval-rendering.yml'
      - '.github/scripts/fix_down_open_interval_rendering.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: python .github/scripts/fix_down_open_interval_rendering.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify open-ended rendering in both timer types
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()
          marker = '        #updateOpenEndedRangeTo(\n            now\n        ) {'
          start = text.index(marker)
          end = text.index('        #updateOpenEndedRange(\n            nowDate', start)
          block = text[start:end]
          assert 'this.#syncOpenEndedRangeElements(' in block
          assert 'this.#getTimerType()' not in block
          assert 'record,' in block and 'now' in block

          sync_marker = '        #syncOpenEndedRangeElements(\n            record,\n            effectiveEnd\n        ) {'
          sync_start = text.index(sync_marker)
          sync_end = text.index('        #shiftRangesAfter(', sync_start)
          sync = text[sync_start:sync_end]
          assert '#getTimerRingIndex' in sync
          assert '#getTimerRingEnd' in sync
          assert '#createTimeRange(' in sync
          assert 'this.#setRangeTiming(' in sync
          PY
      - name: Commit source fix
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Fix Down interval rendering" || exit 0
          git push origin HEAD:rename-prestart-latency
