name: Fix open insert initial span
on:
  push:
    paths:
      - '.github/workflows/fix-open-insert-initial-span.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/fix_open_insert_initial_span.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify initial positive span
        run: |
          grep -Fq ': start + 1' ClockTimer.js
          grep -Fq '#syncOpenEndedRangeElements(' ClockTimer.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/fix_open_insert_initial_span.py
          rm -f .github/workflows/fix-open-insert-initial-span.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix_open_insert_initial_span.py .github/workflows/fix-open-insert-initial-span.yml
          git commit -m "Fix open insert initial visual span"
          git push origin main
