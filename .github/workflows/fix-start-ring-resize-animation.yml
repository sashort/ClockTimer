name: Fix start ring resize animation
on:
  push:
    paths:
      - '.github/workflows/fix-start-ring-resize-animation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply start ring animation fix
        run: python .github/scripts/fix-start-ring-resize-animation.py
      - name: Syntax check
        run: |
          node --check RingContainer.js
          node --check ClockTimer.js
          node --check TimeRange.js
      - name: Verify animation guard
        run: |
          grep -q 'this.#animationPhase !==' RingContainer.js
          grep -q 'this.#refreshChildVisualGeometry();' RingContainer.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/fix-start-ring-resize-animation.py
          rm .github/workflows/fix-start-ring-resize-animation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RingContainer.js .github/scripts/fix-start-ring-resize-animation.py .github/workflows/fix-start-ring-resize-animation.yml
          git commit -m 'Preserve ClockTimer start ring resize animations'
          git push
