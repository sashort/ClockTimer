name: Retry status and network status separation 2
on:
  push:
    paths:
      - '.github/workflows/separate-status-network-retry2.yml'
      - '.github/scripts/separate_status_network_retry2.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Apply status separation retry 2
        run: python .github/scripts/separate_status_network_retry2.py
      - name: Validate JavaScript syntax
        run: |
          node --check ClockTimer.js
          node --check app.js
      - name: Validate status semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          clock = Path('ClockTimer.js').read_text()
          app = Path('app.js').read_text()
          checks = [
              ('ready status', 'return "ready";' in clock),
              ('networkStatus getter', 'get networkStatus()' in clock),
              ('online network value', '? "online"' in clock),
              ('offline network value', ': "offline";' in clock),
              ('network status event', '"networkStatusChanged"' in clock),
              ('event network detail', 'networkStatus: this.networkStatus' in clock),
              ('app network listener', 'addEventListener("networkStatusChanged"' in app),
              ('app network dataset', 'app.dataset.networkStatus' in app),
              ('app lifecycle dataset', 'app.dataset.state = clockTimer.status' in app),
              ('no legacy setOffline', 'setOffline(' not in app),
              ('no app connected network checks', 'clockTimer.connected' not in app),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('failed checks: ' + ', '.join(failed))
          status_start = clock.index('        get status() {')
          status_end = clock.index('        get state() {', status_start)
          status_block = clock[status_start:status_end]
          if 'offline' in status_block or 'connected' in status_block:
              raise SystemExit('status getter still contains network semantics')
          PY
          git diff --check
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js app.js
          git commit -m "Separate timer status from network status"
          git push origin rename-prestart-latency
      - name: Remove temporary patch files
        run: |
          git rm -f \
            .github/scripts/separate_status_network.py \
            .github/scripts/separate_status_network_retry.py \
            .github/scripts/separate_status_network_retry2.py \
            .github/workflows/separate-status-network.yml \
            .github/workflows/separate-status-network-retry.yml \
            .github/workflows/separate-status-network-retry2.yml
          git commit -m "Remove status separation patch files"
          git push origin rename-prestart-latency
