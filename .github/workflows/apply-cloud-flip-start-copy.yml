name: Apply cloud flip and start copy timing

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-cloud-flip-start-copy.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply UI animation changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text()

          old = '''    const TRIP_START_TRANSITION_DURATION = 250;
              const buttonPressStates = new WeakMap();'''
          new = '''    const TRIP_START_TRANSITION_DURATION = 250;
              const CLOUD_ICON_TRANSITION_DURATION = 750;
              const cloudIconTransitions = new WeakMap();
              const buttonPressStates = new WeakMap();'''
          if old not in s:
              raise SystemExit('app.js constants anchor not found')
          s = s.replace(old, new, 1)

          old = '''    function normalizedConnectionStatus(value = clockTimer.networkStatus) {
                  return value === "online" ? "online" : "offline";
              }

              function syncTripSettingsCloud(status = clockTimer.networkStatus) {'''
          new = '''    function normalizedConnectionStatus(value = clockTimer.networkStatus) {
                  return value === "online" ? "online" : "offline";
              }

              function setCloudIconVisualState(element, getState, applyState, nextState, { animate = true } = {}) {
                  if (!element || typeof getState !== "function" || typeof applyState !== "function") {
                      applyState?.(nextState);
                      return;
                  }

                  let controller = cloudIconTransitions.get(element);
                  if (!controller) {
                      controller = {
                          chain: Promise.resolve(),
                          animation: undefined,
                          generation: 0,
                          targetState: getState()
                      };
                      cloudIconTransitions.set(element, controller);
                  }

                  if (!animate) {
                      controller.generation += 1;
                      controller.animation?.cancel();
                      controller.animation = undefined;
                      controller.chain = Promise.resolve();
                      controller.targetState = nextState;
                      element.style.transform = "";
                      applyState(nextState);
                      return;
                  }

                  if (controller.targetState === nextState) return;
                  controller.targetState = nextState;
                  const generation = controller.generation;

                  controller.chain = controller.chain.then(async () => {
                      if (generation !== controller.generation) return;
                      if (getState() === nextState) return;

                      const halfDuration = CLOUD_ICON_TRANSITION_DURATION / 2;
                      controller.animation = element.animate(
                          [
                              { transform: "rotateY(0deg)" },
                              { transform: "rotateY(90deg)" }
                          ],
                          { duration: halfDuration, easing: "linear", fill: "forwards" }
                      );

                      try { await controller.animation.finished; }
                      catch { return; }
                      if (generation !== controller.generation) return;

                      applyState(nextState);
                      element.style.transform = "rotateY(-90deg)";
                      controller.animation.cancel();
                      controller.animation = element.animate(
                          [
                              { transform: "rotateY(-90deg)" },
                              { transform: "rotateY(0deg)" }
                          ],
                          { duration: halfDuration, easing: "linear", fill: "forwards" }
                      );

                      try { await controller.animation.finished; }
                      catch { return; }
                      if (generation !== controller.generation) return;

                      element.style.transform = "";
                      controller.animation.cancel();
                      controller.animation = undefined;
                  }).catch(() => {});
              }

              function syncTripSettingsCloud(status = clockTimer.networkStatus) {'''
          if old not in s:
              raise SystemExit('connection helper anchor not found')
          s = s.replace(old, new, 1)

          old = '''        const normalized = status === "pending" ? "pending" : normalizedConnectionStatus(status);
                  tripSettingsCloud.dataset.networkStatus = normalized;
                  tripSettingsCloud.setAttribute("aria-busy", String(normalized === "pending"));'''
          new = '''        const normalized = status === "pending" ? "pending" : normalizedConnectionStatus(status);
                  setCloudIconVisualState(
                      tripSettingsCloud,
                      () => tripSettingsCloud.dataset.networkStatus,
                      value => { tripSettingsCloud.dataset.networkStatus = value; },
                      normalized,
                      { animate: Boolean(tripSettingsCloud.dataset.networkStatus) }
                  );
                  tripSettingsCloud.setAttribute("aria-busy", String(normalized === "pending"));'''
          if old not in s:
              raise SystemExit('trip settings cloud anchor not found')
          s = s.replace(old, new, 1)

          old = '''            numberPadSettingsArea.dataset.persistence = status;
                      numberPadSettingsArea.dataset.connectionPhase =
                          phase === "awaiting-login" ? "retry" : phase;'''
          new = '''            setCloudIconVisualState(
                          numberPadConnection,
                          () => numberPadSettingsArea.dataset.persistence,
                          value => { numberPadSettingsArea.dataset.persistence = value; },
                          status,
                          {
                              animate:
                                  phase !== "initial" &&
                                  phase !== "initial-cloud"
                          }
                      );
                      numberPadSettingsArea.dataset.connectionPhase =
                          phase === "awaiting-login" ? "retry" : phase;'''
          if old not in s:
              raise SystemExit('numberpad persistence anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app.css')
          s = p.read_text()

          old = '''.number-pad-settings[data-connection-phase="initial-cloud"] .number-pad-persistence-badge,
          .number-pad-settings[data-connection-phase="cloud-fade"] .number-pad-persistence-badge {
              animation: number-pad-cloud-fade-in 250ms linear both;
          }'''
          new = '''.number-pad-settings[data-connection-phase="initial-cloud"] .number-pad-persistence-badge {
              animation: number-pad-cloud-fade-in 250ms linear both;
          }

          .number-pad-settings[data-connection-phase="cloud-fade"] .number-pad-persistence-badge,
          .number-pad-settings[data-connection-phase="handoff"] .number-pad-persistence-badge {
              animation: none;
          }'''
          if old not in s:
              raise SystemExit('numberpad fade anchor not found')
          s = s.replace(old, new, 1)

          old = '''.trip-now-actions.is-exiting .trip-now-start-copy {
              transform-origin: right center;
              animation: trip-now-start-copy-grow-from-right var(--trip-start-transition-duration) ease-in-out both;
          }'''
          new = '''.trip-now-actions.is-exiting .trip-now-start-copy {
              width: var(--trip-now-start-copy-width, auto);
              opacity: 1;
              transition: none;
              transform-origin: right center;
              animation: trip-now-start-copy-grow-from-right var(--trip-start-transition-duration) ease-in-out both;
          }'''
          if old not in s:
              raise SystemExit('start copy exit anchor not found')
          s = s.replace(old, new, 1)

          marker = '/* cloud-icon-y-flip-v1 */'
          if marker not in s:
              s = s.rstrip() + '''\n\n/* cloud-icon-y-flip-v1 */
          .number-pad-persistence-badge,
          .trip-settings-cloud {
              transform-style: preserve-3d;
              backface-visibility: hidden;
              will-change: transform;
          }\n'''
          p.write_text(s)
          PY
          node --check app.js
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cloud-flip-start-copy.yml
          git add app.js app.css
          git diff --cached --check
          git commit -m "Refine cloud flips and start copy timing"
          git push origin HEAD:rename-prestart-latency
