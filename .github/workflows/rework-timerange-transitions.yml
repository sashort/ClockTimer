name: Rework TimeRange transitions
on:
  push:
    paths:
      - '.github/workflows/rework-timerange-transitions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transition changes
        run: python .github/scripts/rework-timerange-transitions.py
      - name: Syntax checks
        run: |
          node --check TimeRange.js
          node --check ClockTimer.js
      - name: Targeted checks
        run: |
          grep -q 'transitionTo({' TimeRange.js
          grep -q '#reconcilePlannedRanges()' ClockTimer.js
          grep -q '#animateStartedRingWidths()' ClockTimer.js
          grep -q 'data-clock-timer-target-width' ClockTimer.js
          grep -q 'ring.setAttribute(' ClockTimer.js
          grep -q '"0px"' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/rework-timerange-transitions.py
          rm .github/workflows/rework-timerange-transitions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js ClockTimer.js .github/scripts/rework-timerange-transitions.py .github/workflows/rework-timerange-transitions.yml
          git commit -m 'Morph TimeRange boundaries and animate start clear widths'
          git push