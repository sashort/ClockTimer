name: Apply Trip Log symmetry, Sync flip, and header fix

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-triplog-symmetry-sync-flip-header-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply and validate
        run: |
          python3 .github/scripts/apply_triplog_symmetry_sync_flip_header_fix.py
          node --check app.js
          node --check ClockTimer.js
          git diff --check
          grep -q 'const TRIP_LIST_BUTTON_TRANSITION_DURATION = 350;' app.js
          grep -q 'const TRIP_LIST_BODY_DELAY = 125;' app.js
          grep -q 'const TRIP_LIST_BODY_DURATION = 425;' app.js
          grep -q 'const TRIP_LIST_MERGE_DURATION = 300;' app.js
          grep -q 'rotateY(90deg)' app.js
          grep -q 'background: transparent;' app.css
          if grep -q 'background: var(--ui-navy-gradient);' <(sed -n '/\.app-header {/,/}/p' app.css); then
            echo 'Painted app-header styling remains' >&2
            exit 1
          fi
          git add app.js app.css
          git commit -m "Match Trip Log timing and fix header styling"
      - name: Push changes
        run: git push origin HEAD:rename-prestart-latency
