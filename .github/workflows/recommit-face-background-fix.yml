name: Recommit face background fix

on:
  push:
    paths:
      - '.github/workflows/recommit-face-background-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/scripts/fix-face-background-host-paint-v3.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify host paint is suppressed
        run: |
          grep -q 'this.style.setProperty(' ClockTimer.js
          grep -q '"background-color"' ClockTimer.js
          grep -q '"transparent"' ClockTimer.js
      - name: Commit functional change and clean patch files
        run: |
          rm -f \
            .github/scripts/fix-face-background-host-paint.py \
            .github/scripts/fix-face-background-host-paint-v2.py \
            .github/scripts/fix-face-background-host-paint-v3.py \
            .github/workflows/fix-face-background-host-paint.yml \
            .github/workflows/fix-face-background-host-paint-v2.yml \
            .github/workflows/fix-face-background-host-paint-v3.yml \
            .github/workflows/recommit-face-background-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep clock face background inside border'
          git push
