name: Refine radial fitted ClockTimer
'on':
  push:
    branches:
      - radial-fitted-controller
    paths:
      - '.github/workflows/refine-radial-fitted.yml'
      - '.github/scripts/refine_radial_fitted.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted
          path: target
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted-controller
          path: controller
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply radial-fitted refinement
        run: python controller/.github/scripts/refine_radial_fitted.py target/ClockTimer.js
      - name: Syntax check
        run: node --check target/ClockTimer.js
      - name: Commit refinement on target branch
        working-directory: target
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Refine radial fitted animation coordination" || exit 0
          git push origin radial-fitted
