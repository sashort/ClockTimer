name: Round static TimeRange caps
on:
  push:
    paths:
      - '.github/workflows/round-static-time-range-caps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/round-static-time-range-caps.py
      - run: node --check TimeRange.js
      - run: grep -q -- '-webkit-mask-image' TimeRange.js
      - run: |
          rm .github/scripts/round-static-time-range-caps.py
          rm .github/workflows/round-static-time-range-caps.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/scripts/round-static-time-range-caps.py .github/workflows/round-static-time-range-caps.yml
          git commit -m 'Round static TimeRange end caps'
          git push
