name: Fix open overwrite trigger
on:
  push:
    paths:
      - '.github/workflows/fix-open-overwrite-trigger.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-open-overwrite-trigger.py
      - run: node --check ClockTimer.js
      - name: Verify
        run: |
          grep -q 'const hasAdjacentRange' ClockTimer.js
          grep -q 'this.overwrite({' ClockTimer.js
          ! grep -A120 '#processElapsedOverwriteRanges' ClockTimer.js | grep -q 'endTime:'
      - name: Commit
        run: |
          rm .github/scripts/fix-open-overwrite-trigger.py .github/workflows/fix-open-overwrite-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make tick overwrite open-ended only'
          git push
