name: Patch ClockTimer hand snap and format

on:
  push:
    paths:
      - '.github/scripts/patch_clocktimer_hand_snap_format.py'
      - '.github/workflows/patch-clocktimer-hand-snap-format.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/patch_clocktimer_hand_snap_format.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Commit source change
        run: |
          if git diff --quiet -- ClockTimer.js; then
            echo "No ClockTimer.js changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Refine ClockTimer hand rendering and format"
          git push
