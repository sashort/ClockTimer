name: Add stopTime corrected
on:
  push:
    paths:
      - '.github/workflows/add-stop-time.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add-stop-time.py
      - run: node --check ClockTimer.js
      - run: |
          rm .github/workflows/add-stop-time.yml .github/scripts/add-stop-time.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allow optional stopTime in ClockTimer stop'
          git push
