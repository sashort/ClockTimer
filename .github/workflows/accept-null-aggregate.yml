name: Accept null aggregate data

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/accept-null-aggregate.yml'
      - '.github/scripts/accept_null_aggregate.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency

      - name: Apply null aggregate patch
        run: python .github/scripts/accept_null_aggregate.py

      - name: Syntax check
        run: |
          node --check ClockTimer.js
          node --check app.js

      - name: Verify aggregate availability semantics
        run: |
          grep -Fq 'get hasAggregateData()' ClockTimer.js
          grep -Fq 'return this.#hasUsableAggregateSnapshot();' ClockTimer.js
          grep -Fq 'clockTimer.hasAggregateData === true' app.js
          grep -Fq 'get hasAggregateTrips()' ClockTimer.js

      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/accept_null_aggregate.py
          rm -f .github/workflows/accept-null-aggregate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js app.js .github/scripts/accept_null_aggregate.py .github/workflows/accept-null-aggregate.yml
          git commit -m "Treat null aggregate snapshot as valid data"
          git push origin rename-prestart-latency
