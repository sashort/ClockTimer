name: Fix trip settings handoff order
on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/fix-trip-settings-handoff-order.yml'
      - '.github/scripts/fix_trip_settings_handoff_order.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Apply handoff order fix
        run: python .github/scripts/fix_trip_settings_handoff_order.py
      - name: Syntax check
        run: node --check app.js
      - name: Verify handoff order
        run: |
          grep -Fq 'if (tripSettingsHandoff && !tripSettingsDialog.open)' app.js
          grep -Fq 'if (!openTripSettingsDialog(reason, { duration: 0 })) return false;' app.js
          grep -Fq 'numberPadClosedState = tripSettingsHandoff && state' app.js
          ! grep -Fq 'tripSettingsOpenAfterPadClose' app.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/fix_trip_settings_handoff_order.py
          rm -f .github/workflows/fix-trip-settings-handoff-order.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js .github/scripts/fix_trip_settings_handoff_order.py .github/workflows/fix-trip-settings-handoff-order.yml
          git commit -m "Show trip settings before closing number pad"
          git push origin rename-prestart-latency
