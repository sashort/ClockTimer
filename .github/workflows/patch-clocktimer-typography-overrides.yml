name: Patch ClockTimer typography overrides

on:
  push:
    paths:
      - '.github/workflows/patch-clocktimer-typography-overrides.yml'
      - '.github/scripts/patch_clocktimer_typography_overrides.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/patch_clocktimer_typography_overrides.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify typography behavior
        run: |
          grep -q 'numberLayer.style.fontFamily' ClockTimer.js
          grep -q 'numberLayer.style.fontSize' ClockTimer.js
          ! grep -q 'element.style.fontFamily' ClockTimer.js
          ! grep -q 'element.style.fontSize' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Allow ClockTimer typography overrides" || exit 0
          git push origin main
