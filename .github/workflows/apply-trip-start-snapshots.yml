name: Apply trip start snapshot toggles

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-trip-start-snapshots.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          python .github/apply-trip-start-snapshots.py
          node --check app.js
          git diff --check

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-trip-start-snapshots.yml
          git rm .github/apply-trip-start-snapshots.py
          git add app.js
          git diff --cached --check
          git commit -m "Snapshot trip starts during now selection"
          git push origin HEAD:rename-prestart-latency
