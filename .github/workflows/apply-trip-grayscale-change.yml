name: Apply trip grayscale change

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-trip-grayscale-change.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply trip grayscale behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          index = index_path.read_text()
          old_main = '<main id="app" class="app is-offline" data-state="offline" data-trip-state="ready">'
          new_main = '<main id="app" class="app is-offline" data-state="offline" data-trip-state="ready" data-trip-grayscale-ramp="250">'
          if index.count(old_main) != 1:
              raise SystemExit(f"Expected one index.html app marker, found {index.count(old_main)}")
          index_path.write_text(index.replace(old_main, new_main, 1))

          app_path = Path("app.js")
          app = app_path.read_text()

          old_offline = '''        if (offline) {
            app.style.setProperty("--app-grayscale-ramp", `${STARTUP_GRAYSCALE_RAMP}ms`);
            app.classList.add("is-offline");
            loginPromptTimeout = setTimeout(() => {'''
          new_offline = '''        if (offline) {
            if (tripIsLive()) {
                app.style.setProperty("--app-grayscale-ramp", `${tripGrayscaleRamp()}ms`);
                app.classList.remove("is-offline");
            }
            else {
                app.style.setProperty("--app-grayscale-ramp", `${STARTUP_GRAYSCALE_RAMP}ms`);
                app.classList.add("is-offline");
            }
            loginPromptTimeout = setTimeout(() => {'''
          if app.count(old_offline) != 1:
              raise SystemExit(f"Expected one offline grayscale block, found {app.count(old_offline)}")
          app = app.replace(old_offline, new_offline, 1)

          old_controls = '''    function setTripControlState(running) {
        app.dataset.tripState = running ? "running" : "ready";
        app.dataset.state = clockTimer.status;
        activeTripControls.hidden = !running;
        renderTripActionState();
    }'''
          new_controls = '''    function tripGrayscaleRamp() {
        const value = Number(app.dataset.tripGrayscaleRamp);
        return Number.isFinite(value) && value >= 0 ? value : 250;
    }

    function syncTripGrayscale(running = tripIsLive()) {
        app.style.setProperty("--app-grayscale-ramp", `${tripGrayscaleRamp()}ms`);

        if (running) {
            if (!app.classList.contains("is-offline")) return;
            requestAnimationFrame(() => {
                if (tripIsLive()) app.classList.remove("is-offline");
            });
            return;
        }

        if (clockTimer.networkStatus === "online" || app.classList.contains("is-offline")) return;
        requestAnimationFrame(() => {
            if (!tripIsLive() && clockTimer.networkStatus !== "online") {
                app.classList.add("is-offline");
            }
        });
    }

    function setTripControlState(running) {
        app.dataset.tripState = running ? "running" : "ready";
        app.dataset.state = clockTimer.status;
        syncTripGrayscale(running);
        activeTripControls.hidden = !running;
        renderTripActionState();
    }'''
          if app.count(old_controls) != 1:
              raise SystemExit(f"Expected one setTripControlState block, found {app.count(old_controls)}")
          app_path.write_text(app.replace(old_controls, new_controls, 1))
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-trip-grayscale-change.yml
          git add app.js index.html
          git commit -m "Update trip grayscale transitions"
          git push origin HEAD:rename-prestart-latency
