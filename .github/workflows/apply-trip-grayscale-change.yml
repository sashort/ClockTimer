name: Apply trip grayscale change

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-trip-grayscale-change.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Apply requested changes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply-trip-grayscale.py
          python /tmp/apply-trip-grayscale.py
      - name: Commit requested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-trip-grayscale-change.yml
          git add app.js index.html
          git commit -m "Update trip grayscale transitions"
          git push origin HEAD:rename-prestart-latency
