name: Fix forward overwrite target
on:
  push:
    paths:
      - '.github/workflows/fix-forward-overwrite-target.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-forward-overwrite-target.py
      - run: node --check ClockTimer.js
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()
          start = text.index('        replaceWithNext() {')
          end = text.index('        replaceToNext(', start)
          method = text[start:end]
          assert 'currentRange?.removeAttribute' in method
          assert 'nextRange.removeAttribute' not in method
          start2 = end
          end2 = text.index('        replaceWithPrevious()', start2)
          method2 = text[start2:end2]
          assert 'currentRange.removeAttribute' in method2
          PY
      - name: Commit
        run: |
          rm .github/scripts/fix-forward-overwrite-target.py .github/workflows/fix-forward-overwrite-target.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/fix-forward-overwrite-target.py .github/workflows/fix-forward-overwrite-target.yml
          git commit -m 'Fix overwrite removal target for forward replacement'
          git push
