name: Inspect ring layout reconstruction
on:
  push:
    paths:
      - .github/workflows/inspect-ring-layout.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ring helpers
        run: |
          grep -n -E '#getRingIndex|#getRingStart|#ensureRing|#refreshRingLayout|#reorderRings|#rings' ClockTimer.js | head -200
          for name in '#getRingIndex' '#getRingStart' '#ensureRing' '#refreshRingLayout'; do
            line=$(grep -n -m1 "$name" ClockTimer.js | cut -d: -f1)
            echo "===== $name at $line ====="
            sed -n "$((line-25)),$((line+140))p" ClockTimer.js
          done
