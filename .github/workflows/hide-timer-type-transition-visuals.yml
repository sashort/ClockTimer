name: Hide timer type transition visuals

on:
  push:
    branches:
      - radial-fitted-controller
    paths:
      - .github/scripts/hide_timer_type_transition_visuals.py
      - .github/workflows/hide-timer-type-transition-visuals.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted-controller
          path: controller

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted
          fetch-depth: 0
          path: target

      - name: Verify expected target base
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "fece519d4eeded3f02b9b1e3828d64f8813aa3ee"

      - name: Apply transition visual hiding change
        run: |
          python controller/.github/scripts/hide_timer_type_transition_visuals.py target/ClockTimer.js

      - name: Syntax check
        working-directory: target
        run: node --check ClockTimer.js

      - name: Verify transition visual hiding
        working-directory: target
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()

          required = [
              'displayInlineValue:',
              'displayInlinePriority:',
              '"display",\n                "none",\n                "important"',
              'opacityState.displayInlineValue',
              'opacityState.displayInlinePriority',
              '#startTimerTypeTransitionVisualFade(',
              'duration: 750,',
          ]

          for item in required:
              assert item in text, item

          assert text.count('"display",\n                "none",\n                "important"') == 1
          assert text.count('displayInlineValue') >= 3
          assert text.count('displayInlinePriority') >= 3
          PY
          git diff --check

      - name: Commit update on target branch
        working-directory: target
        run: |
          if git diff --quiet -- ClockTimer.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Hide transition overlays until outward phase"
          git push origin HEAD:radial-fitted
