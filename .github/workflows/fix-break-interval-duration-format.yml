name: Fix break interval duration format
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/fix-break-interval-duration-format.yml'
      - '.github/scripts/fix_break_interval_duration_format.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: python .github/scripts/fix_break_interval_duration_format.py
      - name: Syntax check
        run: node --check app.js
      - name: Verify interval duration format
        run: |
          grep -Fq 'length: "15:00"' app.js
          grep -Fq 'length: "30:00"' app.js
          grep -Fq 'length: "10:00"' app.js
          grep -Fq '            "2:30",' app.js
          ! grep -Fq 'length: "0:15:00"' app.js
          ! grep -Fq 'length: "0:30:00"' app.js
          ! grep -Fq 'length: "0:10:00"' app.js
          ! grep -Fq '"0:02:30"' app.js
      - name: Commit source changes
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js
          git commit -m "Fix break interval duration format" || exit 0
          git push origin HEAD:rename-prestart-latency
