name: Revert ClockTimer hand snap

on:
  push:
    paths:
      - '.github/workflows/revert-clocktimer-hand-snap.yml'
      - '.github/scripts/revert_clocktimer_hand_snap.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hand revert
        run: python .github/scripts/revert_clocktimer_hand_snap.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git diff --cached --quiet && exit 0
          git commit -m "Revert ClockTimer hand pixel snapping"
          git push origin main
