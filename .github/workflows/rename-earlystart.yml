name: Rename earlystart TimeRange type
on:
  push:
    paths:
      - '.github/workflows/rename-earlystart.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python .github/scripts/rename-earlystart.py
      - run: node --check ClockTimer.js
      - name: Commit patch and cleanup
        run: |
          rm .github/workflows/rename-earlystart.yml .github/scripts/rename-earlystart.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js .github/workflows/rename-earlystart.yml .github/scripts/rename-earlystart.py
          git commit -m "Rename early-start TimeRange type to earlystart"
          git push
