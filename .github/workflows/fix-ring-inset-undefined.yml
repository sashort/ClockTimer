name: Fix RingContainer undefined inset
'on':
  push:
    branches:
      - radial-fitted-controller
    paths:
      - '.github/workflows/fix-ring-inset-undefined.yml'
      - '.github/scripts/fix_ring_inset_undefined.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted
          path: target
      - name: Verify expected target base
        run: test "$(git -C target rev-parse HEAD)" = "acec7dee1d85a0c4699e4cb685bd2bf2a96e2141"
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted-controller
          path: controller
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply undefined inset fix
        run: python controller/.github/scripts/fix_ring_inset_undefined.py target/RingContainer.js
      - name: Syntax check
        run: node --check target/RingContainer.js
      - name: Structural check
        run: grep -A6 -B2 'inset !== null' target/RingContainer.js | grep -q 'inset !== undefined'
      - name: Commit fix on target branch
        working-directory: target
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add RingContainer.js
          git commit -m "Handle undefined automatic ring inset" || exit 0
          git push origin radial-fitted
