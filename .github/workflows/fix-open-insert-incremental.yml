name: Fix open insert incremental updates
on:
  push:
    paths:
      - '.github/workflows/fix-open-insert-incremental.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/fix_open_insert_incremental.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify incremental open insert path
        run: |
          grep -Fq '#syncOpenEndedRangeElements(' ClockTimer.js
          grep -Fq '#shiftInsertedRangeElements(' ClockTimer.js
          grep -Fq 'renderInserted = true' ClockTimer.js
          grep -Fq 'this.#syncOpenEndedRangeElements(' ClockTimer.js
          grep -Fq 'this.#copyClockTimerRangeState(' ClockTimer.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/fix_open_insert_incremental.py
          rm -f .github/workflows/fix-open-insert-incremental.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix_open_insert_incremental.py .github/workflows/fix-open-insert-incremental.yml
          git commit -m "Fix open insert incremental updates"
          git push origin main
