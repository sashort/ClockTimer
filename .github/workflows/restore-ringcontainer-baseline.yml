name: Restore RingContainer baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-ringcontainer-baseline.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore baseline and targeted fixes
        run: python .github/scripts/restore-ringcontainer-baseline.py

      - name: Syntax check
        run: node --check RingContainer.js

      - name: Targeted checks
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('RingContainer.js').read_text()
          assert '::slotted(time-range)' not in text
          assert 'this.#animationTargetInset ===\n                targetInset' in text
          assert 'this.#animationTargetWidth ===\n                targetWidth' in text
          assert '#finishAnimation(\n        expectedToken' in text
          assert 'expectedToken !==\n                this.#animationToken' in text
          assert 'this.#finishAnimation(\n                        token' in text
          PY

      - name: Commit baseline and cleanup
        run: |
          rm .github/scripts/restore-ringcontainer-baseline.py
          rm .github/workflows/restore-ringcontainer-baseline.yml
          git config user.name sashort
          git config user.email 95879519+sashort@users.noreply.github.com
          git add RingContainer.js .github/scripts/restore-ringcontainer-baseline.py .github/workflows/restore-ringcontainer-baseline.yml
          git commit -m "Restore RingContainer baseline with resize safeguards"
          git push
