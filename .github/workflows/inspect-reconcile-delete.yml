name: Inspect reconcile delete
on:
  push:
    paths:
      - '.github/workflows/inspect-reconcile-delete.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -n -A220 -B20 '#reconcilePlannedRanges' ClockTimer.js | tail -260
          grep -n -A80 -B20 '#removeOvertimeRanges' ClockTimer.js | head -120
          grep -n -A80 -B20 '#getManagedTimeRanges' ClockTimer.js | head -120
      - run: |
          rm .github/workflows/inspect-reconcile-delete.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove reconciliation inspection workflow'
          git push
