name: Implement interval controls

on:
  push:
    paths:
      - '.github/workflows/implement-interval-controls.yml'
      - '.github/scripts/implement_interval_controls.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply interval controls patch
        run: python .github/scripts/implement_interval_controls.py
      - name: Syntax check
        run: |
          node --check ClockTimer.js
          node --check app.js
      - name: Verify interval semantics
        run: |
          grep -Fq 'tripAutomaticallyRestarted' ClockTimer.js
          grep -Fq 'downTimeStarted' ClockTimer.js
          grep -Fq 'getActiveIntervalState(now = new Date())' ClockTimer.js
          grep -Fq 'Select Break Type' index.html
          grep -Fq 'data-break-type="short-break"' index.html
          grep -Fq 'name="lateBreakBehavior"' index.html
          grep -Fq 'clockTimer.startInterval("down")' app.js
          grep -Fq 'renderTripActionState(event.detail?.now)' app.js
          grep -Fq '"0:02:30"' app.js
          grep -Fq 'grid-template-columns: repeat(3, minmax(0, 1fr));' app.css
      - name: Commit interval controls and cleanup
        run: |
          rm -f .github/scripts/implement_interval_controls.py
          rm -f .github/workflows/implement-interval-controls.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js app.js app.css index.html .github/scripts/implement_interval_controls.py .github/workflows/implement-interval-controls.yml
          git commit -m "Implement break and down interval controls"
          git push origin rename-prestart-latency
