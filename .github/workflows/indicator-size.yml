name: Indicator size
on:
  push:
    paths:
      - '.github/workflows/indicator-size.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/indicator-size.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify responsive indicator size
        run: |
          grep -q 'clock-timer-auto-indicator-symbol-size' ClockTimer.js
          grep -q 'renderedWidth' ClockTimer.js
          grep -q 'symbolSize' ClockTimer.js
          grep -q 'scheduleIndicatorSymbolUpdate' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm .github/workflows/indicator-size.yml .github/scripts/indicator-size.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/indicator-size.yml .github/scripts/indicator-size.py
          git commit -m 'Size indicator symbol from active ring'
          git push
