name: Fix trip defaults elapsed and rings

on:
  push:
    branches: [rename-prestart-latency]
    paths:
      - .github/workflows/fix-trip-defaults-elapsed-rings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply fixes
        run: python .github/scripts/fix_trip_defaults_elapsed_rings.py

      - name: Validate JavaScript
        run: |
          node --check ClockTimer.js
          node --check app.js
          git diff --check

      - name: Validate bug fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          clock = Path('ClockTimer.js').read_text()
          app = Path('app.js').read_text()
          checks = {
              'prepare at moment': 'async prepareTrip({ timeout = 5000, at } = {})' in clock,
              'prepared scheduled start': 'scheduledStart: time' in clock,
              'stopped stop time': 'stopTime: persistedEnd' in clock,
              'open elapsed freeze': '#getOpenIntervalDuration(' in clock and 'this.#getOpenIntervalDuration(' in clock,
              'elapsed truncation': '#formatElapsedRenderedDuration(' in clock and 'Math.trunc(milliseconds / 1000) * 1000' in clock,
              'active width': 'var(--clock-timer-active-ring-width, clamp(4px, 2.5cqi, 12px))' in clock,
              'inactive width': 'var(--clock-timer-inactive-ring-width, clamp(2px, 1.25cqi, 6px))' in clock,
              'number pad defaults': 'tripDefaults' in app and 'getTripMomentDefaults' in app,
              'new trip moment': 'beginNewTripWorkflow({ tripMoment: new Date() })' in app,
              'stop moment handoff': 'event.detail?.stopTime' in app,
              'start explicit defaults': 'creationTime: tripDefaults?.creationTime' in app,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('failed checks: ' + ', '.join(failed))
          PY

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js app.js
          git commit -m "Fix trip defaults elapsed freeze and ring widths"
          git push

      - name: Remove temporary patch files
        run: |
          git rm -f .github/scripts/fix_trip_defaults_elapsed_rings.py .github/workflows/fix-trip-defaults-elapsed-rings.yml
          git commit -m "Remove trip timing patch files"
          git push
