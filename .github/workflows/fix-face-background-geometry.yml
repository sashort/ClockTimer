name: Fix face background geometry
on:
  push:
    paths:
      - '.github/workflows/fix-face-background-geometry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-face-background-geometry.py
      - run: node --check ClockTimer.js
      - run: grep -q 'Number.parseFloat' ClockTimer.js
      - run: |
          rm -f .github/scripts/fix-face-background-geometry.py
          rm -f .github/workflows/fix-face-background-geometry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/fix-face-background-geometry.py .github/workflows/fix-face-background-geometry.yml
          git commit -m 'Confine face background using rendered border geometry'
          git push
