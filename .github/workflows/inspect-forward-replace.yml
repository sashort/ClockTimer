name: Inspect forward replace
on:
  push:
    paths:
      - '.github/workflows/inspect-forward-replace.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -n -A220 -B20 'replaceWithNext()' ClockTimer.js
          grep -n -A260 -B20 'replaceToNext(' ClockTimer.js
      - run: |
          rm .github/workflows/inspect-forward-replace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove forward replace inspection workflow'
          git push
