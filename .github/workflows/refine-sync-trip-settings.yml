name: Refine sync and trip settings
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/refine-sync-trip-settings.yml'
      - '.github/scripts/refine_sync_trip_settings_and_state_snap.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refinements
        run: python .github/scripts/refine_sync_trip_settings_and_state_snap.py
      - name: Syntax check
        run: node --check app.js
      - name: Verify requested UI behavior
        run: |
          grep -Fq 'sync-three-state-and-trip-settings-v1' app.js
          grep -Fq 'sync-three-state-and-trip-settings-v1' app.css
          grep -Fq 'sync-icon-spinning' app.js
          grep -Fq 'trip-state-snap' app.js
          grep -Fq 'height: 54px;' app.css
          grep -Fq 'grid-auto-rows: max-content;' app.css
          grep -Fq 'data-sync-network-state="offline"]::after' app.css
      - name: Commit source changes
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js app.css
          git commit -m "Simplify sync states and fix trip settings sizing" || exit 0
          git push origin HEAD:rename-prestart-latency
