name: Add ClockTimer toJSON
on:
  push:
    paths:
      - '.github/workflows/add-tojson.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/add-tojson.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify toJSON
        run: |
          grep -F 'toJSON() {' ClockTimer.js
          grep -F 'yyyy' ClockTimer.js >/dev/null || true
          grep -F 'creationDate:' ClockTimer.js
          grep -F 'standardTime:' ClockTimer.js
          grep -F 'scheduledStart:' ClockTimer.js
          grep -F 'records: []' ClockTimer.js
          grep -F '"overwrite"' ClockTimer.js >/dev/null
      - name: Commit
        run: |
          rm .github/scripts/add-tojson.py .github/workflows/add-tojson.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/add-tojson.py .github/workflows/add-tojson.yml
          git commit -m 'Add ClockTimer toJSON serialization'
          git push
