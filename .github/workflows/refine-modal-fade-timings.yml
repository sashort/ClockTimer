name: Refine modal fade timings
on:
  push:
    paths:
      - '.github/workflows/refine-modal-fade-timings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Apply fade timing changes
        shell: python
        run: |
          from pathlib import Path

          css = Path('app.css')
          text = css.read_text()
          text = text.replace('''[popover] {\n    opacity: 0;\n    transition-property: opacity, display, overlay;\n    transition-duration: 750ms;''', '''[popover] {\n    opacity: 0;\n    transition-property: opacity, display, overlay;\n    transition-duration: 250ms;''')
          text = text.replace('''    transition-property: opacity, display, overlay;\n    transition-duration: 750ms;\n    transition-timing-function: linear;\n    transition-behavior: normal, allow-discrete, allow-discrete;\n}\n\n.app-dialog[open] {''', '''    transition-property: opacity, display, overlay;\n    transition-duration: 250ms;\n    transition-timing-function: linear;\n    transition-behavior: normal, allow-discrete, allow-discrete;\n}\n\n.login-dialog.initial-login-opening {\n    transition-duration: 750ms;\n}\n\n.app-dialog[open] {''')
          text = text.replace('''    opacity: 0;\n    transition: opacity 750ms linear;\n}\n\n.app-dialog[open]::backdrop {''', '''    opacity: 0;\n    transition: opacity 250ms linear;\n}\n\n.login-dialog.initial-login-opening::backdrop {\n    transition-duration: 750ms;\n}\n\n.app-dialog[open]::backdrop {''')
          css.write_text(text)

          js = Path('app.js')
          text = js.read_text()
          text = text.replace('''    const LOGIN_GRAYSCALE_RAMP = 750;\n''', '''    const LOGIN_GRAYSCALE_RAMP = 750;\n    const INITIAL_LOGIN_FADE_DURATION = 750;\n''')
          marker = '''    function syncConnectionUI(connected) {\n        profileMenuButton.hidden = !connected;\n        authButton.textContent = connected ? "Logout" : "Login";\n        authButton.classList.toggle("logout-button", connected);\n    }\n\n'''
          insert = marker + '''    function showInitialLoginDialog() {\n        if (loginDialog.open) return;\n        loginDialog.classList.add("initial-login-opening");\n        loginDialog.showModal();\n        setTimeout(() => {\n            loginDialog.classList.remove("initial-login-opening");\n        }, INITIAL_LOGIN_FADE_DURATION);\n    }\n\n    function closeDialog(dialog) {\n        if (!dialog?.open) return;\n        dialog.classList.remove("initial-login-opening");\n        dialog.close();\n    }\n\n'''
          if marker not in text:
              raise SystemExit('syncConnectionUI marker not found')
          text = text.replace(marker, insert, 1)
          text = text.replace('''                if (!clockTimer.connected && !loginDialog.open) loginDialog.showModal();''', '''                if (!clockTimer.connected && !loginDialog.open) showInitialLoginDialog();''', 1)
          text = text.replace('''        if (loginDialog.open) loginDialog.close();''', '''        if (loginDialog.open) closeDialog(loginDialog);''', 1)
          text = text.replace('''        button.addEventListener("click", () => button.closest("dialog")?.close());''', '''        button.addEventListener("click", () => closeDialog(button.closest("dialog")));''', 1)
          text = text.replace('''        graphicalDialog.close();''', '''        closeDialog(graphicalDialog);''', 1)
          text = text.replace('''        stateDialog.close();''', '''        closeDialog(stateDialog);''', 1)
          text = text.replace('''        profileDialog.close();''', '''        closeDialog(profileDialog);''', 1)
          js.write_text(text)
      - name: Validate
        run: |
          node --check app.js
          grep -q 'transition-duration: 250ms' app.css
          grep -q 'initial-login-opening' app.css
          grep -q 'INITIAL_LOGIN_FADE_DURATION = 750' app.js
      - name: Commit source changes and cleanup
        run: |
          git config user.name 'sashort'
          git config user.email '95879519+sashort@users.noreply.github.com'
          git add app.css app.js
          git rm .github/workflows/refine-modal-fade-timings.yml
          git commit -m 'Use 750ms only for initial login fade in'
          git push origin HEAD:rename-prestart-latency
