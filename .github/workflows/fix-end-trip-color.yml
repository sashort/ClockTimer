name: Fix end trip color binding

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/fix-end-trip-color.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply fix
        run: |
          set -euo pipefail
          python .github/scripts/fix_end_trip_color.py
          git diff --check

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-end-trip-color.yml
          git rm .github/scripts/fix_end_trip_color.py
          git add app.css
          git diff --cached --check
          git commit -m "Keep end trip color independent"
          git push origin HEAD:rename-prestart-latency
