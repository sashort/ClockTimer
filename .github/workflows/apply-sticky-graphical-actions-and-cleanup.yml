name: Run graphical settings layout cleanup

on:
  push:
    branches: [rename-prestart-latency]
    paths: [.github/workflows/apply-sticky-graphical-actions-and-cleanup.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - run: python .github/scripts/apply_sticky_graphical_actions_and_cleanup.py
      - run: node --check app.js
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make graphical settings actions sticky'
          git push origin HEAD:rename-prestart-latency
