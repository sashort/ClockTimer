name: Normalize RingContainer attributes
on:
  push:
    paths:
      - '.github/workflows/normalize-ring-attributes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply RingContainer normalization
        run: python .github/scripts/normalize-ring-attributes.py
      - name: Syntax check
        run: node --check RingContainer.js
      - name: Targeted checks
        run: |
          grep -n 'set width(value)' RingContainer.js
          grep -n 'set inset(value)' RingContainer.js
          grep -n 'set margin(value)' RingContainer.js
          grep -n '#normalizeLengthToPixels' RingContainer.js
          grep -n '#refreshNormalizedLengthAttributes' RingContainer.js
          grep -n 'new ResizeObserver' RingContainer.js
      - name: Commit change and cleanup
        run: |
          rm -f .github/workflows/normalize-ring-attributes.yml
          rm -f .github/scripts/normalize-ring-attributes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RingContainer.js .github
          git commit -m 'Normalize RingContainer attributes to pixels'
          git push
