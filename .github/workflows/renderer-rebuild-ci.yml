name: Validate ClockTimer renderer rebuild

on:
  push:
    branches:
      - rebuild-clocktimer-renderer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-clocktimer-renderer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Syntax check core components
        run: |
          node --check ClockTimer.js
          node --check RingContainer.js
          node --check TimeRange.js
          node --check app.js
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Renderer and UI tests
        working-directory: tests
        run: |
          npm run test:ui-state
          node graphical-settings-layout.mjs
          node time-range-ring-container.mjs
          npm run test:custom-range
          npm run test:trip-editor
