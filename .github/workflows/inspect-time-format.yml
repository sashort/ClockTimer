name: Inspect time-format validation
on:
  push:
    paths:
      - .github/workflows/inspect-time-format.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
            grep -n -A120 -B20 '#normalizeFormat' ClockTimer.js || true
            grep -n -A80 -B20 '#getDefaultFormat' ClockTimer.js || true
            grep -n -A120 -B20 '#updateDisplay' ClockTimer.js || true
          } > FORMAT_INSPECT.txt
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FORMAT_INSPECT.txt
          git commit -m "Capture ClockTimer time-format validation"
          git push
