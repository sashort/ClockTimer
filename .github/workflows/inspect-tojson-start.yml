name: Inspect toJSON start state
on:
  push:
    paths:
      - '.github/workflows/inspect-tojson-start.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect assignments
        run: |
          grep -n -F 'this.#startedAtEpoch =' ClockTimer.js || true
          grep -n -F 'this.#creationMilliseconds =' ClockTimer.js || true
          grep -n -F 'start({' ClockTimer.js || true
          line=$(grep -n -m1 -F 'start({' ClockTimer.js | cut -d: -f1)
          if [ -n "$line" ]; then sed -n "$((line)), $((line+320))p" ClockTimer.js; fi
      - name: Cleanup
        run: |
          rm .github/workflows/inspect-tojson-start.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-tojson-start.yml
          git commit -m 'Remove toJSON start inspection workflow'
          git push
