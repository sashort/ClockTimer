name: Fix atomic split animation
on:
  push:
    paths:
      - '.github/workflows/fix-atomic-split-animation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/fix_atomic_split_animation.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify atomic split
        run: |
          grep -Fq 'const isSplit =' ClockTimer.js
          grep -Fq 'range.snapToLogicalTiming();' ClockTimer.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/fix_atomic_split_animation.py
          rm -f .github/workflows/fix-atomic-split-animation.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix_atomic_split_animation.py .github/workflows/fix-atomic-split-animation.yml
          git commit -m "Make inserted range splits atomic"
          git push origin main
