name: Fix elapsed wave wrap
on:
  push:
    paths:
      - '.github/workflows/fix-elapsed-wave-wrap.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/fix-elapsed-wave-wrap.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify wave seam relocation
        run: |
          grep -q 'transparent calc(180deg - var(--elapsed-wave-width' TimeRange.js
          grep -q '\${rgba(strength)} 180deg' TimeRange.js
          grep -q 'startAngle - waveWidth - 180' TimeRange.js
          grep -q 'sweepEndAngle + waveWidth - 180' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm .github/workflows/fix-elapsed-wave-wrap.yml .github/scripts/fix-elapsed-wave-wrap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/workflows/fix-elapsed-wave-wrap.yml .github/scripts/fix-elapsed-wave-wrap.py
          git commit -m 'Prevent elapsed wave wraparound spill'
          git push
