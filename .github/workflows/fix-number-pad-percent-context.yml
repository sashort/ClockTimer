name: Fix number pad percent context

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/fix-number-pad-percent-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - run: python .github/scripts/fix_number_pad_percent_context.py
      - run: node --check app.js
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Keep percent context key orange"
          git push origin HEAD:rename-prestart-latency
      - name: Cleanup patch files
        run: |
          git pull --rebase origin rename-prestart-latency
          git rm .github/workflows/fix-number-pad-percent-context.yml .github/scripts/fix_number_pad_percent_context.py
          git commit -m "Remove number pad percent context patch files"
          git push origin HEAD:rename-prestart-latency
