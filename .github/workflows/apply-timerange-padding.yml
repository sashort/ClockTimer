name: Apply TimeRange padding
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_timerange_padding.py
      - run: node --check TimeRange.js
      - run: git config user.name sashort
      - run: git config user.email 95879519+sashort@users.noreply.github.com
      - run: git add TimeRange.js
      - run: git commit -m "Respect parent padding in fitted TimeRange modes"
      - run: git push
