name: Apply reference pattern sitewide

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-reference-pattern-sitewide.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply CSS changes
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'reference-pattern-sitewide-v1' app.css; then
            echo 'sitewide reference pattern already applied'
            exit 1
          fi
          cat >> app.css <<'CSS'

          /* reference-pattern-sitewide-v1 */
          :root {
              --app-document-padding: 0.125in;
              --wm-blue: #0053e2;
              --wm-blue-dark: #001e60;
              --wm-blue-mid: #003b9b;
              --wm-yellow: #ffc420;
              --ui-navy-gradient: #001e60;
              --ui-blue-gradient: #0053e2;
              --ui-yellow-gradient: #ffc420;
              --ui-gray-gradient: #5f6772;
              --ui-charcoal-gradient: linear-gradient(180deg, #46515c 0%, #2f3943 45%, #202933 100%);
              --ui-green-gradient: #2e7d32;
          }

          .app {
              padding: var(--app-document-padding);
              background: var(--wm-blue);
          }

          .app .trip-action-controls,
          .app .active-trip-controls,
          .app .trip-action-row,
          .app .percent-summary,
          .app .independent-timer-controls {
              background: transparent;
          }

          .main-menu:popover-open {
              inset:
                  calc(var(--app-document-padding) + 52px + 14px)
                  auto
                  auto
                  var(--app-document-padding);
          }

          .main-menu::before,
          .main-menu::after {
              left: 26px;
          }

          .main-menu {
              background: var(--wm-blue-dark);
          }

          .main-menu::after {
              border-bottom-color: var(--wm-blue-dark);
          }

          .dialog-header,
          .number-pad-context {
              background: var(--ui-charcoal-gradient);
              border-bottom: 1px solid rgb(255 255 255 / 28%);
              box-shadow: inset 0 1px 0 rgb(255 255 255 / 14%);
          }

          .dialog-close {
              background: transparent;
          }

          .app-dialog {
              background: var(--wm-blue-dark);
          }

          .app-dialog fieldset,
          .clock-preview {
              background: color-mix(in srgb, var(--wm-blue-dark) 88%, var(--wm-blue) 12%);
              border-color: rgb(255 255 255 / 54%);
          }

          .app-dialog input,
          .app-dialog select {
              background: var(--wm-blue-dark);
              border-color: rgb(255 255 255 / 62%);
          }

          .trip-time-edit,
          .trip-now-action,
          .trip-time-now-toggle,
          .number-pad-settings {
              background: var(--wm-blue);
          }

          .trip-time-value,
          .dialog-actions .primary-action,
          .number-pad-readout,
          .new-trip-button,
          .end-trip-button,
          .break-button,
          .break-type-button.lunch {
              background: var(--wm-yellow);
          }

          .number-pad-grid,
          .number-pad-key,
          .break-type-button {
              background: var(--wm-blue-dark);
          }

          .number-pad-confirm {
              background: var(--wm-blue);
          }

          .number-pad-meridiem.is-selected {
              color: var(--wm-yellow);
              box-shadow: 0 7px 13px rgb(0 0 0 / 42%), 0 0 0 2px rgb(255 196 32 / 24%);
          }

          .trip-now-action {
              display: grid;
              grid-template-columns:
                  min-content
                  minmax(0, 1fr)
                  min-content
                  min-content;
              align-items: center;
              justify-content: stretch;
              column-gap: 0.3em;
              transition:
                  grid-template-columns var(--trip-start-transition-duration) ease-in-out,
                  flex-basis var(--trip-start-transition-duration) ease-in-out,
                  padding-inline var(--trip-start-transition-duration) ease-in-out,
                  font-size var(--trip-start-transition-duration) ease-in-out,
                  opacity 250ms ease-in-out,
                  filter 250ms ease-in-out,
                  color 250ms ease-in-out,
                  border-color 250ms ease-in-out,
                  box-shadow 250ms ease-in-out;
          }

          .trip-now-actions.is-selecting .trip-now-action {
              grid-template-columns:
                  min-content
                  minmax(0, 0fr)
                  min-content
                  min-content;
          }

          .trip-now-start-copy,
          .trip-now-actions.is-selecting .trip-now-start-copy,
          .trip-now-actions.is-exiting .trip-now-start-copy {
              width: auto;
              min-width: 0;
              max-width: none;
              overflow: hidden;
              white-space: nowrap;
              opacity: 1;
              text-align: right;
              transform: none;
              animation: none;
              transition: none;
          }
          CSS
          python -c "from pathlib import Path; p=Path('app.css'); p.write_text(p.read_text().rstrip() + '\n')"
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-reference-pattern-sitewide.yml
          git add app.css
          git diff --cached --check
          git commit -m "Apply reference pattern sitewide"
          git push origin HEAD:rename-prestart-latency
