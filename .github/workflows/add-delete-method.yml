name: Add ClockTimer delete
on:
  push:
    paths:
      - '.github/workflows/add-delete-method.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add-delete-method.py
      - run: node --check ClockTimer.js
      - name: Verify delete API
        run: |
          grep -q '^[[:space:]]*delete(timeRange)' ClockTimer.js
          grep -q '"tolerance"' ClockTimer.js
          grep -q '#rebuildAfterRangeDeletion' ClockTimer.js
      - name: Commit
        run: |
          rm .github/scripts/add-delete-method.py .github/workflows/add-delete-method.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add ClockTimer delete method'
          git push
