name: Audit DOM internals
on:
  push:
    paths:
      - '.github/workflows/audit-dom-internals.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit internal DOM attributes
        run: |
          for f in ClockTimer.js RingContainer.js TimeRange.js; do
            echo "===== $f data/style audit ====="
            grep -nE 'data-|dataset\.|\.style\.|setAttribute\([[:space:]]*["'"'"']style|style\.setProperty|style\.removeProperty' "$f" || true
          done
