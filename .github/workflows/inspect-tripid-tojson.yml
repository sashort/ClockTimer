name: Inspect tripId toJSON
on:
  push:
    paths:
      - '.github/workflows/inspect-tripid-tojson.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect toJSON and fields
        run: |
          grep -n -F 'toJSON()' ClockTimer.js || true
          grep -n -F 'creationDate' ClockTimer.js || true
          line=$(grep -n -m1 -F 'toJSON()' ClockTimer.js | cut -d: -f1)
          if [ -n "$line" ]; then sed -n "$((line-180)),$((line+320))p" ClockTimer.js; fi
      - name: Cleanup
        run: |
          rm .github/workflows/inspect-tripid-tojson.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-tripid-tojson.yml
          git commit -m 'Remove tripId inspection workflow'
          git push
