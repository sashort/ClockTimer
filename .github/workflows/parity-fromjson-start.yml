name: Parity fromJSON start configuration
on:
  push:
    paths:
      - .github/workflows/parity-fromjson-start.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/parity-fromjson-start.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          section=s[s.index('        fromJSON(json) {'):s.index('        get status() {')]
          assert 'this.#percentGoal =\n                    this.#getPercentGoal();' in section
          assert 'const originalPercentGoal' not in section
          assert 'this.#percentGoal =\n                        originalPercentGoal;' not in section
          assert '!Number.isFinite(\n                        this.#tickAlignmentMilliseconds\n                    )' in section
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/parity-fromjson-start.py
          rm -f .github/workflows/parity-fromjson-start.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js .github
          git commit -m "Match fromJSON start configuration state"
          git push
