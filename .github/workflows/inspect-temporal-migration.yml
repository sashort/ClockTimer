name: Inspect temporal migration
on:
  push:
    paths:
      - .github/workflows/inspect-temporal-migration.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect temporal helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          needles=['uniformDate','normalizeFormat','formatTime','formatDate','rangeLength','Duration','CSS time','animationDuration','parseInsertDateTime','parseInsertRangeLength','formatDuration','validateDuration','validateClockTime']
          for fn in ['ClockTimer.js','TimeRange.js','RingContainer.js']:
            print('\n###',fn)
            lines=Path(fn).read_text().splitlines()
            hits=[]
            for i,line in enumerate(lines,1):
              if any(n.lower() in line.lower() for n in needles):
                hits.append(i)
            seen=set()
            for i in hits:
              start=max(1,i-3); end=min(len(lines),i+12)
              key=(start,end)
              if key in seen: continue
              seen.add(key)
              print(f'--- {start}-{end} ---')
              for j in range(start,end+1): print(f'{j}: {lines[j-1]}')
          PY
