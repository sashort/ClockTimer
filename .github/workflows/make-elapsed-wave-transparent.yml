name: Make elapsed wave transparent
on:
  push:
    paths:
      - '.github/workflows/make-elapsed-wave-transparent.yml'
      - '.github/scripts/make_elapsed_wave_transparent.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply transparent elapsed wave patch
        run: python .github/scripts/make_elapsed_wave_transparent.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify transparent adaptive wave
        run: |
          grep -Fq 'background: transparent !important;' TimeRange.js
          grep -Fq 'this.#elapsedWaveLayer.style.mixBlendMode =' TimeRange.js
          grep -Fq '"screen";' TimeRange.js
          grep -Fq 'subtree: true' TimeRange.js
          grep -Fq 'childList: true' TimeRange.js
          ! grep -Fq 'useDarkWave' TimeRange.js
          ! grep -Fq 'waveChannel' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm -f .github/scripts/make_elapsed_wave_transparent.py
          rm -f .github/workflows/make-elapsed-wave-transparent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TimeRange.js .github/scripts/make_elapsed_wave_transparent.py .github/workflows/make-elapsed-wave-transparent.yml
          git commit -m "Make elapsed wave transparent and underlay-aware"
          git push origin main
