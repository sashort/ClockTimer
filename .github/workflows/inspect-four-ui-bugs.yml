name: Inspect four UI bugs

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/inspect-four-ui-bugs.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Inspect exact implementations and history
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def block(path, start, end):
              text = Path(path).read_text()
              a = text.find(start)
              b = text.find(end, a + len(start)) if a >= 0 else -1
              print(f"\n===== {path}: {start} =====")
              if a < 0:
                  print('MISSING START')
                  return
              if b < 0:
                  print(text[a:a+7000])
              else:
                  print(text[a:b])

          block('ClockTimer.js', '        #formatElapsedRenderedDuration(', '        #updateDisplay(')
          block('ClockTimer.js', '        #calculateRenderedTime(', '        #updateDisplay(')
          block('ClockTimer.js', '        #updateDisplay(', '        #startDisplayTimer(')
          block('ClockTimer.js', '        #shiftExistingTimeRanges(', '        #shiftInsertedRangeElements(')
          block('ClockTimer.js', '        #syncOpenEndedRangeElements(', '        #shiftRangesAfter(')
          block('ClockTimer.js', '        #updateOpenEndedRangeTo(', '        #updateOpenEndedRange(')
          block('ClockTimer.js', '        #normalizeFormat(', '        #getTimerType(')
          PY

          echo
          echo '===== historical plus/superscript candidates ====='
          git grep -n -E '⁺|<sup>|superscript|remaining.*\+' $(git for-each-ref --format='%(refname)' refs/remotes/origin) -- '*.js' '*.css' '*.html' 2>/dev/null | head -200 || true
