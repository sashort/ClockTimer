name: Fix closeOpenRange overwrite
on:
  push:
    paths:
      - '.github/workflows/fix-close-open-overwrite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python .github/scripts/fix-close-open-overwrite.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify closeOpenRange overwrite support
        run: |
          grep -q 'const overwriteRecord =' ClockTimer.js
          grep -q 'this.#updateOpenOverwriteRange(' ClockTimer.js
      - name: Commit fix and cleanup
        run: |
          rm .github/scripts/fix-close-open-overwrite.py
          rm .github/workflows/fix-close-open-overwrite.yml
          git config user.name sashort
          git config user.email 95879519+sashort@users.noreply.github.com
          git add -A
          git commit -m 'Fix closeOpenRange for open overwrite'
          git push origin main
