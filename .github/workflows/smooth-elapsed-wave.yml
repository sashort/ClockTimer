name: Smooth elapsed wave

on:
  push:
    paths:
      - '.github/workflows/smooth-elapsed-wave.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply smoother elapsed wave patch
        run: python .github/scripts/smooth-elapsed-wave.py

      - name: Syntax check
        run: node --check TimeRange.js

      - name: Verify smoother elapsed wave
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('TimeRange.js').read_text()
          checks = [
              'animation: elapsed-wave-sweep 4.5s linear infinite;',
              '33.333% {',
              '--elapsed-wave-width',
              'sweepAngle * 0.4',
              'startAngle - waveWidth',
              'sweepEndAngle + waveWidth',
          ]
          missing = [item for item in checks if item not in text]
          if missing:
              raise SystemExit(f'Missing expected changes: {missing}')
          PY

      - name: Commit change and cleanup
        run: |
          rm .github/workflows/smooth-elapsed-wave.yml
          rm .github/scripts/smooth-elapsed-wave.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/workflows/smooth-elapsed-wave.yml .github/scripts/smooth-elapsed-wave.py
          git commit -m 'Smooth elapsed gradient sweep on small arcs'
          git push
