name: Apply UI regression fixes

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-ui-regression-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply and validate
        run: |
          python3 .github/scripts/apply_ui_regression_fixes.py
          node --check app.js
          node --check ClockTimer.js
          git diff --check
          grep -q 'state &&' app.js
          grep -q 'sync-goals-menu-icon' index.html app.js app.css
          grep -q 'opacity: 0.58' app.css
          grep -q 'TRIP_LIST_BODY_DELAY' app.js
          grep -q 'class="hand-caption"' index.html
          if grep -q '>Show<input name="showHourHand"' index.html; then
            echo 'Show label remains on hand controls' >&2
            exit 1
          fi
          git add app.js app.css index.html
          git commit -m "Fix connection and Trip Log UI regressions"
      - name: Push changes
        run: git push origin HEAD:rename-prestart-latency
