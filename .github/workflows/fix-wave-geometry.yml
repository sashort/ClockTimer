name: Fix internal wave geometry
'on':
  push:
    branches:
      - fix-wave-geometry
    paths:
      - '.github/workflows/fix-wave-geometry.yml'
      - '.github/scripts/fix_wave_geometry.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          ref: fix-wave-geometry
          path: tools
      - name: Patch wave geometry
        working-directory: repo
        run: python ../tools/.github/scripts/fix_wave_geometry.py
      - name: Validate
        working-directory: repo
        run: node --check TimeRange.js
      - name: Commit
        working-directory: repo
        run: |
          git config user.name sashort
          git config user.email 95879519+sashort@users.noreply.github.com
          git add TimeRange.js
          git commit -m 'Fix internal wave segment geometry'
          git push origin main
