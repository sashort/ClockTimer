name: Enforce ClockTimer square layout

on:
  push:
    paths:
      - '.github/workflows/enforce-clocktimer-square.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply square layout
        run: python .github/scripts/enforce_clocktimer_square.py

      - name: Syntax check
        run: node --check ClockTimer.js

      - name: Targeted checks
        run: |
          grep -q 'min(100cqw, 100cqh)' ClockTimer.js
          grep -q 'aspect-ratio:' ClockTimer.js
          grep -q 'place-self:' ClockTimer.js

      - name: Commit change and cleanup
        run: |
          rm -f .github/workflows/enforce-clocktimer-square.yml
          rm -f .github/scripts/enforce_clocktimer_square.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/enforce-clocktimer-square.yml .github/scripts/enforce_clocktimer_square.py
          git commit -m 'Keep ClockTimer square and centered' || exit 0
          git push
