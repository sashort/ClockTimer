name: Apply centered measured trip start grid

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-centered-trip-start-grid.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply CSS changes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply-centered-grid.py
          python /tmp/apply-centered-grid.py
          python -c "from pathlib import Path; p=Path('app.css'); p.write_text(p.read_text().rstrip() + '\n')"
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-centered-trip-start-grid.yml
          git add app.css
          git diff --cached --check
          git commit -m "Center measured trip start grid"
          git push origin HEAD:rename-prestart-latency
