name: Apply UI and trip settings refinement

on:
  push:
    paths:
      - .github/workflows/apply-ui-trip-settings.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply UI refinement
        run: python .github/scripts/apply_ui_trip_settings.py

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check ClockTimer.js

      - name: Validate feature anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text()
          css = Path('app.css').read_text()
          html = Path('index.html').read_text()
          pad = Path('numberpad.html').read_text()
          clock = Path('ClockTimer.js').read_text()
          checks = [
              ('trip settings dialog', 'id="tripSettingsDialog"' in html),
              ('pencil edit controls', 'data-trip-time-field="actual-start"' in html),
              ('number pad title', 'id="numberPadContext"' in pad),
              ('AM and PM controls', 'data-meridiem="AM"' in pad and 'data-meridiem="PM"' in pad),
              ('date control', 'id="numberPadDate"' in pad),
              ('settings stack', 'tripSettingsPadStack' in app),
              ('absolute time editor', 'absoluteTimelineMilliseconds' in app),
              ('shared gradient keypad', '.number-pad-grid' in css and '--ui-navy-gradient' in css),
              ('trip time events', 'creationTimeChanged' in clock and 'scheduledStartChanged' in clock and 'startTimeChanged' in clock),
              ('creation date API', 'set creationDate(value)' in clock),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('failed checks: ' + ', '.join(failed))
          PY
          git diff --check

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js app.js app.css index.html numberpad.html
          git commit -m "Polish UI and add trip settings editor"
          git push origin HEAD:rename-prestart-latency

      - name: Remove temporary patch files
        run: |
          git rm -f .github/scripts/apply_ui_trip_settings.py .github/workflows/apply-ui-trip-settings.yml
          git commit -m "Remove UI refinement patch files"
          git push origin HEAD:rename-prestart-latency
