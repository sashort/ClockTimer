name: Patch rendered time value

on:
  push:
    branches:
      - rename-prestart-latency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Hide rendered time when not running
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text()
          old = '        $("#renderedTimeValue").textContent = clockTimer.renderedTime || "---";\n'
          new = '''        $("#renderedTimeValue").textContent =\n            clockTimer.status === "running"\n                ? (clockTimer.renderedTime || "---")\n                : "---";\n'''
          if old not in text:
              raise SystemExit('Expected renderedTimeValue assignment not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check app.js
          grep -F 'clockTimer.status === "running"' app.js

      - name: Commit source change
        run: |
          if git diff --quiet -- app.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Hide rendered time when clock is not running"
          git push origin HEAD:rename-prestart-latency
