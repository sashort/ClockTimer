name: Animate TimeRanges
on:
  push:
    paths:
      - '.github/workflows/animate-time-ranges.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply animation changes
        run: python .github/scripts/animate-time-ranges.py
      - name: Syntax checks
        run: |
          node --check TimeRange.js
          node --check ClockTimer.js
      - name: Targeted checks
        run: |
          grep -q 'static #animationDuration = 1000' TimeRange.js
          grep -q 'removeAnimated' TimeRange.js
          grep -q 'data-time-range-full-entry' ClockTimer.js
          grep -q 'data-clock-timer-exiting-ring' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/animate-time-ranges.py
          rm .github/workflows/animate-time-ranges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js ClockTimer.js .github/scripts/animate-time-ranges.py .github/workflows/animate-time-ranges.yml
          git commit -m 'Animate ClockTimer TimeRange transitions'
          git push