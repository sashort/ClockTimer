name: Update spin keyframes and font freeze

on:
  push:
    paths:
      - '.github/workflows/update-spin-keyframes-font-freeze.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/update-spin-keyframes-font-freeze.py
      - name: Verify syntax
        run: node --check ClockTimer.js
      - name: Verify spin keyframes and font freeze
        run: |
          grep -q 'offset: 0.5' ClockTimer.js
          grep -q 'rotateY(90deg)' ClockTimer.js
          grep -q 'rotateY(-90deg)' ClockTimer.js
          grep -q '#freezeTimeFontForSpin' ClockTimer.js
          grep -q '#restoreTimeFontAfterSpin' ClockTimer.js
          grep -q 'iterations:' ClockTimer.js
      - name: Commit functional change and clean temporary files
        run: |
          rm .github/scripts/update-spin-keyframes-font-freeze.py
          rm .github/workflows/update-spin-keyframes-font-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/update-spin-keyframes-font-freeze.py .github/workflows/update-spin-keyframes-font-freeze.yml
          git commit -m 'Use spin keyframes and freeze time font size'
          git push
