name: Use RingContainer getters in ClockTimer
on:
  push:
    paths:
      - .github/workflows/use-ring-getters-in-clocktimer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace RingContainer attribute reads
        run: python .github/scripts/use-ring-getters-in-clocktimer.py
      - name: Syntax checks
        run: |
          node --check ClockTimer.js
          node --check RingContainer.js
      - name: Show getter usage
        run: |
          grep -nE '\.(width|inset|margin|innerMargin|outerMargin)' ClockTimer.js | head -80
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/use-ring-getters-in-clocktimer.yml
          rm -f .github/scripts/use-ring-getters-in-clocktimer.py
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add ClockTimer.js .github
          git commit -m 'Use RingContainer getters in ClockTimer'
          git push
