name: Use ignore-overlaps for open insert
on:
  push:
    paths:
      - '.github/workflows/use-ignore-overlaps-open-insert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/use_ignore_overlaps_open_insert.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify open insert ignore-overlaps
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()
          assert text.count('"ignore-overlaps"') >= 2
          marker = text.index('        #syncOpenEndedRangeElements(')
          block = text[marker:marker + 5000]
          assert 'range.setAttribute(\n                        "ignore-overlaps",\n                        ""\n                    );' in block
          marker = text.index('        #renderInsertedRecord(')
          block = text[marker:marker + 3500]
          assert 'range.setAttribute(\n                    "ignore-overlaps",\n                    ""\n                );' in block
          PY
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/use_ignore_overlaps_open_insert.py
          rm -f .github/workflows/use-ignore-overlaps-open-insert.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/use_ignore_overlaps_open_insert.py .github/workflows/use-ignore-overlaps-open-insert.yml
          git commit -m "Use ignore-overlaps for open inserts"
          git push origin main
