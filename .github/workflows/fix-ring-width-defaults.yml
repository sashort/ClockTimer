name: Fix ring width defaults

on:
  push:
    branches:
      - radial-fitted-controller
    paths:
      - .github/workflows/fix-ring-width-defaults.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted
          fetch-depth: 0

      - name: Verify expected target base
        run: |
          test "$(git rev-parse HEAD)" = "e008bca35bf6a4325cda64e66a60291264dab384"

      - name: Checkout controller branch files
        run: |
          git checkout origin/radial-fitted-controller -- .github/scripts/fix_ring_width_defaults.py

      - name: Apply fix
        run: python .github/scripts/fix_ring_width_defaults.py

      - name: Syntax check
        run: node --check ClockTimer.js

      - name: Verify corrected defaults
        run: |
          grep -F -- 'var(--clock-timer-active-ring-width, clamp(4px, 2.5cqi, 12px))' ClockTimer.js
          grep -F -- 'var(--clock-timer-inactive-ring-width, clamp(2px, 1.25cqi, 6px))' ClockTimer.js
          ! grep -F -- 'var(--clock-timer-active-ring-width, clamp(2px, 1.25cqi, 6px))' ClockTimer.js
          ! grep -F -- 'var(--clock-timer-inactive-ring-width, clamp(4px, 2.5cqi, 12px))' ClockTimer.js

      - name: Commit update on target branch
        run: |
          rm -f .github/scripts/fix_ring_width_defaults.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Fix active and inactive ring width defaults"
          git push origin HEAD:radial-fitted
