name: Add elapsed resting visibility

on:
  push:
    paths:
      - '.github/workflows/add-elapsed-resting-visibility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/add-elapsed-resting-visibility.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify elapsed resting visibility
        run: |
          grep -q '#elapsed-edge' TimeRange.js
          grep -q '0.18' TimeRange.js
          grep -q '0.25' TimeRange.js
          grep -q -- '--elapsed-edge-strength' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/add-elapsed-resting-visibility.py
          rm .github/workflows/add-elapsed-resting-visibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/scripts/add-elapsed-resting-visibility.py .github/workflows/add-elapsed-resting-visibility.yml
          git commit -m 'Improve elapsed visibility between sweeps'
          git push
