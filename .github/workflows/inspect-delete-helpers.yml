name: Inspect delete helpers
on:
  push:
    paths:
      - '.github/workflows/inspect-delete-helpers.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect helpers
        run: |
          grep -n -A25 -B5 'typeExtendsCalculatedEndTime' ClockTimer.js || true
          grep -n -A35 -B5 'recalculate.*Calculated\|calculate.*End' ClockTimer.js || true
          grep -n -A20 -B5 'new Set(\[' ClockTimer.js | head -250 || true
          grep -n -A30 -B5 '#refreshRingLayout' ClockTimer.js | tail -180 || true
      - name: Cleanup
        run: |
          rm .github/workflows/inspect-delete-helpers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove delete helper inspection workflow'
          git push
