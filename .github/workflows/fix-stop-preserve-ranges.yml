name: Preserve ranges on stop
on:
  push:
    paths:
      - .github/workflows/fix-stop-preserve-ranges.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-stop-preserve-ranges.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          line=$(grep -n -m1 '^        stop(' ClockTimer.js | cut -d: -f1)
          sed -n "$((line)),$((line+260))p" ClockTimer.js > /tmp/stop.txt
          ! grep -q 'item.range.remove()' /tmp/stop.txt
          grep -q 'time-range\[type="elapsed"\]' /tmp/stop.txt
      - name: Commit
        run: |
          rm .github/scripts/fix-stop-preserve-ranges.py .github/workflows/fix-stop-preserve-ranges.yml
          rm -f .github/workflows/inspect-stop-elapsed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve non-elapsed ranges on stop'
          git push
