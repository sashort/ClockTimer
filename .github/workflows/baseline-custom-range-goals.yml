name: Baseline custom range goals check

on:
  push:
    branches:
      - refactor-time-range-layers

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: tests
        run: npm install --no-audit --no-fund
      - working-directory: tests
        run: node custom-range-goals.mjs
