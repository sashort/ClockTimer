name: Repair ClockTimer padding
on:
  push:
    paths:
      - .github/workflows/repair-clock-padding.yml
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore ClockTimer and set padding
        run: python .github/scripts/repair-clock-padding.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Targeted check
        run: |
          grep -A1 'padding:' ClockTimer.js | grep -q '2px'
      - name: Commit repair and cleanup
        run: |
          rm .github/scripts/repair-clock-padding.py .github/workflows/repair-clock-padding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/repair-clock-padding.py .github/workflows/repair-clock-padding.yml
          git commit -m 'Increase ClockTimer edge padding to 2px'
          git push
