name: Fix connection catch and text expansion

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/fix-connection-catch-text-expansion.py
      - .github/workflows/fix-connection-catch-text-expansion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix-connection-catch-text-expansion.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text()
          css = Path('app.css').read_text()
          required = [
              'try {\n                    return await clockTimer.resumeConnection();',
              'catch {\n                    return false;',
              'tripStartsNowExiting = false;\n        if (!tripStartsNowState) syncTripStartsNowUI();',
          ]
          for needle in required:
              if needle not in app:
                  raise SystemExit(f'missing app.js requirement: {needle}')
          if 'tripStartsNowExitTimer = setTimeout(() => {\n            tripStartsNowExitTimer = undefined;\n            if (!tripStartsNowExiting) return;' in app:
              raise SystemExit('post-width text expansion delay still present')
          if '.trip-now-actions.is-exiting .trip-now-start-copy' in css:
              raise SystemExit('exiting state still suppresses start-copy expansion')
          if '.trip-now-actions.is-selecting .trip-now-start-copy {' not in css:
              raise SystemExit('selecting collapse rule missing')
          PY
      - name: Commit and cleanup
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix-connection-catch-text-expansion.py
          rm -f .github/workflows/fix-connection-catch-text-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css .github/scripts .github/workflows
          git commit -m "Restore connection error handling and sync text expansion"
          git push origin HEAD:rename-prestart-latency
