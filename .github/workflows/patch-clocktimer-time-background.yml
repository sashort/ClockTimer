name: Patch ClockTimer time background

on:
  push:
    paths:
      - '.github/workflows/patch-clocktimer-time-background.yml'
      - '.github/scripts/patch_clocktimer_time_background.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/patch_clocktimer_time_background.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify time background structure
        run: |
          grep -Fq '#time-layer {' ClockTimer.js
          grep -Fq 'background:' ClockTimer.js
          grep -Fq 'transparent;' ClockTimer.js
          grep -Fq 'timeLayer.appendChild(' ClockTimer.js
          grep -Fq 'timeLayer' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Support ClockTimer time backgrounds" || exit 0
          git push origin main
