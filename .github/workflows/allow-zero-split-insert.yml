name: Allow zero-length split insert
on:
  push:
    paths:
      - '.github/workflows/allow-zero-split-insert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/allow_zero_split_insert.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify zero-length insert support
        run: |
          grep -q 'splitMilliseconds === endMilliseconds' TimeRange.js
          grep -q 'rightLength > 0' TimeRange.js
      - name: Commit update and cleanup
        run: |
          rm .github/scripts/allow_zero_split_insert.py
          rm .github/workflows/allow-zero-split-insert.yml
          git config user.name sashort
          git config user.email 95879519+sashort@users.noreply.github.com
          git add TimeRange.js .github/scripts/allow_zero_split_insert.py .github/workflows/allow-zero-split-insert.yml
          git commit -m 'Allow zero-length split inserts'
          git push
