name: Hide ClockTimer host transparency style
on:
  push:
    paths:
      - '.github/workflows/hide-host-transparency-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ClockTimer patch
        run: python .github/scripts/hide_host_transparency_style.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify hidden transparency rule
        run: |
          grep -Fq '#hostTransparencyStyle;' ClockTimer.js
          grep -Fq ':host { background-color: transparent !important; }' ClockTimer.js
          grep -Fq 'transparencySheet.disabled =' ClockTimer.js
          ! grep -Fq 'this.style.setProperty(' ClockTimer.js || ! grep -A4 -F 'this.style.setProperty(' ClockTimer.js | grep -Fq '"background-color"'
      - name: Commit ClockTimer update and cleanup
        run: |
          rm -f .github/scripts/hide_host_transparency_style.py
          rm -f .github/workflows/hide-host-transparency-style.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/hide_host_transparency_style.py .github/workflows/hide-host-transparency-style.yml
          git commit -m "Hide host transparency inline style"
          git push origin main
