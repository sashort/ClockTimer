name: Extract temporal methods
on:
  push:
    paths:
      - .github/workflows/extract-temporal-methods.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/extract-temporal-methods.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TEMPORAL_METHODS.txt
          git commit -m "Capture temporal migration methods"
          git push
# rerun 3
