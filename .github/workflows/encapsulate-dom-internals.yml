name: Encapsulate DOM internals
on:
  push:
    paths:
      - '.github/workflows/encapsulate-dom-internals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply encapsulation refactor
        run: python .github/scripts/encapsulate-dom-internals.py
      - name: Syntax checks
        run: |
          node --check ClockTimer.js
          node --check RingContainer.js
          node --check TimeRange.js
      - name: Encapsulation checks
        run: |
          ! grep -n 'data-clock-timer\|data-time-range' ClockTimer.js TimeRange.js
          ! grep -n 'this\.style\.setProperty' ClockTimer.js TimeRange.js
          grep -n '#getTimerRings' ClockTimer.js
          grep -n 'clockTimerRing' ClockTimer.js TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm -f .github/workflows/audit-dom-internals.yml
          rm -f .github/workflows/encapsulate-dom-internals.yml
          rm -f .github/scripts/encapsulate-dom-internals.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js TimeRange.js RingContainer.js .github
          git commit -m 'Encapsulate internal DOM state in properties'
          git push
