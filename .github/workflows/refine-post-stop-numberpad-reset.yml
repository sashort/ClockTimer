name: Refine post-stop and numberpad reset

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/refine-post-stop-numberpad-reset.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply refinement
        run: python .github/scripts/refine_post_stop_numberpad_reset.py

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate behavior anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text()
          checks = [
              'function resetNumberPad()',
              'numberPadDialog.addEventListener("close", () => {',
              'resetNumberPad();',
              '$("#currentPercentValue").textContent = "---";',
              'clockTimer.renderedTimeMode === "calculated-end"',
              'updateSummaryValues(summary);',
              'stateDialog.addEventListener("closed", reopen);'
          ]
          missing = [item for item in checks if item not in text]
          if missing:
              raise SystemExit(f'Missing expected behavior: {missing}')
          old = '''        $("#standardTimeValue").textContent = "---";
          $("#renderedTimeValue").textContent = "---";
          $("#currentPercentValue").textContent = "---";'''
          if old in text:
              raise SystemExit('Old post-stop blanket reset still present')
          PY

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Refine post-stop summary and numberpad reset"
          git push origin HEAD:rename-prestart-latency

      - name: Remove temporary patch files
        run: |
          git rm -f .github/scripts/refine_post_stop_numberpad_reset.py .github/workflows/refine-post-stop-numberpad-reset.yml
          git commit -m "Remove post-stop refinement patch files"
          git push origin HEAD:rename-prestart-latency
