name: Rollback indicator size
on:
  push:
    paths:
      - '.github/workflows/rollback-indicator-size.yml'
jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Roll back responsive size change
        run: python .github/scripts/rollback-indicator-size.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify rollback
        run: |
          grep -q 'font-size: var(--clock-timer-indicator-symbol-size, 12px);' ClockTimer.js
          ! grep -q 'clock-timer-auto-indicator-symbol-size' ClockTimer.js
          ! grep -q 'symbolSize' ClockTimer.js
      - name: Commit rollback and cleanup
        run: |
          rm .github/workflows/rollback-indicator-size.yml .github/scripts/rollback-indicator-size.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/rollback-indicator-size.yml .github/scripts/rollback-indicator-size.py
          git commit -m 'Rollback indicator symbol sizing'
          git push
