name: Add TemporalFormat type classification
on:
  push:
    paths:
      - .github/workflows/add-temporal-format-type.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add-temporal-format-type.py
      - name: Verify
        run: |
          node --check TemporalFormat.js
          node --check ClockTimer.js
          node <<'NODE'
          require('./TemporalFormat.js');
          const T = globalThis.TemporalFormat;
          const assert = require('node:assert/strict');
          assert.deepEqual(T.getFormatType('HH:mm'), {type:'time','time-type':'military'});
          assert.deepEqual(T.getFormatType('h:mm:ss AM/PM'), {type:'time','time-type':'12-hour'});
          assert.deepEqual(T.getFormatType('yyyy-MM-dd'), {type:'date'});
          assert.deepEqual(T.getFormatType('yyyy-MM-ddTHH:mm:ss'), {type:'datetime','time-type':'ISO 8601'});
          assert.equal(T.getFormatType('not a format'), undefined);
          assert.equal(T.getFormatType('HH'), undefined);
          assert.equal(T.getFormatType('HH:mm h'), undefined);
          assert.ok(T.parseISO8601('2026-09-11'));
          assert.ok(T.parseISO8601('20:05'));
          assert.ok(T.parseISO8601('2026-09-11T20:05:30Z'));
          assert.equal(T.parseISO8601('2026-02-30'), undefined);
          assert.equal(T.parseISO8601('25:00'), undefined);
          NODE
          grep -q 'TemporalFormat.getFormatType' ClockTimer.js
          grep -q '"HHmmss"' ClockTimer.js
      - name: Commit
        run: |
          rm -f .github/scripts/add-temporal-format-type.py
          rm -f .github/workflows/add-temporal-format-type.yml
          rm -f .github/workflows/inspect-time-format.yml
          rm -f FORMAT_INSPECT.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TemporalFormat.js ClockTimer.js .github FORMAT_INSPECT.txt
          git commit -m "Classify temporal formats and support ISO 8601"
          git push
