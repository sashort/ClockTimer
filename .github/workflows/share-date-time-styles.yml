name: Share date and time styles
on:
  push:
    paths:
      - .github/workflows/share-date-time-styles.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/share-date-time-styles.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          assert '#date,\n                #time {' in s
          assert 'fittedSize * 0.38' in s
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/share-date-time-styles.py
          rm -f .github/workflows/share-date-time-styles.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js .github
          git commit -m "Share default date and time styling"
          git push
