name: Sync fromJSON start state
on:
  push:
    paths:
      - .github/workflows/sync-fromjson-start-state.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/sync-fromjson-start-state.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          section=s[s.index('        fromJSON(json) {'):s.index('        get status() {')]
          assert 'this.#calculatedEndTime =\n                    this.#scheduledStartMilliseconds +\n                    this.#standardDuration;' in section
          assert 'this.#tickAlignmentMilliseconds =\n                    this.#millisecondsComponent(\n                        this.#scheduledStartMilliseconds\n                    );' in section
          assert 'this.#setIndicatorSymbolVisible(false);' in section
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/sync-fromjson-start-state.py
          rm -f .github/workflows/sync-fromjson-start-state.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js .github
          git commit -m "Initialize fromJSON start state like start"
          git push
