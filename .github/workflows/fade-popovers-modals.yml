name: Fade popovers and modals
on:
  push:
    paths:
      - '.github/workflows/fade-popovers-modals.yml'
      - '.github/scripts/fade_popovers_modals.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Apply popover and modal fade patch
        run: python .github/scripts/fade_popovers_modals.py
      - name: Validate
        run: |
          grep -Fq '[popover] {' app.css
          grep -Fq 'transition-duration: 750ms;' app.css
          grep -Fq '.app-dialog[open] {' app.css
          grep -Fq '.app-dialog[open]::backdrop {' app.css
          grep -Fq 'allow-discrete' app.css
      - name: Commit source changes and cleanup
        run: |
          rm -f .github/scripts/fade_popovers_modals.py
          rm -f .github/workflows/fade-popovers-modals.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.css .github/scripts/fade_popovers_modals.py .github/workflows/fade-popovers-modals.yml
          git commit -m "Fade popovers and modals over 750ms"
          git push origin rename-prestart-latency
