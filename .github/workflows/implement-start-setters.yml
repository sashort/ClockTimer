name: Implement ClockTimer start setters
on:
  push:
    paths:
      - '.github/workflows/implement-start-setters.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/implement-start-setters.py
      - run: node --check ClockTimer.js
      - run: |
          rm .github/scripts/implement-start-setters.py .github/workflows/implement-start-setters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement ClockTimer start property setters'
          git push
