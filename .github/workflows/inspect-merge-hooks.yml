name: Inspect merge hooks
on:
  push:
    paths:
      - '.github/workflows/inspect-merge-hooks.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -n -A220 -B20 '#refreshRingLayout(' ClockTimer.js || true
          grep -n -A180 -B20 '#createTimeRange(' ClockTimer.js || true
          grep -n -A140 -B20 '#setRangeTiming(' ClockTimer.js || true
          grep -n -A180 -B20 '#handlePercentGoalChange' ClockTimer.js || true
      - run: |
          rm .github/workflows/inspect-merge-hooks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-merge-hooks.yml
          git commit -m 'Remove merge hook inspection workflow'
          git push
