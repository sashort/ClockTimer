name: Apply date and Trip List updates

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/apply_date_trip_list.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply changes
        run: python3 .github/scripts/apply_date_trip_list.py

      - name: Validate JavaScript
        run: |
          node --check TemporalFormat.js
          node --check ClockTimer.js
          node --check app.js

      - name: Validate date formats
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          vm.runInThisContext(fs.readFileSync('TemporalFormat.js', 'utf8'));
          const value = new Date(2026, 8, 17, 14, 37, 22);
          const checks = [
            [TemporalFormat.formatDate(value, 'dddd, MMMM d, yyyy'), 'Thursday, September 17, 2026'],
            [TemporalFormat.formatDate(value, 'ddd'), 'Thu'],
            [TemporalFormat.formatDate(value, 'MMM d'), 'Sep 17'],
            [TemporalFormat.formatTime(value, 'h:mm A', false), '2:37 PM']
          ];
          for (const [actual, expected] of checks) {
            if (actual !== expected) throw new Error(`Expected ${expected}, got ${actual}`);
          }
          NODE

      - name: Validate markup hooks
        run: |
          grep -q 'id="tripListMenuButton"' index.html
          grep -q 'id="tripLogPinButton"' index.html
          grep -q 'data-trip-log-pinned="true"' index.html

      - name: Check whitespace
        run: git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TemporalFormat.js ClockTimer.js index.html app.css app.js
          git commit -m "Fix date formatting and add Trip List pinning"
          git push origin HEAD:rename-prestart-latency
