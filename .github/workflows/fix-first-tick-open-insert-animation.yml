name: Fix first-tick open insert animation
on:
  push:
    paths:
      - '.github/workflows/fix-first-tick-open-insert-animation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/fix_first_tick_open_insert_animation.py
      - name: Syntax check
        run: |
          node --check ClockTimer.js
          node --check TimeRange.js
      - name: Verify fixes
        run: |
          grep -Fq 'clip-path: polygon(' TimeRange.js
          grep -Fq 'segment.timeRangeFullEntry =' ClockTimer.js
          grep -Fq 'movedSegment.timeRangeFullEntry =' ClockTimer.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/fix_first_tick_open_insert_animation.py
          rm -f .github/workflows/fix-first-tick-open-insert-animation.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js TimeRange.js .github/scripts/fix_first_tick_open_insert_animation.py .github/workflows/fix-first-tick-open-insert-animation.yml
          git commit -m "Fix first-tick open insert animation"
          git push origin main
