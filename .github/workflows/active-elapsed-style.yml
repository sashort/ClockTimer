name: Active elapsed styling
on:
  push:
    paths:
      - '.github/workflows/active-elapsed-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/active-elapsed-style.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify active-only sweep
        run: |
          grep -q 'const activeRing' TimeRange.js
          grep -q 'if (!activeRing)' TimeRange.js
          grep -q 'this.#elapsedWaveLayer.style.animation' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/active-elapsed-style.py
          rm .github/workflows/active-elapsed-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/scripts/active-elapsed-style.py .github/workflows/active-elapsed-style.yml
          git commit -m 'Style elapsed sweep only on active ring'
          git push
