name: Fix number pad return icon

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/fix-number-pad-return-icon.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency

      - name: Apply number pad return icon fix
        run: python .github/scripts/fix-number-pad-return-icon.py

      - name: Syntax check
        run: node --check app.js

      - name: Verify return icon refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text()
          target = '''        if (caller) {\n            popUIReturnFrame(caller);\n            if (caller.type === "number-pad" && numberPadDialog?.open) {\n                refreshNumberPad();\n            }\n        }\n'''
          assert target in text
          PY

      - name: Commit update and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm .github/scripts/fix-number-pad-return-icon.py .github/workflows/fix-number-pad-return-icon.yml
          git commit -m "Refresh number pad icon after return"
          git push origin HEAD:rename-prestart-latency
