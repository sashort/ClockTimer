name: Diagnose Lightsail Serving

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/diagnose-lightsail.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_SSH_KEY: ${{ secrets.LAMP_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LAMP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$LAMP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect deployed and served files
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$LAMP_USER@$LAMP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/bitnami/apache2/htdocs
          cd "$ROOT"
          echo "=== deployed checkout ==="
          git rev-parse HEAD
          git status --short
          sha256sum index.html app.js app.css
          echo "=== app.js marker on disk ==="
          grep -n -F 'return await clockTimer.resumeConnection();' app.js || true
          echo "=== index asset refs ==="
          grep -E 'app\.css|app\.js' index.html || true

          echo "=== localhost HTTP response ==="
          rm -f /tmp/clocktimer-app-js
          curl -sS -D /tmp/clocktimer-http-headers -o /tmp/clocktimer-app-js \
            -H 'Host: wmof.sashort-apps.com' \
            http://127.0.0.1/app.js || true
          cat /tmp/clocktimer-http-headers || true
          if [ -f /tmp/clocktimer-app-js ]; then
            sha256sum /tmp/clocktimer-app-js
            grep -n -F 'return await clockTimer.resumeConnection();' /tmp/clocktimer-app-js || true
          fi

          echo "=== localhost HTTPS response ==="
          rm -f /tmp/clocktimer-app-js-https
          curl -ksS -D /tmp/clocktimer-https-headers -o /tmp/clocktimer-app-js-https \
            --resolve wmof.sashort-apps.com:443:127.0.0.1 \
            https://wmof.sashort-apps.com/app.js || true
          cat /tmp/clocktimer-https-headers || true
          if [ -f /tmp/clocktimer-app-js-https ]; then
            sha256sum /tmp/clocktimer-app-js-https
            grep -n -F 'return await clockTimer.resumeConnection();' /tmp/clocktimer-app-js-https || true
          fi
          REMOTE
