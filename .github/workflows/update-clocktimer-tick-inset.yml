name: Update ClockTimer tick inset
on:
  push:
    paths:
      - '.github/workflows/update-clocktimer-tick-inset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ClockTimer tick inset patch
        run: python .github/scripts/update_clocktimer_tick_inset.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify tick inset implementation
        run: |
          grep -Fq '#getTickInset() {' ClockTimer.js
          grep -Fq 'this.#tickMarkLayer.style.inset =' ClockTimer.js
          if grep -A45 -F '#syncTickMarkGeometry() {' ClockTimer.js | grep -Fq 'getBoundingClientRect'; then
            echo 'syncTickMarkGeometry still depends on getBoundingClientRect' >&2
            exit 1
          fi
      - name: Commit ClockTimer update and cleanup
        run: |
          rm -f .github/scripts/update_clocktimer_tick_inset.py
          rm -f .github/workflows/update-clocktimer-tick-inset.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/update_clocktimer_tick_inset.py .github/workflows/update-clocktimer-tick-inset.yml
          git commit -m "Scale tick marks with ring layout"
          git push origin main
