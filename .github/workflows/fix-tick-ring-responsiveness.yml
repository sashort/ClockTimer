name: Fix tick ring responsiveness
on:
  push:
    paths:
      - '.github/workflows/fix-tick-ring-responsiveness.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ClockTimer patch
        run: python .github/scripts/fix_tick_ring_responsiveness.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify responsive ring lifecycle integration
        run: |
          grep -Fq '#refreshRingLayout(' ClockTimer.js
          grep -Fq 'refreshTickMarks: true' ClockTimer.js
          grep -Fq '#syncTickMarkGeometry();' ClockTimer.js
          grep -Fq 'var(--clock-timer-inactive-ring-width, clamp(4px, 2.5cqi, 12px))' ClockTimer.js
          grep -Fq 'var(--clock-timer-active-ring-width, clamp(2px, 1.25cqi, 6px))' ClockTimer.js
      - name: Commit ClockTimer update and cleanup
        run: |
          rm -f .github/scripts/fix_tick_ring_responsiveness.py
          rm -f .github/workflows/fix-tick-ring-responsiveness.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix_tick_ring_responsiveness.py .github/workflows/fix-tick-ring-responsiveness.yml
          git commit -m "Keep tick marks responsive to ring changes"
          git push origin main
