name: Rename close to stop
on:
  push:
    paths:
      - '.github/workflows/rename-close-to-stop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply rename
        run: python .github/scripts/rename-close-to-stop.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          assert '        stop() {' in s
          assert '        close() {' not in s
          assert 'type: "close"' not in s
          assert 'case "close":' not in s
          assert 'this.close();' not in s
          PY
      - name: Commit rename and cleanup
        run: |
          rm .github/scripts/rename-close-to-stop.py .github/workflows/rename-close-to-stop.yml
          git config user.name sashort
          git config user.email '95879519+sashort@users.noreply.github.com'
          git add -A
          git commit -m 'Rename close to stop'
          git push
