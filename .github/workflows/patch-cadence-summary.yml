name: Implement cadence summary data
# retry after tick-anchor repair

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/patch-cadence-summary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Repair patch helpers
        run: python3 .github/scripts/repair_counted_patch.py

      - name: Apply counted aggregate changes
        run: python3 .github/scripts/patch_counted_aggregates.py

      - name: Apply ClockTimer cadence changes
        run: python3 .github/scripts/patch_cadence_clock.py

      - name: Apply app summary changes
        run: python3 .github/scripts/patch_summary_app.py

      - name: Validate source
        run: |
          node --check ClockTimer.js
          node --check app.js
          php -l api/trips/index.php
          python3 - <<'PY'
          from pathlib import Path

          clock = Path('ClockTimer.js').read_text()
          app = Path('app.js').read_text()
          api = Path('api/trips/index.php').read_text()
          db = Path('database/create_database.sql').read_text()

          required_clock = [
              'getSummarySnapshot(now = new Date())',
              '#emitClockTimerEvent("cadenceTick"',
              '"standardTimeChange"',
              '#emitClockTimerEvent("cleared"',
              'countedTimeElapsedMilliseconds',
              'countedTimeMilliseconds',
              'this.#timeElement.textContent =\n                displayTime;',
          ]
          for text in required_clock:
              assert text in clock, text

          assert 'this.#timeElement.textContent =\n                    renderedTime;' not in clock
          assert 'this.#emitCadenceTick(\n                nowDate\n            );' in clock
          assert 'if (!this.#needsTick()) {' in clock

          required_app = [
              'clockTimer.addEventListener("cadenceTick"',
              '"standardTimeChange"',
              '"intervalExtended"',
              '"intervalApprovalChange"',
              '"intervalDelete"',
              'clockTimer.addEventListener("connected"',
              'clockTimer.addEventListener("disconnected"',
              '$("#currentPercentValue").textContent',
          ]
          for text in required_app:
              assert text in app, text
          assert 'addEventListener("tick"' not in app
          assert 'addEventListener("connect"' not in app
          assert 'addEventListener("disconnect"' not in app

          assert 'countedTimeMilliseconds' in api
          assert 'SUM(t.counted_time_ms)' in api
          assert '`counted_time_ms` BIGINT UNSIGNED NOT NULL DEFAULT 0' in db
          assert "'counted_time_ms', NEW.`counted_time_ms`" in db
          assert "'counted_time_ms', OLD.`counted_time_ms`" in db
          PY

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js app.js api/trips/index.php database/create_database.sql
          git commit -m 'Add cadence-driven trip and total summaries'
          git push origin HEAD:rename-prestart-latency

      - name: Remove patch files
        run: |
          git rm .github/scripts/repair_counted_patch.py .github/scripts/patch_counted_aggregates.py .github/scripts/patch_cadence_clock.py .github/scripts/patch_summary_app.py .github/workflows/patch-cadence-summary.yml
          git commit -m 'Remove cadence summary patch files'
          git push origin HEAD:rename-prestart-latency
