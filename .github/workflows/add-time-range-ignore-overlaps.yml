name: Add TimeRange ignore-overlaps
on:
  push:
    paths:
      - '.github/workflows/add-time-range-ignore-overlaps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/add_time_range_ignore_overlaps.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify one-shot ignore-overlaps
        run: |
          grep -Fq 'this.hasAttribute(' TimeRange.js
          grep -Fq '"ignore-overlaps"' TimeRange.js
          grep -Fq 'this.removeAttribute(' TimeRange.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/add_time_range_ignore_overlaps.py
          rm -f .github/workflows/add-time-range-ignore-overlaps.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add TimeRange.js .github/scripts/add_time_range_ignore_overlaps.py .github/workflows/add-time-range-ignore-overlaps.yml
          git commit -m "Add one-shot ignore-overlaps support"
          git push origin main
