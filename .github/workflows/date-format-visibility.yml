name: Date format visibility
on:
  push:
    paths:
      - .github/workflows/date-format-visibility.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/date-format-visibility.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          assert '"date-format"' in s[s.index('static observedAttributes'):s.index('static #HOUR')]
          assert 'case "date-format":' in s
          assert '#date[hidden]' in s
          assert 'this.#dateElement.hidden =' in s
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/date-format-visibility.py .github/workflows/date-format-visibility.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js .github
          git commit -m "Hide date without date-format"
          git push
