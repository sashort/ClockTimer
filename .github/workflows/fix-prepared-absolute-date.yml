name: Fix prepared absolute date

on:
  push:
    branches: [rename-prestart-latency]
    paths:
      - .github/workflows/fix-prepared-absolute-date.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - run: python .github/scripts/fix_prepared_absolute_date.py
      - run: |
          node --check app.js
          git diff --check
          grep -F 'getAbsolutePadInitial(initialValue, tripDefaults?.creationDate)' app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Use prepared creation date in trip time editor"
          git push
      - run: |
          git rm -f .github/scripts/fix_prepared_absolute_date.py .github/workflows/fix-prepared-absolute-date.yml
          git commit -m "Remove prepared date patch files"
          git push
