name: Refactor ClockTimer start properties
on:
  push:
    paths:
      - '.github/workflows/refactor-start-properties.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python .github/scripts/refactor-start-properties.py
      - run: node --check ClockTimer.js
      - name: Verify refactor invariants
        run: |
          ! grep -q '#startTime' ClockTimer.js
          ! grep -q 'early-start' ClockTimer.js
          ! grep -q 'late-start' ClockTimer.js
          grep -q 'get standardTime()' ClockTimer.js
          grep -q 'set standardTime(value)' ClockTimer.js
          grep -q 'get creationTime()' ClockTimer.js
          grep -q 'set creationTime(value)' ClockTimer.js
          grep -q 'get scheduledStart()' ClockTimer.js
          grep -q 'set scheduledStart(value)' ClockTimer.js
          grep -q 'get startTime()' ClockTimer.js
          grep -q 'set startTime(value)' ClockTimer.js
      - name: Commit patch and cleanup
        run: |
          rm .github/workflows/refactor-start-properties.yml .github/scripts/refactor-start-properties.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js .github/workflows/refactor-start-properties.yml .github/scripts/refactor-start-properties.py
          git commit -m "Add ClockTimer start property accessors"
          git push
