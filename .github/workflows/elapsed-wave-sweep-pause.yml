name: Update elapsed wave sweep timing

on:
  push:
    paths:
      - '.github/workflows/elapsed-wave-sweep-pause.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply elapsed wave sweep patch
        run: python .github/scripts/elapsed-wave-sweep-pause.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify sweep timing
        run: |
          grep -q 'animation: elapsed-wave-sweep 4s linear infinite' TimeRange.js
          grep -q '25.01%' TimeRange.js
          grep -q -- '--elapsed-wave-start-angle' TimeRange.js
          grep -q -- '--elapsed-wave-end-angle' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm .github/workflows/elapsed-wave-sweep-pause.yml
          rm .github/scripts/elapsed-wave-sweep-pause.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TimeRange.js .github/workflows/elapsed-wave-sweep-pause.yml .github/scripts/elapsed-wave-sweep-pause.py
          git commit -m "Sweep elapsed arc in one second with pause"
          git push
