name: Guard replaceToNext state
on:
  push:
    paths:
      - '.github/workflows/guard-replace-to-next.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/guard-replace-to-next.py
      - run: node --check ClockTimer.js
      - run: |
          rm .github/scripts/guard-replace-to-next.py .github/workflows/guard-replace-to-next.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Guard replaceToNext before start and after clear'
          git push
