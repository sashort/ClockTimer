name: Refine connection animation timing

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/refine_connection_animation.py
      - .github/workflows/refine-connection-animation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/refine_connection_animation.py

      - name: Validate
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text()
          css = Path('app.css').read_text()
          required_app = [
              'CONNECTION_INDICATOR_MINIMUM -\n            (performance.now() - startedAt)',
              'phase === "retry" ||',
              'phase === "awaiting-login";',
              'loginDialog.addEventListener("opened", () => {',
              'connectionState?.connectionPresentation === "awaiting-login"',
              'status === "offline" && !loginDialogFullyOpen',
          ]
          for needle in required_app:
              if needle not in app:
                  raise SystemExit(f'missing app assertion: {needle}')
          if 'CONNECTION_CLOUD_FADE_DURATION' in app:
              raise SystemExit('obsolete cloud fade delay constant remains')
          required_css = [
              '[data-connection-phase="initial"][data-persistence="pending"] .number-pad-persistence-badge',
              'animation: number-pad-cloud-fade-in 1000ms linear both;',
              '[data-connection-phase="retry"] .number-pad-settings-gear',
              '[data-connection-phase="awaiting-login"] .number-pad-settings-gear',
          ]
          for needle in required_css:
              if needle not in css:
                  raise SystemExit(f'missing css assertion: {needle}')
          PY

      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/refine_connection_animation.py
          rm -f .github/workflows/refine-connection-animation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine number pad connection animation timing"
          git push origin HEAD:rename-prestart-latency
