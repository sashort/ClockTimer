name: Refine standard time button press

on:
  push:
    branches:
      - rename-prestart-latency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply refinement
        run: python .github/scripts/refine-standard-time-button-press.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'if (!tripIsLive() || clockTimer.percentMode === "total") return;' app.js
          grep -Fq -- '-webkit-tap-highlight-color: transparent;' app.css
          grep -Fq 'button:active:not(:disabled)' app.css
          grep -Fq 'text-shadow: 0 2px 3px' app.css
          grep -Fq 'box-shadow: inset 0 4px 8px' app.css

      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/refine-standard-time-button-press.py
          rm -f .github/workflows/refine-standard-time-button-press.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app.css .github/scripts/refine-standard-time-button-press.py .github/workflows/refine-standard-time-button-press.yml
          git commit -m 'Refine standard time access and button press feedback'
          git push origin HEAD:rename-prestart-latency
