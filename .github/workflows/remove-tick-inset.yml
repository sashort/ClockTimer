name: Remove tick inset
on:
  push:
    paths:
      - '.github/workflows/remove-tick-inset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tick inset removal
        run: python .github/scripts/remove_tick_inset.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify tick inset removal
        run: |
          ! grep -Fq -- '--clock-timer-tick-inset' ClockTimer.js
          ! grep -Fq 'timerRingCount' ClockTimer.js
          grep -Fq 'return outerInset;' ClockTimer.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/workflows/remove-tick-inset.yml .github/scripts/remove_tick_inset.py
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/workflows/remove-tick-inset.yml .github/scripts/remove_tick_inset.py
          git commit -m "Remove tick inset spacing"
          git push origin main
