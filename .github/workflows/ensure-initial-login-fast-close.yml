name: Ensure initial login fast close
on:
  push:
    paths:
      - '.github/workflows/ensure-initial-login-fast-close.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Ensure initial login fade out uses standard timing
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text()
          marker = '''    function closeDialog(dialog) {\n        if (!dialog?.open) return;\n        dialog.classList.remove("initial-login-opening");\n        dialog.close();\n    }\n\n'''
          replacement = marker + '''    loginDialog.addEventListener("cancel", () => {\n        loginDialog.classList.remove("initial-login-opening");\n    });\n\n'''
          if marker not in text:
              raise SystemExit('closeDialog marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
      - name: Validate
        run: |
          node --check app.js
          grep -q 'loginDialog.addEventListener("cancel"' app.js
      - name: Commit source changes and cleanup
        run: |
          git config user.name 'sashort'
          git config user.email '95879519+sashort@users.noreply.github.com'
          git add app.js
          git rm .github/workflows/ensure-initial-login-fast-close.yml
          git commit -m 'Keep initial login fade out at 250ms'
          git push origin HEAD:rename-prestart-latency
