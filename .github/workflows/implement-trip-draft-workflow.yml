name: Implement trip draft workflow
on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/implement-trip-draft-workflow.yml'
      - '.github/scripts/implement_trip_draft_workflow.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Apply trip draft workflow
        run: python .github/scripts/implement_trip_draft_workflow.py
      - name: Syntax check
        run: node --check app.js
      - name: Verify draft and navigation behavior
        run: |
          grep -Fq 'let tripDraft;' app.js
          grep -Fq 'startsTripOnConfirm: true' app.js
          grep -Fq 'const confirmAction = autocorrect ? "autocorrect" : startsTrip ? "start" : "confirm";' app.js
          grep -Fq 'async function startTripDraft()' app.js
          grep -Fq 'tripSettingsPrimary.textContent = draft ? "Start Trip" : "Save";' app.js
          grep -Fq 'startsTripOnConfirm: false' app.js
          grep -Fq 'id="tripSettingsPrimary"' index.html
          grep -Fq '.number-pad-confirm[data-action="start"]::before' app.css
          ! grep -Fq 'if (state.source === "new-trip") {' app.js
      - name: Commit update and cleanup
        run: |
          rm -f .github/scripts/implement_trip_draft_workflow.py
          rm -f .github/workflows/implement-trip-draft-workflow.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js app.css index.html .github/scripts/implement_trip_draft_workflow.py .github/workflows/implement-trip-draft-workflow.yml
          git commit -m "Use draft workflow for new trips"
          git push origin rename-prestart-latency
