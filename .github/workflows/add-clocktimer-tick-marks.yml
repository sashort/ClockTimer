name: Add ClockTimer tick marks

on:
  push:
    paths:
      - '.github/workflows/add-clocktimer-tick-marks.yml'
      - '.github/scripts/add_clocktimer_tick_marks.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: python .github/scripts/add_clocktimer_tick_marks.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify tick-mark support
        run: |
          grep -Fq '"tick-marks"' ClockTimer.js
          grep -Fq 'normalized === "+/-5"' ClockTimer.js
          grep -Fq 'minute += 5' ClockTimer.js
          grep -Fq 'part",' ClockTimer.js
          grep -Fq '"tick-marks"' ClockTimer.js
          grep -Fq 'this.#updateTickMarks();' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Add ClockTimer tick mark ring" || exit 0
          git push origin main
