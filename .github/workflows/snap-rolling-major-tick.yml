name: Snap rolling major tick
on:
  push:
    paths:
      - '.github/workflows/snap-rolling-major-tick.yml'
      - '.github/scripts/snap_rolling_major_tick.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/snap_rolling_major_tick.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify major tick snaps to whole 5 seconds
        run: grep -Fq 'tickSecond % 5 === 0' ClockTimer.js
      - name: Commit
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Snap rolling major ticks to five seconds" || exit 0
          git push origin main
