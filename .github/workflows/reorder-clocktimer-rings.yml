name: Reorder ClockTimer rings

on:
  push:
    paths:
      - '.github/workflows/reorder-clocktimer-rings.yml'
      - '.github/scripts/reorder_clocktimer_rings.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: python .github/scripts/reorder_clocktimer_rings.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify ring ordering and widths
        run: |
          grep -Fq 'var(--clock-timer-active-ring-width, clamp(4px, 2.5cqi, 12px))' ClockTimer.js
          grep -Fq 'var(--clock-timer-inactive-ring-width, clamp(2px, 1.25cqi, 6px))' ClockTimer.js
          grep -Fq '...inactive,' ClockTimer.js
          grep -Fq 'borderRing,' ClockTimer.js
          grep -Fq 'activeRing,' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Reorder ClockTimer rings oldest outermost" || exit 0
          git push origin main
