name: Focus initial login username

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/focus-initial-login-username.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Focus username on initial login
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = '''        loginDialog.classList.add("initial-login-opening");\n        loginDialog.showModal();\n        setTimeout(() => {\n'''
          new = '''        loginDialog.classList.add("initial-login-opening");\n        loginDialog.showModal();\n        requestAnimationFrame(() => {\n            $("#loginUsername")?.focus({ preventScroll: true });\n        });\n        setTimeout(() => {\n'''
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: node --check app.js
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Focus username on initial login" || true
          git push origin HEAD:rename-prestart-latency
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin rename-prestart-latency
          git rm .github/workflows/focus-initial-login-username.yml
          git commit -m "Remove initial login focus workflow"
          git push origin HEAD:rename-prestart-latency
