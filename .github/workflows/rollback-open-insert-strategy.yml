name: Roll back open insert strategy
on:
  push:
    paths:
      - '.github/workflows/rollback-open-insert-strategy.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore ClockTimer baseline
        run: git checkout 5b79842c9f53c62b82dd9f97dd6e8cf3aa8d4cbf -- ClockTimer.js
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify restored baseline
        run: |
          test "$(git hash-object ClockTimer.js)" = "e8d2a216c2b0cc5dbdd09c1d59eedc910be2c3b7"
      - name: Commit rollback and cleanup
        run: |
          rm -f .github/workflows/rollback-open-insert-strategy.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/workflows/rollback-open-insert-strategy.yml
          git commit -m "Roll back open insert initialization strategy"
          git push origin main
