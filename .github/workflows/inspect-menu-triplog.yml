name: Inspect menu and trip log

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/inspect-menu-triplog.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Inspect exact menu trip log and sync blocks
        run: |
          echo '=== INDEX 20-125 ==='
          sed -n '20,125p' index.html
          echo '=== INDEX SETTINGS ==='
          sed -n '125,360p' index.html
          echo '=== APP TRIP LOG ==='
          sed -n '1,640p' app.js
          echo '=== APP PREFS ==='
          sed -n '620,710p' app.js
          echo '=== APP SUMMARY ==='
          grep -n -B 30 -A 100 'function updateSummaryValues' app.js
          echo '=== APP STARTUP ==='
          tail -n 260 app.js
          echo '=== CSS MENU ==='
          grep -n -B 30 -A 220 '^\.main-menu' app.css | head -n 700
          echo '=== CSS TRIP LOG ==='
          grep -n -B 50 -A 260 '^\.trip-log-button' app.css | head -n 900
          echo '=== CSS SUMMARY ==='
          grep -n -B 30 -A 130 '^\.percent-summary' app.css | head -n 500
