name: Inspect menu and trip log

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/inspect-menu-triplog.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Locate trip log body and listeners
        run: |
          echo '=== FILES ==='
          find . -maxdepth 3 -type f -not -path './.git/*' | sort
          echo '=== TRIP LOG EVENT REFERENCES OUTSIDE APP.JS ==='
          git grep -n -E 'wmof:trip-list-request|wmof:trip-list-closing|wmof:trip-list-closed|tripLogBody|trip-list-body|trip-log-body|Trip Log' -- ':!app.js' ':!.github/*' || true
          echo '=== APP EVENT REFERENCES ==='
          git grep -n -E 'wmof:trip-list-request|wmof:trip-list-closing|wmof:trip-list-closed' -- app.js || true
          echo '=== TRIP DRAFT CREATION / SYNC FIELDS ==='
          grep -n -B 20 -A 80 'matchTripGoalToTotal\|tripDraft =\|TRIP_PREFERENCE_DEFAULTS' app.js | head -n 1400 || true
