name: Inspect menu and trip log

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/inspect-menu-triplog.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Inspect sync and event handlers
        run: |
          echo '=== MATCH/SYNC OCCURRENCES ==='
          grep -n -B 12 -A 28 'matchTripGoalToTotal\|autoSyncTripGoal\|tripGoalSyncOption\|tripSettingsPreferences' app.js index.html || true
          echo '=== TRIP LOG HANDLERS ==='
          grep -n -B 12 -A 45 'tripListMenuButton.addEventListener\|tripLogButton.addEventListener\|tripLogPinButton.addEventListener' app.js || true
          echo '=== STATE SETTINGS FORM ==='
          grep -n -B 12 -A 70 'stateSettingsForm' app.js index.html || true
          echo '=== TRIP DRAFT ==='
          grep -n -B 20 -A 80 'function createTripDraft\|tripDraft = {' app.js || true
          echo '=== TRIP SETTINGS SYNC ==='
          grep -n -B 20 -A 100 'syncTripGoalOption\|syncTripSettings\|autoSyncTripGoal' app.js | tail -n 900 || true
