name: Add TimeRange split
on:
  push:
    paths:
      - '.github/workflows/add-timerange-split.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/add_timerange_split.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Verify split method
        run: |
          grep -q 'split(' TimeRange.js
          grep -q 'ignore-overlaps' TimeRange.js
          grep -q 'parent.insertBefore' TimeRange.js
      - name: Commit update and cleanup
        run: |
          rm .github/scripts/add_timerange_split.py
          rm .github/workflows/add-timerange-split.yml
          git config user.name sashort
          git config user.email 95879519+sashort@users.noreply.github.com
          git add TimeRange.js .github/scripts/add_timerange_split.py .github/workflows/add-timerange-split.yml
          git commit -m 'Add TimeRange split method'
          git push
