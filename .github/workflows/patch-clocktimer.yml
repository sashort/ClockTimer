name: Patch ClockTimer insertion preservation

on:
  push:
    paths:
      - .github/workflows/patch-clocktimer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ClockTimer.js
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('ClockTimer.js')
          source = path.read_text()

          helper_pattern = re.compile(
              r'        #captureDisplacedRangeAttributes\(.*?\n        #removeInsertedSegments\(\) \{',
              re.S,
          )

          helpers = r'''        #setRangeTiming(
            range,
            start,
            end,
            preserveRangeLength = false
        ) {
            range.setAttribute(
                "start-time",
                this.#formatTimelineTime(
                    start
                )
            );

            range.setAttribute(
                "end-time",
                this.#formatTimelineTime(
                    end
                )
            );

            if (
                preserveRangeLength
            ) {
                range.setAttribute(
                    "range-length",
                    this.#formatStandardTime(
                        end - start
                    )
                );
            }
            else {
                range.removeAttribute(
                    "range-length"
                );
            }

            range.dataset.clockTimerStart =
                String(start);

            range.dataset.clockTimerEnd =
                String(end);
        }

        #replaceRangeWithSegments(
            range,
            spans
        ) {
            const preservedAttributes =
                this.#getPreservedAttributes(
                    range
                );

            const preserveRangeLength =
                range.hasAttribute(
                    "range-length"
                );

            range.remove();

            let firstSegment =
                true;

            for (
                const [
                    spanStart,
                    spanEnd
                ] of spans
            ) {
                if (
                    !Number.isFinite(spanStart) ||
                    !Number.isFinite(spanEnd) ||
                    spanEnd <= spanStart
                ) {
                    continue;
                }

                let cursor =
                    spanStart;

                while (
                    cursor < spanEnd
                ) {
                    const ringIndex =
                        this.#getRingIndex(
                            cursor
                        );

                    const ringEnd =
                        this.#getRingStart(
                            ringIndex
                        ) +
                        ClockTimer.#HOUR;

                    const segmentEnd =
                        Math.min(
                            spanEnd,
                            ringEnd
                        );

                    const segment =
                        firstSegment
                            ? range
                            : document.createElement(
                                "time-range"
                            );

                    if (
                        !firstSegment
                    ) {
                        this.#applyPreservedAttributes(
                            segment,
                            preservedAttributes
                        );
                    }

                    this.#setRangeTiming(
                        segment,
                        cursor,
                        segmentEnd,
                        preserveRangeLength
                    );

                    const ring =
                        this.#ensureRing(
                            ringIndex
                        );

                    ring.appendChild(
                        segment
                    );

                    firstSegment =
                        false;

                    cursor =
                        segmentEnd;
                }
            }
        }

        #shiftExistingTimeRanges(
            cutoff,
            delta
        ) {
            const ranges =
                Array.from(
                    this.querySelectorAll(
                        ':scope > ring-container[data-clock-timer-ring] > time-range:not([data-clock-timer-inserted])'
                    )
                );

            for (
                const range of ranges
            ) {
                if (
                    range.getAttribute(
                        "type"
                    ) === "elapsed"
                ) {
                    continue;
                }

                const start =
                    Number(
                        range.dataset.clockTimerStart
                    );

                const end =
                    Number(
                        range.dataset.clockTimerEnd
                    );

                if (
                    !Number.isFinite(start) ||
                    !Number.isFinite(end) ||
                    end <= cutoff
                ) {
                    continue;
                }

                if (
                    start >= cutoff
                ) {
                    this.#replaceRangeWithSegments(
                        range,
                        [[
                            start + delta,
                            end + delta
                        ]]
                    );

                    continue;
                }

                this.#replaceRangeWithSegments(
                    range,
                    [
                        [
                            start,
                            cutoff
                        ],
                        [
                            cutoff + delta,
                            end + delta
                        ]
                    ]
                );
            }
        }

        #rebuildOvertimeRangeMap() {
            this.#overtimeRanges.clear();

            for (
                const range of
                    this.querySelectorAll(
                        ':scope > ring-container[data-clock-timer-ring] > time-range[data-clock-timer-overtime]'
                    )
            ) {
                const start =
                    Number(
                        range.dataset.clockTimerStart
                    );

                if (
                    !Number.isFinite(start)
                ) {
                    continue;
                }

                this.#overtimeRanges.set(
                    this.#getRingIndex(
                        start
                    ),
                    range
                );
            }
        }

        #removeInsertedSegments() {'''

          source, helper_count = helper_pattern.subn(helpers, source, count=1)
          if helper_count != 1:
              raise SystemExit(f'Expected one displaced-attribute helper block, found {helper_count}')

          shift_pattern = re.compile(
              r'        #shiftRangesAfter\(\n            cutoff,\n            delta,\n            excludedRecord\n        \) \{.*?\n        #updateOpenEndedRange\(',
              re.S,
          )

          shift = r'''        #shiftRangesAfter(
            cutoff,
            delta,
            excludedRecord
        ) {
            if (
                !Number.isFinite(delta) ||
                delta <= 0
            ) {
                return;
            }

            this.#captureInsertedAttributes();

            this.#shiftExistingTimeRanges(
                cutoff,
                delta
            );

            for (
                const record of
                    this.#insertedRanges
            ) {
                if (
                    record === excludedRecord
                ) {
                    continue;
                }

                const start =
                    this.#dateToTimelineTime(
                        record.startDate
                    );

                if (start < cutoff) {
                    continue;
                }

                record.startDate =
                    new Date(
                        record.startDate.getTime() +
                        delta
                    );

                if (record.endDate) {
                    record.endDate =
                        new Date(
                            record.endDate.getTime() +
                            delta
                        );
                }

                if (
                    Array.isArray(
                        record.preservedAttributes
                    )
                ) {
                    for (
                        const snapshot of
                            record.preservedAttributes
                    ) {
                        if (
                            Number.isFinite(snapshot.start)
                        ) {
                            snapshot.start += delta;
                        }

                        if (
                            Number.isFinite(snapshot.end)
                        ) {
                            snapshot.end += delta;
                        }
                    }
                }
            }

            if (
                this.#started
            ) {
                this.#shiftScheduleMarkers(
                    cutoff,
                    delta
                );
            }

            this.#rebuildOvertimeRangeMap();

            this.#removeEmptyRings();

            this.#renderAllInsertedRanges();

            if (
                this.#started
            ) {
                this.#reorderRings(
                    this.#getCurrentTimelineTime()
                );
            }
        }

        #updateOpenEndedRange('''

          source, shift_count = shift_pattern.subn(shift, source, count=1)
          if shift_count != 1:
              raise SystemExit(f'Expected one #shiftRangesAfter block, found {shift_count}')

          path.write_text(source)
          PY

          node --check ClockTimer.js

          git config user.name "ClockTimer automation"
          git config user.email "actions@users.noreply.github.com"
          git add ClockTimer.js
          if ! git diff --cached --quiet; then
            git commit -m "Preserve TimeRange attributes during insert"
            git push
          fi
