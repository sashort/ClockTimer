name: Patch ClockTimer insertion preservation

on:
  push:
    paths:
      - '.github/workflows/patch-clocktimer.yml'
      - '.github/scripts/patch_clocktimer.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch_clocktimer.py
      - run: node --check ClockTimer.js
      - run: |
          git config user.name "ClockTimer automation"
          git config user.email "actions@users.noreply.github.com"
          git add ClockTimer.js
          if ! git diff --cached --quiet; then
            git commit -m "Preserve TimeRange attributes during insert"
            git push
          fi
