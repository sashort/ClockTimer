name: Fix static active elapsed
on:
  push:
    paths:
      - .github/workflows/fix-static-active-elapsed.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-static-active-elapsed.py
      - name: Verify
        run: |
          node --check TimeRange.js
          python - <<'PY'
          from pathlib import Path
          s=Path('TimeRange.js').read_text()
          assert 'this.hasAttribute(\n                "static-elapsed"\n            ) ||\n            !activeRing' in s
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/fix-static-active-elapsed.py
          rm -f .github/workflows/fix-static-active-elapsed.yml
          rm -f .github/workflows/inspect-elapsed-animation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TimeRange.js .github
          git commit -m "Keep static elapsed wave off on active ring"
          git push
