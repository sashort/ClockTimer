name: Fix TimeRange full-hour clip

on:
  push:
    paths:
      - '.github/workflows/fix-timerange-full-hour-clip.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TimeRange clip fix
        run: python .github/scripts/fix_timerange_full_hour_clip.py

      - name: Syntax check
        run: node --check TimeRange.js

      - name: Targeted checks
        run: |
          grep -q '#getCornersBetweenAngles' TimeRange.js
          grep -q 'clip-path: none;' TimeRange.js
          grep -q 'polygonPoints.join' TimeRange.js
          ! grep -q '#getCornerBetweenAngles' TimeRange.js

      - name: Commit fix and cleanup
        run: |
          rm -f .github/workflows/fix-timerange-full-hour-clip.yml
          rm -f .github/scripts/fix_timerange_full_hour_clip.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/workflows/fix-timerange-full-hour-clip.yml .github/scripts/fix_timerange_full_hour_clip.py
          git commit -m 'Render complete and multi-corner TimeRanges' || exit 0
          git push

# retry after patch escaping fix
