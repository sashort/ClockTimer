name: Fix radial fitted percent-goal animation

on:
  push:
    branches:
      - radial-fitted-controller
    paths:
      - .github/scripts/fix_radial_fitted_percent_goal_animation.py
      - .github/workflows/fix-radial-fitted-percent-goal-animation.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted-controller
          path: controller

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted
          fetch-depth: 0
          path: target

      - name: Verify expected target base
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "aa5a080334a27b016b2fe8c90e5038cfa20df17c"

      - name: Apply radial fitted percent-goal animation fix
        run: |
          python controller/.github/scripts/fix_radial_fitted_percent_goal_animation.py target/ClockTimer.js

      - name: Syntax check
        working-directory: target
        run: node --check ClockTimer.js

      - name: Verify animation coordination
        working-directory: target
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()

          required = [
              '#captureRadialFittedPercentGoalAnimation(',
              '#prepareRadialFittedPercentGoalAnimation(',
              'active.fromFittedBounds = {',
              'active.targetFittedBounds = {',
              'state.fromFittedBounds &&',
              'state.targetFittedBounds',
              'state.originMilliseconds,\n                    fittedBounds',
          ]

          for item in required:
              assert item in text, item

          assert text.count('#captureRadialFittedPercentGoalAnimation(') == 2
          assert text.count('#prepareRadialFittedPercentGoalAnimation(') == 2
          PY
          git diff --check

      - name: Commit update on target branch
        working-directory: target
        run: |
          if git diff --quiet -- ClockTimer.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Animate radial fitted percent goal changes"
          git push origin HEAD:radial-fitted
