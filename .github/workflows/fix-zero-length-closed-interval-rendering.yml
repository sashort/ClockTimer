name: Fix zero-length closed interval rendering
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/fix-zero-length-closed-interval-rendering.yml'
      - '.github/scripts/fix_zero_length_closed_interval_rendering.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: python .github/scripts/fix_zero_length_closed_interval_rendering.py
      - name: Syntax checks
        run: |
          node --check ClockTimer.js
          node --check TimeRange.js
      - name: Verify finite zero-length records do not render
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("ClockTimer.js").read_text()
          start = text.index("        #renderInsertedRecord(")
          end = text.index("        #renderAllInsertedRanges()", start)
          block = text[start:end]
          finite_guard = block.index("Number.isFinite(\n                    effectiveEnd")
          zero_guard = block.index("effectiveEnd <= start", finite_guard)
          zero_return = block.index("return;", zero_guard)
          open_guard = block.index("!Number.isFinite(\n                    effectiveEnd", zero_return)
          create = block.index('document.createElement(\n                        "time-range"', open_guard)
          assert finite_guard < zero_guard < zero_return < open_guard < create
          PY
      - name: Commit source fix
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Stop rendering zero-length closed intervals" || exit 0
          git push origin HEAD:rename-prestart-latency
