name: Remove UI time rounding

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/remove_ui_time_rounding.py
      - .github/workflows/remove-ui-time-rounding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply change
        run: python .github/scripts/remove_ui_time_rounding.py

      - name: Validate
        run: |
          node --check ClockTimer.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()
          start = text.index('        #formatElapsedRenderedDuration(')
          end = text.index('        #calculateRenderedTime(', start)
          block = text[start:end]
          for needle in ('Math.round(', 'Math.floor(', 'Math.ceil(', 'Math.trunc('):
              if needle in block:
                  raise SystemExit(f'UI time formatting still contains {needle}')
          required = [
              'return `⁺${formatted}`;',
              'return `-${formatted}`;',
              'this.#formatSignedRenderedDuration(\n                milliseconds\n            );'
          ]
          for needle in required:
              if needle not in block:
                  raise SystemExit(f'missing assertion: {needle}')
          PY

      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/remove_ui_time_rounding.py
          rm -f .github/workflows/remove-ui-time-rounding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove elapsed and remaining UI rounding"
          git push origin HEAD:rename-prestart-latency
