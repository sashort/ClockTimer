name: Case-sensitive time-format
on:
  push:
    paths:
      - .github/workflows/case-sensitive-time-format.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/case-sensitive-time-format.py
      - name: Verify
        run: |
          node --check TemporalFormat.js
          node --check ClockTimer.js
          node - <<'NODE'
          require('./TemporalFormat.js');
          const T=globalThis.TemporalFormat;
          const d=new Date(2026,8,11,20,5,9);
          if(T.formatTime(d,'HH:mm',true)!=='20:05') throw Error('HH military failed');
          if(T.formatTime(d,'H:mm',true)!=='20:05') throw Error('H military failed');
          if(T.formatTime(d,'hh:mm',false)!=='08:05') throw Error('hh standard failed');
          if(T.formatTime(d,'h:mm',false)!=='8:05') throw Error('h standard failed');
          if(T.normalizeTimeFormat('hh:mm',true)!==undefined) throw Error('lower h accepted for military');
          if(T.normalizeTimeFormat('HH:mm',false)!==undefined) throw Error('upper H accepted for standard');
          NODE
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/scripts/case-sensitive-time-format.py .github/workflows/case-sensitive-time-format.yml
          git add TemporalFormat.js .github/scripts .github/workflows
          git commit -m "Make time-format hour tokens case-sensitive"
          git push
