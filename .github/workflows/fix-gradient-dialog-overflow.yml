name: Fix gradient dialog overflow

on:
  push:
    paths:
      - .github/workflows/fix-gradient-dialog-overflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply overflow fix
        run: python .github/scripts/fix_gradient_dialog_overflow.py

      - name: Validate
        run: |
          node --check app.js
          node --check ClockTimer.js
          grep -q '^\.settings-dialog,$' app.css
          git diff --check

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css
          git commit -m "Preserve scrolling in gradient settings dialogs"
          git push origin HEAD:rename-prestart-latency

      - name: Remove temporary patch files
        run: |
          git rm -f .github/scripts/fix_gradient_dialog_overflow.py .github/workflows/fix-gradient-dialog-overflow.yml
          git commit -m "Remove dialog overflow patch files"
          git push origin HEAD:rename-prestart-latency
