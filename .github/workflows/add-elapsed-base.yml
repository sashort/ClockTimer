name: Add elapsed base visibility

on:
  push:
    paths:
      - '.github/workflows/add-elapsed-base.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply elapsed base patch
        run: python .github/scripts/add-elapsed-base.py

      - name: Syntax check
        run: node --check TimeRange.js

      - name: Verify persistent elapsed visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('TimeRange.js').read_text()
          checks = [
              '#elapsedBaseLayer;',
              '#elapsed-base',
              'const baseStrength =',
              '0.09 +',
              'this.#elapsedBaseLayer.style.mixBlendMode =',
              'this.#elapsedBaseLayer.style.background =',
          ]
          missing = [item for item in checks if item not in text]
          if missing:
              raise SystemExit(f'Missing expected changes: {missing}')
          PY

      - name: Commit change and cleanup
        run: |
          rm .github/workflows/add-elapsed-base.yml
          rm .github/scripts/add-elapsed-base.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/workflows/add-elapsed-base.yml .github/scripts/add-elapsed-base.py
          git commit -m 'Keep elapsed range subtly visible between sweeps'
          git push
