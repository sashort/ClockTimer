name: Add Early Start color setting
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/add-early-start-color-setting.yml'
      - '.github/scripts/add_early_start_color_setting.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Early Start setting
        run: python .github/scripts/add_early_start_color_setting.py
      - name: Syntax check
        run: node --check app.js
      - name: Verify Early Start settings wiring
        run: |
          grep -Fq 'earlyStartColor: "#00a6d2"' app.js
          grep -Fq 'showEarlyStart: true' app.js
          grep -Fq 'target.toggleAttribute("render-early-start-as-trip", !Boolean(settings.showEarlyStart));' app.js
          grep -Fq '"--clock-timer-early-start-color": settings.earlyStartColor' app.js
          grep -Fq 'showEarlyStart: form.elements.showEarlyStart.checked' app.js
          grep -Fq 'name="showEarlyStart" type="checkbox" checked' index.html
          grep -Fq 'name="earlyStartColor" type="color"' index.html
          grep -Fq 'clock-timer time-range[type="earlystart"]' app.css
          grep -Fq 'clock-timer[render-early-start-as-trip] time-range[type="earlystart"]' app.css
      - name: Verify Early Start is adjacent to Trip settings
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          trip = text.index('for="tripColor">Trip')
          early = text.index('for="earlyStartColor">Early Start')
          lunch = text.index('for="lunchColor">Lunch')
          assert trip < early < lunch
          PY
      - name: Commit source changes
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js app.css index.html
          git commit -m "Add Early Start color setting" || exit 0
          git push origin HEAD:rename-prestart-latency
