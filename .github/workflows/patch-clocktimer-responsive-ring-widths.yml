name: Patch ClockTimer responsive ring widths

on:
  push:
    paths:
      - '.github/workflows/patch-clocktimer-responsive-ring-widths.yml'
      - '.github/scripts/patch_clocktimer_responsive_ring_widths.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/patch_clocktimer_responsive_ring_widths.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify responsive ring widths
        run: |
          grep -Fq 'var(--clock-timer-inactive-ring-width, clamp(2px, 1.25cqi, 6px))' ClockTimer.js
          grep -Fq 'var(--clock-timer-active-ring-width, clamp(4px, 2.5cqi, 12px))' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Make ClockTimer ring widths responsive" || exit 0
          git push origin main
