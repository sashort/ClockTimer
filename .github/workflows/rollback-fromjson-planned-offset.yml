name: Rollback fromJSON planned offset
on:
  push:
    paths:
      - .github/workflows/rollback-fromjson-planned-offset.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rollback
        run: python .github/scripts/rollback-fromjson-planned-offset.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          p=s.index('fromJSON(')
          q=s.index('\n        get status()', p)
          b=s[p:q]
          assert 'customIntervalOffset' not in b
          assert 'originalStandardDuration' not in b
          assert 'let elapsedCursor =' in b
          assert 'this.#percentGoal =\n                    1;' in b
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/rollback-fromjson-planned-offset.py
          rm -f .github/workflows/rollback-fromjson-planned-offset.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js .github
          git commit -m "Rollback restored planned-end custom offsets"
          git push
