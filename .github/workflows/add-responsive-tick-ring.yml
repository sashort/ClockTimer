name: Add responsive tick ring
on:
  push:
    paths:
      - '.github/workflows/add-responsive-tick-ring.yml'
      - '.github/scripts/add_responsive_tick_ring.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/add_responsive_tick_ring.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify tick ring integration
        run: |
          grep -Fq '#tickRing;' ClockTimer.js
          grep -Fq '#tickGeometryFrame;' ClockTimer.js
          grep -Fq '#ensureTickRing()' ClockTimer.js
          grep -Fq '#syncTickMarkGeometry()' ClockTimer.js
          grep -Fq '#startTickGeometryTracking()' ClockTimer.js
          grep -Fq 'ring.dataset.clockTimerTicks' ClockTimer.js
          grep -Fq 'var(--clock-timer-tick-inset, clamp(5px, 2cqi, 10px))' ClockTimer.js
          grep -Fq 'tickRing,' ClockTimer.js
      - name: Commit
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Make tick marks responsive to ring geometry" || exit 0
          git push origin main
