name: Refine number pad cloud

on:
  push:
    branches:
      - rename-prestart-latency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply number pad refinements
        run: python .github/scripts/refine-numberpad-cloud.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'renderAbsoluteDigits(numberPadState.pending) : "---"' app.js
          grep -Fq 'renderTimeDigits(numberPadState.pending) : "---"' app.js
          grep -Fq 'number-pad-cloud-fade-in 250ms' app.css
          grep -Fq '@keyframes number-pad-cloud-fade-in' app.css

      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/refine-numberpad-cloud.py
          rm -f .github/workflows/refine-numberpad-cloud.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app.css .github/scripts/refine-numberpad-cloud.py .github/workflows/refine-numberpad-cloud.yml
          git commit -m 'Refine number pad empty and cloud states'
          git push origin HEAD:rename-prestart-latency
