name: Rename time format attribute
on:
  push:
    paths:
      - .github/workflows/rename-time-format.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/rename-time-format.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          assert '"time-format"' in s[s.index('static observedAttributes'):s.index('static #HOUR')]
          assert 'case "time-format":' in s
          assert 'hasAttribute(\n                    "time-format"' in s
          assert 'setAttribute(\n                    "time-format"' in s
          assert '"format"' not in s
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/rename-time-format.py .github/workflows/rename-time-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js .github
          git commit -m "Rename format attribute to time-format"
          git push
