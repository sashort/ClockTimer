name: Add ClockTimer spin scale factor
on:
  push:
    paths:
      - '.github/workflows/add-spin-scale-factor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ClockTimer patch
        run: python .github/scripts/add_spin_scale_factor.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify spin scale factor
        run: |
          grep -Fq '@property --clock-timer-spin-scale-factor' ClockTimer.js
          grep -Fq 'initial-value: 0.95;' ClockTimer.js
          grep -Fq 'spinScaleFactor' ClockTimer.js
          grep -Fq '#getSpinScaleFactor' ClockTimer.js
          grep -Fq 'String(scaleFactor)' ClockTimer.js
      - name: Commit ClockTimer update and cleanup
        run: |
          rm -f .github/scripts/add_spin_scale_factor.py
          rm -f .github/workflows/add-spin-scale-factor.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/add_spin_scale_factor.py .github/workflows/add-spin-scale-factor.yml
          git commit -m "Add configurable spin scale factor"
          git push origin main
