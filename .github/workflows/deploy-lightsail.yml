name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: clocktimer-lightsail-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_SSH_KEY: ${{ secrets.LAMP_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$LAMP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$LAMP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy ClockTimer
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$LAMP_USER@$LAMP_HOST" \
            'set -euo pipefail
             $HOME/deploy-clocktimer.sh
             cd /opt/bitnami/apache2/htdocs
             git fetch origin main
             git checkout -B main origin/main
             git reset --hard origin/main
             echo "Deploy branch: $(git branch --show-current)"
             echo "Deploy commit: $(git rev-parse HEAD)"
             sudo -n /opt/bitnami/php/bin/php database/apply_admin_permissions.php
             sudo -n install -d -o daemon -g daemon -m 700 /var/lib/clocktimer/calendars
             VERSION=$(git rev-parse --short=12 HEAD)
             sed -i \
               -e "s#href=\"app.css\"#href=\"app.css?v=$VERSION\"#" \
               -e "s#src=\"TemporalFormat.js\"#src=\"TemporalFormat.js?v=$VERSION\"#" \
               -e "s#src=\"RingContainer.js\"#src=\"RingContainer.js?v=$VERSION\"#" \
               -e "s#src=\"TimeRange.js\"#src=\"TimeRange.js?v=$VERSION\"#" \
               -e "s#src=\"ClockTimer.js\"#src=\"ClockTimer.js?v=$VERSION\"#" \
               -e "s#src=\"app.js\"#src=\"app.js?v=$VERSION\"#" \
               -e "s#src=\"CalendarRange.js\"#src=\"CalendarRange.js?v=$VERSION\"#" \
               -e "s#src=\"TripLog.js\"#src=\"TripLog.js?v=$VERSION\"#" \
               index.html
             echo "Asset version: $VERSION"
             grep -E "app\\.css\\?v=|app\\.js\\?v=" index.html'
