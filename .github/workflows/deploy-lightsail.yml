name: Deploy to Lightsail

on:
  push:
    branches:
      - web-speech-experiment
  workflow_dispatch:

concurrency:
  group: clocktimer-lightsail-deploy
  cancel-in-progress: true

jobs:
  server-speech-tests:
    uses: ./.github/workflows/speech-server.yml
  speech-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # FSM reconciliation verifies the recorded commit history.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: |
          node tests/template-language-references.mjs
          node tests/standalone-settings-page.mjs
          node tests/graphical-settings-layout.mjs
          node tests/shared-page-templates.mjs
          python tests/build-version.py
          node tests/fsm-reference.mjs
          node tests/application-state-inventory.mjs
          node tests/diagnostics-checkpoint.cjs
          node tests/order-filler-state-contract.mjs
          node tests/fsm-loopback-feedback.mjs
          node tests/application-coordinator.mjs
          node tests/web-speech-recognizer.mjs
          node tests/web-speech-recovery.mjs
          node tests/app-state-transactions.mjs --vosk-alternatives --voice-feedback
          node tests/app-state-transactions.mjs --login-deadline --voice-feedback
          node tests/app-state-transactions.mjs --login-final-tail --voice-feedback
          node tests/validated-command-buffer.mjs
          node tests/app-state-transactions.mjs --parallel-command-buffer --voice-feedback
          node tests/app-state-transactions.mjs --parallel-command-buffer --accept-start --voice-feedback
          node tests/app-state-transactions.mjs --parallel-command-buffer --final-only --voice-feedback
          node tests/app-state-transactions.mjs --goal-forms --voice-feedback
          node tests/web-speech-command-selection.mjs
          node tests/speech-failfast.mjs
          node tests/owned-feedback-scope.mjs
          node tests/speech-continuation-session.mjs
          node tests/speech-value-collector.mjs
          node tests/speech-language-controller.mjs
          node tests/vosk-runtime-integrity.mjs
          node tests/drop-in-speech-debug.mjs
          node tests/goal-feedback.mjs
          node tests/app-state-transactions.mjs --goal-priority --voice-feedback
          node tests/app-state-transactions.mjs --goal-failure-batch --voice-feedback
          node tests/app-state-transactions.mjs --goal-cascade --voice-feedback
          node tests/app-state-transactions.mjs --startup-speech --startup-no-focus --voice-feedback
          node tests/speech-rejection-feedback.mjs
          node tests/tone-referenced-announcement.mjs
          node tests/scheduled-audio-cue.mjs
          node tests/neon-countdown-song.mjs
          node tests/cinematic-robot-pulse.mjs
          node tests/beat-tempo-ramp.mjs
          node tests/orchestral-finale.mjs
          node tests/app-state-transactions.mjs --time-reference --voice-feedback
          node tests/app-state-transactions.mjs --time-reference-voice --voice-feedback
          node tests/app-state-transactions.mjs --time-reference-paused --voice-feedback
          node tests/app-state-transactions.mjs --deferred-readback --voice-feedback
          node tests/app-state-transactions.mjs --announcement-layers --voice-feedback
          node tests/app-state-transactions.mjs --rejection-feedback --voice-feedback
          node tests/speech-command-digest.mjs
          node tests/adaptive-speech-timing.mjs
          node tests/command-vocabulary.mjs
          node tests/speech-response-chain.mjs
          node tests/observer-microphone.mjs
          node tests/microphone-capture-lifecycle.mjs
          node tests/speech-stop-command.mjs
          node tests/microphone-background-recovery.mjs
          node tests/app-state-transactions.mjs --speech-boundaries
          node tests/app-state-transactions.mjs --decoder-readiness-ui --voice-feedback
          node tests/app-state-transactions.mjs --delayed-final-owner --voice-feedback
          node tests/app-state-transactions.mjs --decoder-final-boundaries --voice-feedback
          node tests/app-state-transactions.mjs --ready-handoff --voice-feedback
          node tests/app-state-transactions.mjs --post-login-ready --voice-feedback
          node tests/app-state-transactions.mjs --voicepad-value-argument --voice-feedback
          node tests/app-state-transactions.mjs --mic-feedback --voice-feedback
          node tests/app-state-transactions.mjs --sleep-wake-only --voice-feedback
          node tests/app-state-transactions.mjs --mic-wake-grammar --voice-feedback
          node tests/app-state-transactions.mjs --mic-wake-native-final --voice-feedback
          node tests/async-command-lifecycle.mjs
          node tests/app-state-transactions.mjs --coordinator-end-trip
          node tests/app-state-transactions.mjs --commands-close
          node tests/app-state-transactions.mjs --sync-availability --voice-feedback
          node tests/app-state-transactions.mjs --sync-override-feedback --voice-feedback
          node tests/app-state-transactions.mjs --sync-voice
          node tests/app-state-transactions.mjs --auto-selector
          node tests/app-state-transactions.mjs --scope-feedback --voice-feedback
          node tests/app-state-transactions.mjs --range-permissions
          node tests/app-state-transactions.mjs --voicepad-continuation
          node tests/app-state-transactions.mjs --interval-actions
          node tests/app-state-transactions.mjs --break-boundaries --voice-feedback
          node tests/app-state-transactions.mjs --break-session-controls --voice-feedback
          node tests/app-state-transactions.mjs --break-end-stream --voice-feedback
          node tests/app-state-transactions.mjs --down-timing
          node tests/app-state-transactions.mjs --down-break
          node tests/app-state-transactions.mjs --pin-editing
          node tests/app-state-transactions.mjs --pin-return
          node tests/app-state-transactions.mjs --pin-review --voice-feedback
          node tests/app-state-transactions.mjs --voice-code
          node tests/app-state-transactions.mjs --voice-login-confirmed-chain --voice-feedback
          node tests/app-state-transactions.mjs --voice-login-confirmed-chain --voice-feedback --final-only
          node tests/app-state-transactions.mjs --voice-login-confirmed-chain --voice-feedback --leading-junk
          node tests/app-state-transactions.mjs --voice-login-confirmed-chain --voice-feedback --invalid-prefix --eight-digits
          node tests/app-state-transactions.mjs --voice-code-adapter
          node tests/clock-state-transactions.mjs
          TZ=UTC node tests/clock-timer-fsm.mjs
          TZ=America/New_York node tests/clock-timer-fsm.mjs
          TZ=UTC node tests/counted-time-accounting.mjs
          node tests/goal-bar.mjs
          TZ=UTC node tests/goal-bounding.mjs
          TZ=UTC node tests/fractional-time-indicators.mjs
          node tests/clock-timer-ui-state.mjs --standard-time
          node tests/app-state-transactions.mjs --goal-limit --voice-feedback
          node tests/trip-time-bank.mjs
          TZ=UTC node tests/trip-bank-goal-budget.mjs
          TZ=UTC node tests/goal-priority.mjs
          node tests/trip-log.mjs
          node tests/trip-summary.mjs
          node tests/trip-summary-presentation.mjs
          node tests/app-state-transactions.mjs --summary-dialog --voice-feedback
          node tests/trip-replay-identity.mjs
          node tests/async-persistence.mjs
          node tests/vosk-phrase-list-compiler.mjs
          node tests/spoken-duration.mjs
          node tests/spoken-time.mjs
          node tests/speech-value-preprocessor.mjs
          node tests/legacy-vosk-values.mjs
          node tests/vosk-recognizer.mjs
          node tests/vosk-grammar-router.mjs
          node tests/speech-recognition-ledger.mjs
          node tests/speech-latency-support.mjs
          node tests/vosk-context-handoff.mjs
          node tests/vosk-slot-recognizer.mjs
          node tests/vosk-speechmenu-context.mjs
          node tests/speech-grammar-context.mjs
          node tests/pocketsphinx-grammar-catalog.mjs
          node tests/speech-chain-actions.mjs
  settings-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: node tests/main-page-browser.cjs
      - run: node tests/vosk-collector-browser.cjs
      - run: node tests/web-speech-browser.cjs
      - run: node tests/percent-summary-layout-browser.cjs
      - run: node tests/retained-page-operation-browser.cjs
      - run: node tests/trip-time-bank-browser.cjs
      - run: node tests/overtime-break-browser.cjs
      - run: node tests/break-buffer-layout-browser.cjs
      - run: node tests/early-break-readout-browser.cjs
      - run: node tests/goal-bounding-browser.cjs
      - run: node tests/goal-bar-browser.cjs
      - run: node tests/goal-bar-units-browser.cjs
      - run: node tests/goal-bar-hit-area-browser.cjs
      - run: node tests/goal-bar-label-width-browser.cjs
      - run: node tests/goal-bar-avatar-browser.cjs
      - run: node tests/goal-bar-avatar-surface-browser.cjs
      - run: node tests/goal-bar-ticks-browser.cjs
      - run: node tests/layout-mode-transitions-browser.cjs
      - run: node tests/layout-startup-browser.cjs
      - run: node tests/goal-bar-interactions-browser.cjs
      - run: node tests/compact-actions-browser.cjs
      - run: node tests/goal-pad-layout-browser.cjs
      - run: node tests/web-speech-login-browser.cjs
      - run: node tests/web-speech-value-collection-browser.cjs
      - run: node tests/login-fullscreen-browser.cjs
      - run: node tests/order-filler-layout-browser.cjs
      - run: node tests/order-filler-master-touch.cjs
      - run: node tests/diagnostic-speech-audio-test.cjs
      - run: node tests/human-speech-audio-test.cjs
      - run: node tests/speech-recordings-browser.cjs
      - run: node tests/speech-continuation-browser.cjs
      - run: node tests/shared-modal-browser.cjs
      - run: node tests/hamburger-menu-coverage-browser.cjs
      - run: node tests/mic-modal-browser.cjs
      - run: node tests/trip-log-downtime-browser.cjs
      - run: node tests/break-session-browser.cjs
      - run: node tests/break-only-log-browser.cjs
      - run: node tests/impersonation-portal-browser.cjs
      - run: node tests/application-state-inventory-browser.cjs
      - run: node tests/graphical-settings-browser.cjs
      - run: node tests/ring-hidden-range-browser.cjs
      - run: node tests/radial-fitted-tick-browser.cjs
      - run: php -l graphical-settings.php
      - run: php tests/graphical-settings-page.php
  break-session-backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: clocktimer-test
          MARIADB_DATABASE: clocktimer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - run: php -l api/admin/impersonation/index.php
      - run: php -l api/_core/impersonation.php
      - run: php -l admin/impersonation.php
      - run: php -d extension=pdo_sqlite tests/impersonation.php
      - run: php -d extension=pdo_sqlite tests/live-stream-speech-debug.php
      - run: php -l api/command-check/index.php
      - run: php -l api/diagnostics/order-filler/index.php
      - run: php -l api/_core/order_filler_diagnostics.php
      - run: php tests/order-filler-diagnostics.php
      - run: php tests/diagnostics-jobs.php
      - run: php tests/speech-recordings.php
      - run: php tests/speech-recordings-api.php
      - run: php -l api/_core/trip_session_timing.php
      - run: php tests/trip-session-timing.php
      - run: php tests/trip_time_bank.php
      - run: php -l api/trips/index.php
      - run: php -l api/_core/trip_editor.php
      - run: php -l database/apply_admin_permissions.php
      - run: php -l migrations/014_break_only_sessions.php
      - run: php tests/command_checks.php
      - run: php tests/trip_editor.php
      - run: php tests/migrations.php
      - run: php tests/break-only-migration.php
        env:
          CLOCKTIMER_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=clocktimer_test;charset=utf8mb4
          CLOCKTIMER_TEST_PASSWORD: clocktimer-test
  deploy:
    if: github.ref == 'refs/heads/web-speech-experiment'
    needs: [speech-tests, settings-browser, break-session-backend, server-speech-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_SSH_KEY: ${{ secrets.LAMP_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$LAMP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$LAMP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy ClockTimer
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$LAMP_USER@$LAMP_HOST" \
            'set -euo pipefail
             DEPLOY_BRANCH=web-speech-experiment

             if ! sudo -n /opt/bitnami/ctlscript.sh status mariadb; then
               echo "MariaDB is not running; starting it."
               sudo -n /opt/bitnami/ctlscript.sh start mariadb
             fi
             sudo -n /opt/bitnami/ctlscript.sh status mariadb

             sudo -n chown root:daemon /etc/clocktimer
             sudo -n chmod 750 /etc/clocktimer
             sudo -n chown root:daemon /etc/clocktimer/config.php
             sudo -n chmod 640 /etc/clocktimer/config.php

             cd /opt/bitnami/apache2/htdocs

             ROLES_BACKUP=/tmp/clocktimer-SpeechFunctionRoles.js
             rm -f "$ROLES_BACKUP"
             if [ -f SpeechFunctionRoles.js ]; then
               cp SpeechFunctionRoles.js "$ROLES_BACKUP"
             fi

             # Git needs directory access to replace tracked files in inbound/, which
             # normally belongs to daemon with mode 700. Keep Apache/PHP access via
             # the daemon group during deployment; leave uploaded-file ownership alone.
             # Restore the private directory permissions even when a Git command fails.
             trap "sudo -n install -d -o daemon -g daemon -m 700 /opt/bitnami/apache2/htdocs/inbound" EXIT
             sudo -n install -d -o "$(id -un)" -g daemon -m 770 /opt/bitnami/apache2/htdocs/inbound

             # Repair the Git control files after the directory becomes accessible.
             if [ -f inbound/.gitattributes ]; then
               sudo -n chown "$(id -un)":daemon inbound/.gitattributes
               sudo -n chmod u+rw inbound/.gitattributes
             fi
             if [ -f inbound/.htaccess ]; then
               sudo -n chown "$(id -un)":daemon inbound/.htaccess
               sudo -n chmod u+rw inbound/.htaccess
             fi

             git reset --hard HEAD
             git fetch --force origin "$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
             git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
             git reset --hard "origin/$DEPLOY_BRANCH"

             # Restore the upload directory after Git finishes replacing tracked files.
             sudo -n install -d -o daemon -g daemon -m 700 /opt/bitnami/apache2/htdocs/inbound
             trap - EXIT

             if [ -s "$ROLES_BACKUP" ]; then
               cp "$ROLES_BACKUP" SpeechFunctionRoles.js
               rm -f "$ROLES_BACKUP"
             fi

             echo "Deploy branch: $(git branch --show-current)"
             echo "Deploy commit: $(git rev-parse HEAD)"

             # Apply schema changes immediately after checkout, before asset setup.
             sudo -n /opt/bitnami/php/bin/php database/apply_admin_permissions.php
             echo "Database migrations and connectivity check passed."

             # Full-vocabulary Vosk needs the verified same-origin runtime/model.
             python3 deploy/install_vosk_assets.py --root speech/vosk

             # The larger recognizer is opt-in until a real command benchmark
             # passes. Install it only when the application host has headroom.
             if sudo -n python3 deploy/install_speech_model.py --check-only; then
               sudo -n bash deploy/install-speech-server.sh
             else
               echo "Server speech not activated: capacity preflight failed; local Vosk remains available."
             fi

             LIVE_STREAM_SERVICE=/etc/systemd/system/clocktimer-live-stream.service
             LIVE_STREAM_APACHE_CONF=/opt/bitnami/apache2/conf/clocktimer-live-stream.conf
             HTTPD_CONF=/opt/bitnami/apache2/conf/httpd.conf

             sudo -n install -m 644 deploy/clocktimer-live-stream.service "$LIVE_STREAM_SERVICE"
             sudo -n install -m 644 deploy/clocktimer-live-stream-apache.conf "$LIVE_STREAM_APACHE_CONF"

             # Replace this service include, including malformed quoting from older
             # deployments, with one valid directive before checking Apache syntax.
             sudo -n sed -i "\|^[[:space:]]*Include[[:space:]].*/clocktimer-live-stream[.]conf|d" "$HTTPD_CONF"
             printf "Include \"%s\"\n" "$LIVE_STREAM_APACHE_CONF" | sudo -n tee -a "$HTTPD_CONF" >/dev/null

             sudo -n /opt/bitnami/apache2/bin/apachectl -t
             sudo -n systemctl daemon-reload
             sudo -n systemctl enable clocktimer-live-stream.service
             sudo -n systemctl restart clocktimer-live-stream.service
             sudo -n systemctl --no-pager --full status clocktimer-live-stream.service
             sudo -n /opt/bitnami/ctlscript.sh restart apache

             LIVE_STREAM_STATUS=$(curl -sS -o /tmp/clocktimer-live-stream-health.txt -w "%{http_code}" https://wmof.sashort-apps.com/live-stream-ws)
             echo "Live stream WebSocket proxy status: $LIVE_STREAM_STATUS"
             cat /tmp/clocktimer-live-stream-health.txt
             echo
             if [ "$LIVE_STREAM_STATUS" != "400" ]; then
               echo "Live stream service logs:"
               sudo -n journalctl -u clocktimer-live-stream.service -n 80 --no-pager || true
               echo "Recent Apache errors:"
               sudo -n tail -n 80 /opt/bitnami/apache2/logs/error_log || true
               exit 1
             fi

             sudo -n chown "$(id -un)":daemon SpeechFunctionRoles.js
             sudo -n chmod 664 SpeechFunctionRoles.js

             sudo -n install -d -o daemon -g daemon -m 700 /var/lib/clocktimer/calendars
             sudo -n install -d -o daemon -g daemon -m 700 /var/lib/clocktimer/diagnostics
             python3 scripts/stamp-version.py
             sudo -n bash deploy/install-diagnostics-runner.sh

             USERS_STATUS=$(curl -sS -o /tmp/clocktimer-users-health.json -w "%{http_code}" https://wmof.sashort-apps.com/api/users/)
             echo "Users API status: $USERS_STATUS"
             cat /tmp/clocktimer-users-health.json
             echo'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Verify deployed Order Filler workflows
        run: node tests/order-filler-post-deploy.cjs
        env:
          ORDER_FILLER_TEST_BASE_URL: https://wmof.sashort-apps.com/
          CLOCKTIMER_DIAGNOSTICS_CATEGORY: press
          CLOCKTIMER_DIAGNOSTICS_TOKEN: ${{ secrets.CLOCKTIMER_DIAGNOSTICS_TOKEN }}
      - name: Verify deployed Web Speech integration
        run: node tests/web-speech-browser.cjs
        env:
          ORDER_FILLER_TEST_BASE_URL: https://wmof.sashort-apps.com/
          CLOCKTIMER_TEST_EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-order-filler-diagnostics
          path: tests/artifacts/language-tests/
