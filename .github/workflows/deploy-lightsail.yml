name: Deploy to Lightsail

on:
  push:
    branches:
      - sherpa-client-asr
  workflow_dispatch:

concurrency:
  group: clocktimer-lightsail-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_SSH_KEY: ${{ secrets.LAMP_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$LAMP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$LAMP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy ClockTimer
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$LAMP_USER@$LAMP_HOST" \
            'set -euo pipefail
             DEPLOY_BRANCH=sherpa-client-asr

             if ! sudo -n /opt/bitnami/ctlscript.sh status mariadb; then
               echo "MariaDB is not running; starting it."
               sudo -n /opt/bitnami/ctlscript.sh start mariadb
             fi
             sudo -n /opt/bitnami/ctlscript.sh status mariadb

             sudo -n chown root:daemon /etc/clocktimer
             sudo -n chmod 750 /etc/clocktimer
             sudo -n chown root:daemon /etc/clocktimer/config.php
             sudo -n chmod 640 /etc/clocktimer/config.php

             cd /opt/bitnami/apache2/htdocs

             ROLES_BACKUP=/tmp/clocktimer-SpeechFunctionRoles.js
             rm -f "$ROLES_BACKUP"
             if [ -f SpeechFunctionRoles.js ]; then
               cp SpeechFunctionRoles.js "$ROLES_BACKUP"
             fi

             git reset --hard HEAD
             git fetch origin "$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
             git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
             git reset --hard "origin/$DEPLOY_BRANCH"

             if [ -s "$ROLES_BACKUP" ]; then
               cp "$ROLES_BACKUP" SpeechFunctionRoles.js
               rm -f "$ROLES_BACKUP"
             fi

             echo "Deploy branch: $(git branch --show-current)"
             echo "Deploy commit: $(git rev-parse HEAD)"

             SHERPA_DIR=/opt/bitnami/apache2/htdocs/speech/sherpa/runtime
             SHERPA_BASE=https://huggingface.co/spaces/k2-fsa/web-assembly-asr-sherpa-onnx-en/resolve/main
             mkdir -p "$SHERPA_DIR"

             for SHERPA_FILE in \
               sherpa-onnx-asr.js \
               sherpa-onnx-wasm-main-asr.js \
               sherpa-onnx-wasm-main-asr.wasm \
               sherpa-onnx-wasm-main-asr.data
             do
               if [ ! -s "$SHERPA_DIR/$SHERPA_FILE" ]; then
                 echo "Installing Sherpa runtime asset: $SHERPA_FILE"
                 rm -f "$SHERPA_DIR/$SHERPA_FILE.tmp"
                 curl -fL \
                   --retry 5 \
                   --retry-delay 2 \
                   --connect-timeout 20 \
                   -o "$SHERPA_DIR/$SHERPA_FILE.tmp" \
                   "$SHERPA_BASE/$SHERPA_FILE?download=true"
                 mv "$SHERPA_DIR/$SHERPA_FILE.tmp" "$SHERPA_DIR/$SHERPA_FILE"
               fi
             done

             chmod 644 \
               "$SHERPA_DIR/sherpa-onnx-asr.js" \
               "$SHERPA_DIR/sherpa-onnx-wasm-main-asr.js" \
               "$SHERPA_DIR/sherpa-onnx-wasm-main-asr.wasm" \
               "$SHERPA_DIR/sherpa-onnx-wasm-main-asr.data"

             echo "Sherpa runtime assets:"
             ls -lh "$SHERPA_DIR"/sherpa-onnx-*

             sudo -n /opt/bitnami/php/bin/php database/apply_admin_permissions.php
             echo "Database connectivity check passed."

             sudo -n chown "$(id -un)":daemon SpeechFunctionRoles.js
             sudo -n chmod 664 SpeechFunctionRoles.js

             sudo -n install -d -o daemon -g daemon -m 700 /var/lib/clocktimer/calendars
             VERSION=$(git rev-parse --short=12 HEAD)
             sed -i \
               -e "s#href=\"app.css\"#href=\"app.css?v=$VERSION\"#" \
               -e "s#src=\"TemporalFormat.js\"#src=\"TemporalFormat.js?v=$VERSION\"#" \
               -e "s#src=\"RingContainer.js\"#src=\"RingContainer.js?v=$VERSION\"#" \
               -e "s#src=\"TimeRange.js\"#src=\"TimeRange.js?v=$VERSION\"#" \
               -e "s#src=\"ClockTimer.js\"#src=\"ClockTimer.js?v=$VERSION\"#" \
               -e "s#src=\"app.js\"#src=\"app.js?v=$VERSION\"#" \
               -e "s#src=\"SpeechFunctionRoles.js\"#src=\"SpeechFunctionRoles.js?v=$VERSION\"#" \
               -e "s#src=\"SpeechFunctionRegistry.js\"#src=\"SpeechFunctionRegistry.js?v=$VERSION\"#" \
               -e "s#src=\"UtilityFunctions.js\"#src=\"UtilityFunctions.js?v=$VERSION\"#" \
               -e "s#src=\"SpeechProcessingFunctions.js\"#src=\"SpeechProcessingFunctions.js?v=$VERSION\"#" \
               -e "s#src=\"ActionFunctions.js\"#src=\"ActionFunctions.js?v=$VERSION\"#" \
               -e "s#src=\"InteractionFunctions.js\"#src=\"InteractionFunctions.js?v=$VERSION\"#" \
               -e "s#src=\"PresentationSetters.js\"#src=\"PresentationSetters.js?v=$VERSION\"#" \
               -e "s#src=\"CalendarRange.js\"#src=\"CalendarRange.js?v=$VERSION\"#" \
               -e "s#src=\"TripLog.js\"#src=\"TripLog.js?v=$VERSION\"#" \
               index.html
             echo "Asset version: $VERSION"
             grep -E "app\\.css\\?v=|app\\.js\\?v=" index.html

             USERS_STATUS=$(curl -sS -o /tmp/clocktimer-users-health.json -w "%{http_code}" https://wmof.sashort-apps.com/api/users/)
             echo "Users API status: $USERS_STATUS"
             cat /tmp/clocktimer-users-health.json
             echo
             if [ "$USERS_STATUS" != "401" ]; then
               echo "Recent Apache/PHP errors:"
               sudo -n tail -n 80 /opt/bitnami/apache2/logs/error_log || true
               exit 1
             fi'
