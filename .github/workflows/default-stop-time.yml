name: Default stop time
on:
  push:
    paths:
      - '.github/workflows/default-stop-time.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/default-stop-time.py
      - run: node --check ClockTimer.js
      - name: Verify
        run: |
          grep -q 'stopTime = this.#dateToStandardTime(' ClockTimer.js
          test "$(grep -c '^[[:space:]]*stop(' ClockTimer.js)" -eq 1
      - name: Commit
        run: |
          rm .github/scripts/default-stop-time.py .github/workflows/default-stop-time.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Default stopTime to current time'
          git push
