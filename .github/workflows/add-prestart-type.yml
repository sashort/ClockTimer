name: Add prestart TimeRange type
on:
  push:
    paths:
      - '.github/workflows/add-prestart-type.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch ClockTimer
        run: python .github/scripts/add-prestart-type.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Commit and self-clean
        run: |
          rm .github/workflows/add-prestart-type.yml .github/scripts/add-prestart-type.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js .github/workflows/add-prestart-type.yml .github/scripts/add-prestart-type.py
          git commit -m "Use prestart type for late actual starts"
          git push
