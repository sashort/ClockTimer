name: Fix Down to Break UI handoff
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/fix-down-to-break-ui.yml'
      - '.github/scripts/fix_down_to_break_ui.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI handoff fix
        run: python .github/scripts/fix_down_to_break_ui.py
      - name: Validate app syntax
        run: node --check app.js
      - name: Verify Down to Break sequencing
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text()
          assert 'button.addEventListener("click", async event =>' in text
          assert 'event.preventDefault();' in text
          start = text.index('async function startBreakInterval')
          end = text.index('function setTripControlState', start)
          block = text[start:end]
          assert 'await clockTimer.endInterval();' in block
          assert 'updateSummaryValues();' in block
          assert block.count('renderTripActionState();') >= 2
          assert 'await clockTimer.startInterval(' in block
          assert 'return Boolean(result);' in block
          PY
      - name: Commit UI fix
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Down to Break UI handoff" || exit 0
          git push origin HEAD:rename-prestart-latency
