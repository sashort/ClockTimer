name: Add TimeRange contour bevel
on:
  push:
    paths:
      - .github/workflows/add-timerange-bevel.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply bevel
        run: python .github/scripts/add-timerange-bevel.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Targeted checks
        run: |
          grep -q ':host:not(\[overlapping\])' TimeRange.js
          grep -q 'drop-shadow' TimeRange.js
          grep -q ':host(\[overlapping\])' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/add-timerange-bevel.py .github/workflows/add-timerange-bevel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js .github/scripts/add-timerange-bevel.py .github/workflows/add-timerange-bevel.yml
          git commit -m 'Add contour bevel to TimeRanges'
          git push
