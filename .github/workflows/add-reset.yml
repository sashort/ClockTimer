name: Add ClockTimer reset
on:
  push:
    paths:
      - '.github/workflows/add-reset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/add-reset.py
      - name: Check syntax
        run: node --check ClockTimer.js
      - name: Commit and self-clean
        run: |
          rm .github/workflows/add-reset.yml
          rm .github/scripts/add-reset.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js .github/workflows/add-reset.yml .github/scripts/add-reset.py
          git commit -m "Preserve ClockTimer start state and add reset"
          git push origin HEAD:main
# retry
