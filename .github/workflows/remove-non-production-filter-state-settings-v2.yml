name: Remove non-production filter from state settings v2

on:
  push:
    branches:
      - rename-prestart-latency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Remove non-production filter control
        run: |
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); u,n=re.subn(r'\\s*<label>Non-Production Filter\\s*<select name=\"nonProductionFilter\">.*?</select>\\s*</label>', '', s, count=1, flags=re.S); assert n == 1, f'expected 1 control, found {n}'; p.write_text(u)"
          node --check app.js
          ! grep -q 'nonProductionFilter' index.html
          ! grep -q 'form.elements.nonProductionFilter' app.js
      - name: Commit source change
        run: |
          if git diff --quiet -- index.html app.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app.js
          git commit -m "Remove non-production filter from state settings"
          git push origin HEAD:rename-prestart-latency
