name: Patch stopped rendered time

on:
  push:
    branches:
      - rename-prestart-latency

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.js")
          s = p.read_text()
          a = '            clockTimer.status === "running"\n'
          b = '            ["running", "stopped"].includes(clockTimer.status)\n'
          if a not in s:
              raise SystemExit("rendered time condition not found")
          s = s.replace(a, b, 1)
          a = '["tick", "start", "clear", "goalChange", "percentModeChange"]'
          b = '["tick", "start", "stop", "clear", "goalChange", "percentModeChange"]'
          if a not in s:
              raise SystemExit("summary event list not found")
          p.write_text(s.replace(a, b, 1))
          PY
          node --check app.js

      - name: Commit app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Show rendered time for stopped trips"
          git push origin HEAD:rename-prestart-latency
