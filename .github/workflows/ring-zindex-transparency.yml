name: Ring layering transparency
on:
  push:
    paths:
      - '.github/workflows/ring-zindex-transparency.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/ring-zindex-transparency.py
      - name: Validate syntax
        run: node --check ClockTimer.js
      - name: Verify changes
        run: |
          grep -q 'ringLayerHandoffTimeout' ClockTimer.js
          grep -q 'transparent !important' ClockTimer.js
          grep -q 'becomingInactiveRing.style.zIndex' ClockTimer.js
      - name: Commit and clean up
        run: |
          rm .github/scripts/ring-zindex-transparency.py
          rm .github/workflows/ring-zindex-transparency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/ring-zindex-transparency.py .github/workflows/ring-zindex-transparency.yml
          git commit -m 'Layer transitioning timer rings above other rings'
          git push