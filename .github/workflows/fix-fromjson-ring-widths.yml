name: Fix fromJSON ring widths
on:
  push:
    paths:
      - .github/workflows/fix-fromjson-ring-widths.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-fromjson-ring-widths.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          grep -q 'delete ring.clockTimerTargetWidth' ClockTimer.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/fix-fromjson-ring-widths.py .github/workflows/fix-fromjson-ring-widths.yml .github/workflows/inspect-ring-layout.yml
          git add ClockTimer.js .github
          git commit -m 'Restore ring widths after fromJSON'
          git push
