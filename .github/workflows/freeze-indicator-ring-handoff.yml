name: Freeze indicator during ring handoff
on:
  push:
    paths:
      - '.github/workflows/freeze-indicator-ring-handoff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch ClockTimer
        run: python .github/scripts/freeze-indicator-ring-handoff.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Commit functional change and cleanup
        run: |
          rm .github/workflows/freeze-indicator-ring-handoff.yml
          rm .github/scripts/freeze-indicator-ring-handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/freeze-indicator-ring-handoff.yml .github/scripts/freeze-indicator-ring-handoff.py
          git commit -m 'Keep indicator stationary during ring handoff'
          git push
