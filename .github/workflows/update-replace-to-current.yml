name: Update ClockTimer replacement splitting
on:
  push:
    paths:
      - '.github/workflows/update-replace-to-current.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ClockTimer patch
        run: python .github/scripts/update_replace_to_current.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify replacement behavior
        run: |
          grep -Fq 'currentEnd - now' ClockTimer.js
          grep -Fq 'currentRange.nextSibling' ClockTimer.js
          grep -Fq 'now - currentStart' ClockTimer.js
          if grep -A160 'replaceToNext(' ClockTimer.js | grep -Fq 'nextRange'; then exit 1; fi
          if grep -A150 'replaceToPrevious(' ClockTimer.js | grep -Fq 'previousRange'; then exit 1; fi
      - name: Commit ClockTimer update and cleanup
        run: |
          rm -f .github/scripts/update_replace_to_current.py
          rm -f .github/workflows/update-replace-to-current.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/update_replace_to_current.py .github/workflows/update-replace-to-current.yml
          git commit -m "Make replacement methods split current range"
          git push origin main
