name: Implement number pad persistence

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/implement-numberpad-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/implement_numberpad_persistence.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check ClockTimer.js

      - name: Validate PHP
        run: |
          if command -v php >/dev/null 2>&1; then
            php -l api/trips/index.php
          fi

      - name: Validate expected files
        run: |
          test -f numberpad.html
          test -f database/migrations/20260915_add_pending_trip_reservations.sql
          grep -q 'data-persistence="offline"' numberpad.html
          grep -q 'async prepareTrip' ClockTimer.js
          grep -q 't.pending = 0' api/trips/index.php

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html numberpad.html app.css app.js ClockTimer.js api/trips/index.php database/create_database.sql database/migrations/20260915_add_pending_trip_reservations.sql
          git commit -m 'Implement number pad trip persistence states'
          git push origin HEAD:rename-prestart-latency

      - name: Remove patch files
        run: |
          git rm .github/scripts/implement_numberpad_persistence.py .github/workflows/implement-numberpad-persistence.yml
          git commit -m 'Remove number pad persistence patch files'
          git push origin HEAD:rename-prestart-latency
