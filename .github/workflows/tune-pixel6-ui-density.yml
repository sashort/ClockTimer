name: Tune Pixel 6 UI density
on:
  push:
    paths:
      - '.github/workflows/tune-pixel6-ui-density.yml'
      - '.github/scripts/tune_pixel6_ui_density.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Apply Pixel 6 density tuning
        run: python .github/scripts/tune_pixel6_ui_density.py
      - name: Validate density anchors
        run: |
          grep -Fq 'pixel6-reference-density-v1' app.css
          grep -Fq 'font-size: clamp(36px, 10vw, 42px);' app.css
          grep -Fq 'font-size: clamp(36px, 9.7vw, 40px);' app.css
          grep -Fq -- '--clock-timer-time-font-size: clamp(40px, 11vw, 46px);' app.css
          grep -Fq 'padding-inline: clamp(5px, 2vw, 8px);' app.css
          git diff --check
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css
          git commit -m "Tune mobile UI density to Pixel 6 reference"
          git push origin rename-prestart-latency
      - name: Remove temporary patch files
        run: |
          git pull --ff-only origin rename-prestart-latency
          rm -f .github/scripts/tune_pixel6_ui_density.py
          rm -f .github/workflows/tune-pixel6-ui-density.yml
          rm -f .github/scripts/separate_status_network.py
          rm -f .github/workflows/separate-status-network.yml
          rm -f .github/scripts/separate_status_network_retry.py
          rm -f .github/workflows/separate-status-network-retry.yml
          rm -f .github/scripts/separate_status_network_retry2.py
          rm -f .github/workflows/separate-status-network-retry2.yml
          rm -f .github/workflows/separate-status-network-retry3.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary UI patch files"
          git push origin rename-prestart-latency
