name: Align start clear duration
on:
  push:
    paths:
      - '.github/workflows/align-start-clear-duration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply duration alignment
        run: python .github/scripts/align-start-clear-duration.py
      - name: Syntax checks
        run: |
          node --check TimeRange.js
          node --check RingContainer.js
          node --check ClockTimer.js
      - name: Targeted checks
        run: |
          grep -q 'static #animationDuration = 333;' TimeRange.js
          ! grep -q '333.333ms' RingContainer.js
          grep -q '333ms' RingContainer.js
          grep -q -- '--clock-timer-ring-resize-duration:' ClockTimer.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/align-start-clear-duration.py
          rm .github/workflows/align-start-clear-duration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TimeRange.js RingContainer.js .github/scripts/align-start-clear-duration.py .github/workflows/align-start-clear-duration.yml
          git commit -m 'Align start and clear with ring resize duration'
          git push
