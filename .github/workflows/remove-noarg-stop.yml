name: Remove no-arg stop
on:
  push:
    paths:
      - .github/workflows/remove-noarg-stop.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove no-argument stop
        run: python .github/scripts/remove-noarg-stop.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          test "$(grep -cE '^        stop\(\) \{' ClockTimer.js || true)" -eq 0
          test "$(grep -cE '^        stop\(stopTime\) \{' ClockTimer.js || true)" -eq 1
      - name: Commit source and cleanup
        run: |
          rm .github/scripts/remove-noarg-stop.py .github/workflows/remove-noarg-stop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js .github
          git commit -m "Remove no-argument stop method"
          git push
