name: Fix ClockTimer time layout

on:
  push:
    paths:
      - '.github/workflows/fix-clocktimer-time-layout.yml'
      - '.github/scripts/fix_clocktimer_time_layout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused ClockTimer time layout patch
        run: python .github/scripts/fix_clocktimer_time_layout.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify time layout
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()
          assert '#time-layer {' in text
          assert 'display: flex;' in text
          assert 'align-items:' in text
          assert 'justify-content:' in text
          assert 'max-width:' in text
          assert 'max-content;' in text
          assert 'flex:' in text
          assert '0 0 auto;' in text
          PY
      - name: Commit ClockTimer fix and cleanup
        run: |
          rm -f .github/scripts/fix_clocktimer_time_layout.py
          rm -f .github/workflows/fix-clocktimer-time-layout.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix_clocktimer_time_layout.py .github/workflows/fix-clocktimer-time-layout.yml
          git commit -m "Keep ClockTimer time display shrink-wrapped"
          git push origin main
