name: Fade tick marks with hands
on:
  push:
    paths:
      - '.github/workflows/fade-tick-marks-with-hands.yml'
      - '.github/scripts/fade_tick_marks_with_hands.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tick mark fade patch
        run: python .github/scripts/fade_tick_marks_with_hands.py
      - name: Validate
        run: |
          node --check ClockTimer.js
          grep -Fq '#tick-marks {' ClockTimer.js
          grep -Fq 'this.#tickMarkLayer.style.opacity =' ClockTimer.js
          grep -Fq '750ms;' ClockTimer.js
      - name: Commit source changes and cleanup
        run: |
          rm -f .github/scripts/fade_tick_marks_with_hands.py
          rm -f .github/workflows/fade-tick-marks-with-hands.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fade_tick_marks_with_hands.py .github/workflows/fade-tick-marks-with-hands.yml
          git commit -m "Fade tick marks with synchronized hands"
          git push origin rename-prestart-latency
