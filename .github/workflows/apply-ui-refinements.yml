name: Apply UI refinements
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/apply-ui-refinements.yml'
      - '.github/scripts/refine_offline_sync_and_trip_controls.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI refinements
        run: python .github/scripts/refine_offline_sync_and_trip_controls.py
      - name: Syntax check
        run: node --check app.js
      - name: Verify requested UI states
        run: |
          grep -Fq 'sync-offline-arrow-spin-v1' app.js
          grep -Fq 'sync-offline-arrow-spin-v1' app.css
          grep -Fq 'sync-offline-arrow' app.js
          grep -Fq 'content: "(offline)";' app.css
          grep -Fq '.app[data-network-status="offline"] #syncGoalsMenuButton > span:last-child' app.css
          grep -Fq '.app[data-interval-state="break"] .active-trip-controls' app.css
      - name: Commit source changes
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add app.js app.css
          git commit -m "Refine offline sync animation and trip control sizing" || exit 0
          git push origin HEAD:rename-prestart-latency
