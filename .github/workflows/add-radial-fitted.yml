name: Add radial fitted ClockTimer
'on':
  push:
    branches:
      - radial-fitted-controller
    paths:
      - '.github/workflows/add-radial-fitted.yml'
      - '.github/scripts/add_radial_fitted.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted
          path: target
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted-controller
          path: controller
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply radial-fitted implementation
        run: python controller/.github/scripts/add_radial_fitted.py target/ClockTimer.js
      - name: Syntax check
        run: node --check target/ClockTimer.js
      - name: Verify radial-fitted structure
        run: |
          grep -Fq '"timer-type"' target/ClockTimer.js
          grep -Fq '"radial-fitted"' target/ClockTimer.js
          grep -Fq '#getRadialFittedBounds(' target/ClockTimer.js
          grep -Fq '#refreshRadialFittedLayouts(' target/ClockTimer.js
          grep -Fq '#getTimerRingIndex(' target/ClockTimer.js
          grep -Fq '#getTimerRingEnd(' target/ClockTimer.js
      - name: Commit implementation on target branch
        working-directory: target
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Add radial fitted timer type" || exit 0
          git push origin radial-fitted
