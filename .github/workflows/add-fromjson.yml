name: Add ClockTimer fromJSON
on:
  push:
    paths: ['.github/workflows/add-fromjson.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python .github/scripts/add-fromjson.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          grep -q 'fromJSON(json)' ClockTimer.js
          grep -q 'this.status !== "ready"' ClockTimer.js
      - name: Commit
        run: |
          rm .github/scripts/add-fromjson.py .github/workflows/add-fromjson.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/add-fromjson.py .github/workflows/add-fromjson.yml
          git commit -m 'Add ClockTimer fromJSON parser'
          git push
