name: Fix ClockTimer open overwrite initial render
on:
  push:
    paths:
      - '.github/workflows/fix-open-overwrite-initial-render.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ClockTimer patch
        run: python .github/scripts/fix_open_overwrite_initial_render.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify open overwrite initial update
        run: |
          grep -Fq 'const initialNowDate =' ClockTimer.js
          grep -Fq 'this.#updateOpenOverwriteRange(' ClockTimer.js
          grep -Fq 'start + 1;' ClockTimer.js
      - name: Commit ClockTimer update and cleanup
        run: |
          rm -f .github/scripts/fix_open_overwrite_initial_render.py
          rm -f .github/workflows/fix-open-overwrite-initial-render.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix_open_overwrite_initial_render.py .github/workflows/fix-open-overwrite-initial-render.yml
          git commit -m "Fix open overwrite initial render"
          git push origin main
