name: Inspect toJSON context
on:
  push:
    paths:
      - '.github/workflows/inspect-tojson-context.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant methods
        run: |
          for pattern in '#startedAtEpoch' '#getCurrentTimelineTime' '#dateToTimelineTime' 'start(' 'get creationTime' 'get scheduledStart' 'get standardTime'; do
            echo "===== $pattern ====="
            line=$(grep -n -m1 -F "$pattern" ClockTimer.js | cut -d: -f1)
            if [ -n "$line" ]; then
              start=$((line-30)); [ $start -lt 1 ] && start=1
              end=$((line+120))
              sed -n "${start},${end}p" ClockTimer.js
            fi
          done
      - name: Cleanup
        run: |
          rm .github/workflows/inspect-tojson-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-tojson-context.yml
          git commit -m 'Remove toJSON inspection workflow'
          git push
