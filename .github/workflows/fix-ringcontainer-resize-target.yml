name: Fix RingContainer resize target
on:
  push:
    paths:
      - '.github/workflows/fix-ringcontainer-resize-target.yml'
      - '.github/scripts/fix_ringcontainer_resize_target.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply RingContainer patch
        run: python .github/scripts/fix_ringcontainer_resize_target.py
      - name: Syntax check
        run: node --check RingContainer.js
      - name: Verify resize target guards
        run: |
          grep -Fq '#resizeTarget;' RingContainer.js
          grep -Fq 'const pendingInset =' RingContainer.js
          grep -Fq 'this.#resizeAnimation !==' RingContainer.js
          grep -Fq '#instanceFilter;' RingContainer.js
      - name: Commit RingContainer update and cleanup
        run: |
          rm -f .github/scripts/fix_ringcontainer_resize_target.py
          rm -f .github/workflows/fix-ringcontainer-resize-target.yml
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add RingContainer.js .github/scripts/fix_ringcontainer_resize_target.py .github/workflows/fix-ringcontainer-resize-target.yml
          git commit -m "Stabilize RingContainer resize targets"
          git push origin main
