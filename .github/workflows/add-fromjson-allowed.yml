name: Add fromJSON allowed handling
on:
  push:
    paths:
      - .github/workflows/add-fromjson-allowed.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/add-fromjson-allowed.py
      - name: Check syntax
        run: node --check ClockTimer.js
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js
          git commit -m 'Handle allowed late starts in fromJSON'
          git push
