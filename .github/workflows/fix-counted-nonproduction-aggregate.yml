name: Fix counted non-production aggregate

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/fix-counted-nonproduction-aggregate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Patch aggregate loop
        run: python3 .github/scripts/fix_counted_nonproduction_aggregate.py

      - name: Validate
        run: |
          php -l api/trips/index.php
          python3 - <<'PY'
          from pathlib import Path
          text = Path('api/trips/index.php').read_text()
          assert "$tripCountedMilliseconds =\n            $trip['countedTimeMilliseconds'];" in text
          assert "SUM(t.counted_time_ms)" in text
          PY

      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/trips/index.php
          git commit -m 'Fix counted non-production aggregate totals'
          git push origin HEAD:rename-prestart-latency
