name: Update total-derived trip goal

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/update-total-derived-trip-goal.py
      - .github/workflows/update-total-derived-trip-goal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply update
        run: python .github/scripts/update-total-derived-trip-goal.py

      - name: Validate
        run: |
          node --check ClockTimer.js
          node --check app.js
          grep -q 'calculateTripGoalFromTotal' ClockTimer.js
          grep -q 'Math.ceil(' ClockTimer.js
          grep -q 'getTripSettingsDerivedTotalGoalPercent' app.js
          grep -q 'tripGoalSyncNoData.textContent = `(${derivedTotalGoalPercent}%)`' app.js

      - name: Commit and cleanup
        run: |
          rm .github/scripts/update-total-derived-trip-goal.py
          rm .github/workflows/update-total-derived-trip-goal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preview and ceil total-derived trip goal'
          git push origin HEAD:rename-prestart-latency
