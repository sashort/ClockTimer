name: Fix stop behavior
on:
  push:
    paths:
      - '.github/workflows/fix-stop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/fix-stop.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          assert '        stop() {' in s
          assert 'this.#started =\n                false;' in s
          assert 'type: "stop"' in s
          assert 'case "stop":' in s
          assert 'this.closeOpenRange();' in s
          PY
      - name: Commit fix and cleanup
        run: |
          rm .github/scripts/fix-stop.py .github/workflows/fix-stop.yml
          git config user.name sashort
          git config user.email '95879519+sashort@users.noreply.github.com'
          git add -A
          git commit -m 'Fix stop behavior'
          git push
