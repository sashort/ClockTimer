name: Static fromJSON elapsed overlays
on:
  push:
    paths:
      - .github/workflows/static-fromjson-elapsed.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/static-fromjson-elapsed.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          node --check TimeRange.js
          python - <<'PY'
          from pathlib import Path
          c=Path('ClockTimer.js').read_text()
          t=Path('TimeRange.js').read_text()
          p=c.index('fromJSON(')
          q=c.index('\n        get status()', p)
          b=c[p:q]
          assert '"static-elapsed"' in b
          assert 'elapsedRange.timeRangeFullEntry =\n                            true;' in b
          assert ':host([type="elapsed"]:not([static-elapsed])) #elapsed-wave' in t
          assert ':host([type="elapsed"][static-elapsed]) #elapsed-wave' in t
          assert 'display: none;' in t
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/static-fromjson-elapsed.py
          rm -f .github/workflows/static-fromjson-elapsed.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClockTimer.js TimeRange.js .github
          git commit -m "Keep restored elapsed overlays static"
          git push
