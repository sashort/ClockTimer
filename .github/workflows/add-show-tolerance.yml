name: Add showTolerance

on:
  push:
    paths:
      - '.github/workflows/add-show-tolerance.yml'
      - '.github/scripts/add_show_tolerance.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
          path: target

      - name: Checkout controller helpers
        uses: actions/checkout@v4
        with:
          ref: radial-fitted-controller
          path: controller

      - name: Verify expected target base
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "bab60aeac72ee8ebdf307906de393c7840cfaf7c"

      - name: Apply showTolerance patch
        working-directory: target
        run: python ../controller/.github/scripts/add_show_tolerance.py

      - name: Verify implementation
        working-directory: target
        run: |
          node --check ClockTimer.js
          grep -q 'get showTolerance()' ClockTimer.js
          grep -q 'set showTolerance(value)' ClockTimer.js
          grep -q '#getToleranceRenderEnd(' ClockTimer.js
          grep -q '#loadingFromJSON' ClockTimer.js

      - name: Commit update on target branch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Add showTolerance control"
          git push origin HEAD:rename-prestart-latency

