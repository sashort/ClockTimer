name: Scale ClockTimer hands with rings

on:
  push:
    paths:
      - '.github/workflows/scale-clock-hands.yml'

permissions:
  contents: write

jobs:
  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hand scaling change
        run: python .github/scripts/scale_clock_hands.py

      - name: Syntax check
        run: node --check ClockTimer.js

      - name: Targeted checks
        run: |
          grep -q '#hand-layer' ClockTimer.js
          grep -q '#syncHandGeometry' ClockTimer.js
          grep -q '#getRingInset' ClockTimer.js
          grep -q 'this.#handRing' ClockTimer.js

      - name: Commit change and cleanup
        run: |
          rm -f .github/workflows/scale-clock-hands.yml
          rm -f .github/scripts/scale_clock_hands.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/scale-clock-hands.yml .github/scripts/scale_clock_hands.py
          git commit -m 'Scale ClockTimer hands with ring layout' || exit 0
          git push
