name: Fix radial overflow active width
'on':
  push:
    branches:
      - radial-fitted-controller
    paths:
      - '.github/workflows/fix-radial-overflow-active-width.yml'
      - '.github/scripts/fix_radial_overflow_active_width.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted
          path: target
      - name: Verify expected target base
        run: test "$(git -C target rev-parse HEAD)" = "e521fcd614b075f3ca02eb7013c957e2b2dacf8b"
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: radial-fitted-controller
          path: controller
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply radial overflow active width fix
        run: python controller/.github/scripts/fix_radial_overflow_active_width.py target/ClockTimer.js
      - name: Syntax check
        run: node --check target/ClockTimer.js
      - name: Structural check
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('target/ClockTimer.js').read_text()
          active = 'active\n                        ?\n                        "var(--clock-timer-active-ring-width, clamp(2px, 1.25cqi, 6px))"'
          inactive = ':\n                        "var(--clock-timer-inactive-ring-width, clamp(4px, 2.5cqi, 12px))";'
          assert active in source
          assert inactive in source
          PY
      - name: Commit fix on target branch
        working-directory: target
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Fix radial overflow active ring width" || exit 0
          git push origin radial-fitted
