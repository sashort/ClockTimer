name: Apply numberpad connection UX

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-numberpad-connection-ux.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply connection and transition changes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' \
            '' \
            '' \
            '' \
            '' \
            | base64 -d > /tmp/apply-numberpad-connection-ux.py
          python /tmp/apply-numberpad-connection-ux.py
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-numberpad-connection-ux.yml
          git add app.js app.css
          git diff --cached --check
          git commit -m "Refine numberpad connection transitions"
          git push origin HEAD:rename-prestart-latency
