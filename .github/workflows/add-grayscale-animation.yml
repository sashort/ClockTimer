name: Add grayscale animation

on:
  push:
    paths:
      - '.github/workflows/add-grayscale-animation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/add-grayscale-animation.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify grayscale support
        run: |
          grep -q '"grayscale"' ClockTimer.js
          grep -q '"grayscale-ramp"' ClockTimer.js
          grep -q -- '--clock-timer-grayscale' ClockTimer.js
          grep -q -- '--clock-timer-grayscale-ramp' ClockTimer.js
          grep -q 'case "grayscale"' ClockTimer.js
      - name: Commit changes and self-clean
        run: |
          rm .github/scripts/add-grayscale-animation.py
          rm .github/workflows/add-grayscale-animation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/add-grayscale-animation.py .github/workflows/add-grayscale-animation.yml
          git commit -m 'Add async grayscale animation attributes'
          git push
