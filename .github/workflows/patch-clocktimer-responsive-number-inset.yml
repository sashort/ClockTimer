name: Patch ClockTimer responsive number inset

on:
  push:
    paths:
      - '.github/workflows/patch-clocktimer-responsive-number-inset.yml'
      - '.github/scripts/patch_clocktimer_responsive_number_inset.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/patch_clocktimer_responsive_number_inset.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify responsive inset
        run: |
          grep -Fq 'var(--clock-timer-number-inset, clamp(4px, 3cqi, 16px))' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Make ClockTimer number inset responsive" || exit 0
          git push origin main
