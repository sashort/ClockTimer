name: Apply timer settings UI

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-timer-settings.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply changes
        run: |
          set -euo pipefail
          python .github/scripts/apply_timer_settings.py
          node --check app.js
          git diff --check

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-timer-settings.yml
          git rm .github/scripts/apply_timer_settings.py
          git add index.html app.js app.css
          git diff --cached --check
          git commit -m "Add timer graphical settings"
          git push origin HEAD:rename-prestart-latency
