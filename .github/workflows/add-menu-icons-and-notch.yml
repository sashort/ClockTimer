name: Add menu icons and notch

on:
  push:
    branches:
      - rename-prestart-latency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Add menu icons and hamburger notch
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '''        <nav id="mainMenu" class="main-menu" popover aria-label="Application menu">
            <button id="profileMenuButton" type="button" data-dialog="profileDialog">Profile</button>
            <button type="button" data-dialog="stateSettingsDialog">Clock State Settings</button>
            <button type="button" data-dialog="graphicalSettingsDialog">Clock Graphical Settings</button>
            <hr>
            <button id="authButton" type="button">Login</button>
        </nav>
'''
          new = '''        <nav id="mainMenu" class="main-menu" popover aria-label="Application menu">
            <button id="profileMenuButton" type="button" data-dialog="profileDialog">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="7" r="4" fill="currentColor"></circle>
                    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8H4Z" fill="currentColor"></path>
                </svg>
                <span class="menu-label">Profile</span>
            </button>
            <button type="button" data-dialog="stateSettingsDialog">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5.2"></circle>
                        <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"></circle>
                        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"></path>
                    </g>
                </svg>
                <span class="menu-label">Clock State Settings</span>
            </button>
            <button type="button" data-dialog="graphicalSettingsDialog">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 3a9 9 0 1 0 0 18h1.4a2.1 2.1 0 0 0 0-4.2h-1.1a1.8 1.8 0 0 1 0-3.6H16A5 5 0 0 0 21 8.3C21 5.3 17 3 12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                    <circle cx="7.8" cy="10" r="1.15" fill="currentColor"></circle>
                    <circle cx="10.4" cy="6.9" r="1.15" fill="currentColor"></circle>
                    <circle cx="14.4" cy="6.7" r="1.15" fill="currentColor"></circle>
                    <circle cx="17.2" cy="9.4" r="1.15" fill="currentColor"></circle>
                </svg>
                <span class="menu-label">Clock Graphical Settings</span>
            </button>
            <hr>
            <button id="authButton" type="button">
                <svg class="menu-icon auth-menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 4h9v16H4V4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                    <path d="M10 12h10M17 8.8 20.2 12 17 15.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="menu-label">Login</span>
            </button>
        </nav>
'''
          if old not in text:
              raise SystemExit('Expected main menu block not found')
          index.write_text(text.replace(old, new, 1))

          js = Path('app.js')
          text = js.read_text()
          old = '''    function syncConnectionUI(connected) {
        profileMenuButton.hidden = !connected;
        authButton.textContent = connected ? "Logout" : "Login";
        authButton.classList.toggle("logout-button", connected);
    }
'''
          new = '''    function syncConnectionUI(connected) {
        profileMenuButton.hidden = !connected;
        const authLabel = authButton.querySelector(".menu-label");
        if (authLabel) authLabel.textContent = connected ? "Logout" : "Login";
        authButton.classList.toggle("logout-button", connected);
    }
'''
          if old not in text:
              raise SystemExit('Expected syncConnectionUI block not found')
          js.write_text(text.replace(old, new, 1))

          css = Path('app.css')
          text = css.read_text()
          old = '''.main-menu {
    width: min(430px, 74vw);
    margin: 0;
    padding: 8px 0;
    border: 1px solid rgb(255 255 255 / 70%);
    border-radius: 0 0 18px 18px;
    color: var(--wm-white);
    background: rgb(4 30 66 / 86%);
    box-shadow: 0 12px 28px rgb(0 0 0 / 30%);
    backdrop-filter: blur(10px);
}

.main-menu:popover-open {
    position: fixed;
    inset: 52px auto auto 0;
}

.main-menu button {
    width: 100%;
    border: 0;
    padding: 16px 20px;
    color: var(--wm-white);
    background: transparent;
    text-align: left;
    font-size: 18px;
}

.main-menu button:hover,
.main-menu button:focus-visible { background: rgb(255 255 255 / 10%); }
.main-menu hr { border: 0; border-top: 1px solid rgb(255 255 255 / 35%); margin: 6px 16px; }
.main-menu .logout-button { color: #ff554d; }
'''
          new = '''.main-menu {
    width: min(430px, calc(100vw - 24px));
    margin: 0;
    padding: 8px 0;
    overflow: visible;
    border: 1px solid rgb(255 255 255 / 70%);
    border-radius: 18px;
    color: var(--wm-white);
    background: rgb(4 30 66 / 86%);
    box-shadow: 0 12px 28px rgb(0 0 0 / 30%);
    backdrop-filter: blur(10px);
}

.main-menu::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 14px;
    width: 18px;
    height: 18px;
    border-top: 1px solid rgb(255 255 255 / 70%);
    border-left: 1px solid rgb(255 255 255 / 70%);
    background: rgb(4 30 66 / 94%);
    transform: translateX(-50%) rotate(45deg);
    pointer-events: none;
}

.main-menu:popover-open {
    position: fixed;
    inset: 60px auto auto 12px;
}

.main-menu button {
    width: 100%;
    border: 0;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    align-items: center;
    gap: 14px;
    color: var(--wm-white);
    background: transparent;
    text-align: left;
    font-size: 18px;
}

.menu-icon {
    width: 30px;
    height: 30px;
    display: block;
    justify-self: center;
    color: currentColor;
    overflow: visible;
}

.menu-label { display: block; }

.main-menu button:hover,
.main-menu button:focus-visible { background: rgb(255 255 255 / 10%); }
.main-menu hr { border: 0; border-top: 1px solid rgb(255 255 255 / 35%); margin: 6px 16px; }
.main-menu .logout-button { color: #ff554d; }
'''
          if old not in text:
              raise SystemExit('Expected main menu CSS block not found')
          css.write_text(text.replace(old, new, 1))
          PY

          node --check app.js
          grep -F 'class="menu-icon"' index.html
          grep -F '.main-menu::before' app.css
          grep -F 'authButton.querySelector(".menu-label")' app.js

      - name: Commit source changes
        run: |
          if git diff --quiet -- index.html app.css app.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app.css app.js
          git commit -m "Add menu icons and hamburger notch"
          git push origin HEAD:rename-prestart-latency
