name: Fix ClockTimer second tick marks

on:
  push:
    paths:
      - '.github/workflows/fix-clocktimer-second-tick-marks.yml'
      - '.github/scripts/fix_clocktimer_second_tick_marks.py'
      - '.github/scripts/test_second_tick_math.js'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/fix_clocktimer_second_tick_marks.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Test tick math
        run: node .github/scripts/test_second_tick_math.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Make ClockTimer tick marks second based" || exit 0
          git push origin main
