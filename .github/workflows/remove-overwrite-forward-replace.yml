name: Remove overwrite on forward replace
on:
  push:
    paths:
      - '.github/workflows/remove-overwrite-forward-replace.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/remove-overwrite-forward-replace.py
      - run: node --check ClockTimer.js
      - name: Verify
        run: |
          grep -q 'nextRange.removeAttribute(' ClockTimer.js
          grep -q 'currentRange.removeAttribute(' ClockTimer.js
      - name: Commit
        run: |
          rm .github/scripts/remove-overwrite-forward-replace.py .github/workflows/remove-overwrite-forward-replace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove overwrite on forward replacement'
          git push
