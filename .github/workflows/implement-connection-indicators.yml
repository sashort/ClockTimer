name: Implement connection indicators
on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/implement_connection_indicators.py
      - .github/workflows/implement-connection-indicators.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply connection indicator patch
        run: python .github/scripts/implement_connection_indicators.py
      - name: Syntax check
        run: |
          node --check ClockTimer.js
          node --check app.js
      - name: Verify connection indicator behavior
        run: |
          grep -Fq 'async resumeConnection()' ClockTimer.js
          grep -Fq 'CONNECTION_INDICATOR_MINIMUM = 1000' app.js
          grep -Fq 'settleInitialNumberPadConnection' app.js
          grep -Fq 'resumeConnectionFromCloud' app.js
          grep -Fq 'id="numberPadConnection"' numberpad.html
          grep -Fq 'id="tripSettingsCloud"' index.html
          grep -Fq '.trip-settings-cloud' app.css
      - name: Commit connection indicators and cleanup
        run: |
          rm -f .github/scripts/implement_connection_indicators.py
          rm -f .github/workflows/implement-connection-indicators.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js app.js app.css index.html numberpad.html .github/scripts .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refine connection status controls'
          git push origin HEAD:rename-prestart-latency
