name: Apply trip start three-column grid

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/apply-trip-start-three-column.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply changes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply-trip-start-grid.py
          python /tmp/apply-trip-start-grid.py
          python -c "from pathlib import Path; [p.write_text(p.read_text().rstrip() + '\n') for p in map(Path, ['app.css','index.html'])]"
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-trip-start-three-column.yml
          git add app.css index.html
          git diff --cached --check
          git commit -m "Refine trip start grid animation"
          git push origin HEAD:rename-prestart-latency
