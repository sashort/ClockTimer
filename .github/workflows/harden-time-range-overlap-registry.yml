name: Harden TimeRange overlap registry
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/harden-time-range-overlap-registry.yml'
      - '.github/scripts/harden_time_range_overlap_registry.py'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: python .github/scripts/harden_time_range_overlap_registry.py
      - name: Syntax checks
        run: |
          node --check TimeRange.js
          node --check ClockTimer.js
      - name: Verify registry guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("TimeRange.js").read_text()
          start = text.index("    #removeOverlaps()")
          block = text[start:]
          guard = block.index("!(existing instanceof TimeRange)")
          parent = block.index("existing.parentElement")
          assert guard < parent
          assert "!existing.isConnected" in block[guard:parent]
          assert "instances.splice(" in block[guard:parent]
          PY
      - name: Commit source fix
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add TimeRange.js
          git commit -m "Harden TimeRange overlap instance registry" || exit 0
          git push origin HEAD:rename-prestart-latency
