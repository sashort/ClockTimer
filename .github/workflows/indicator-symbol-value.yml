name: Indicator symbol value
on:
  push:
    paths:
      - '.github/workflows/indicator-symbol-value.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/indicator-symbol-value.py
      - run: node --check ClockTimer.js
      - name: Verify
        run: |
          grep -q '#syncIndicatorSymbolContent' ClockTimer.js
          grep -q '? "▲"' ClockTimer.js
      - name: Commit and cleanup
        run: |
          rm .github/workflows/indicator-symbol-value.yml .github/scripts/indicator-symbol-value.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/workflows/indicator-symbol-value.yml .github/scripts/indicator-symbol-value.py
          git commit -m 'Use indicator-symbol attribute value as symbol'
          git push
