name: Fix face background bleed
on:
  push:
    paths:
      - .github/workflows/fix-face-background-bleed.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-face-background-bleed.py
      - run: node --check ClockTimer.js
      - name: Commit patch and cleanup
        run: |
          rm .github/scripts/fix-face-background-bleed.py .github/workflows/fix-face-background-bleed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github
          git commit -m 'Confine clock face background inside border'
          git push
