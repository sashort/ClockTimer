name: Fix ClockTimer fromJSON direct load
on:
  push:
    paths: ['.github/workflows/fix-fromjson-no-start.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python .github/scripts/fix-fromjson-no-start.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          python - <<'PY'
          from pathlib import Path
          s=Path('ClockTimer.js').read_text()
          a=s.index('        fromJSON(json) {')
          b=s.index('        get status() {', a)
          block=s[a:b]
          assert 'this.start(' not in block
          assert '#buildPlannedRanges' in block
          assert '#createTimeRange' in block
          PY
      - name: Commit
        run: |
          rm .github/scripts/fix-fromjson-no-start.py .github/workflows/fix-fromjson-no-start.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/fix-fromjson-no-start.py .github/workflows/fix-fromjson-no-start.yml
          git commit -m 'Load ClockTimer JSON without start'
          git push
