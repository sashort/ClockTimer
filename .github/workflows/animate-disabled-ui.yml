name: Animate disabled UI

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/scripts/animate-disabled-ui.py
      - .github/workflows/animate-disabled-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply update
        run: python .github/scripts/animate-disabled-ui.py

      - name: Validate
        run: |
          grep -q 'reversible-disabled-ui-v1' app.css
          grep -q 'opacity 250ms ease-in-out' app.css
          grep -q 'filter 250ms ease-in-out' app.css
          if grep -A8 '#tripSettingsPrimary:disabled' app.css | grep -q 'background: var(--ui-gray-gradient)'; then
            echo 'Disabled primary still swaps gradients instead of animating grayscale.' >&2
            exit 1
          fi

      - name: Commit and cleanup
        run: |
          rm .github/scripts/animate-disabled-ui.py
          rm .github/workflows/animate-disabled-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Animate UI disabled states both directions'
          git push origin HEAD:rename-prestart-latency
