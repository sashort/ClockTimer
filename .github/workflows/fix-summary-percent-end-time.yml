name: Fix summary percent and end time

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/fix-summary-percent-end-time.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/fix_summary_percent_end_time.py

      - name: Validate
        run: |
          node --check ClockTimer.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('ClockTimer.js').read_text()
          assert '#formatSummaryEndTime(value)' in text
          assert 'standardTimeMilliseconds / countedTimeMilliseconds' in text
          assert 'this.#standardDuration / tripCountedTimeElapsedMilliseconds' in text
          assert 'countedTimeMilliseconds / actualTimeMilliseconds' not in text
          assert 'tripCountedTimeElapsedMilliseconds / tripActualTimeElapsedMilliseconds' not in text
          assert 'this.#formatSummaryEndTime(\n                    new Date(nowDate.getTime() + remainingMilliseconds)' in text
          assert 'this.#formatSummaryEndTime(\n                    new Date(\n                        creationDate.getTime() +' in text
          PY

      - name: Commit source and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js
          git commit -m 'Fix live counted percent and summary end time'
          git rm .github/scripts/fix_summary_percent_end_time.py .github/workflows/fix-summary-percent-end-time.yml
          git commit -m 'Remove summary percent patch files'
          git push origin HEAD:rename-prestart-latency
