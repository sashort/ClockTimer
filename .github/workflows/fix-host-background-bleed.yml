name: Fix host background bleed

on:
  push:
    paths:
      - '.github/workflows/fix-host-background-bleed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix-host-background-bleed.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify attribute implementation remains removed
        run: |
          ! grep -q '"background-color"' <(sed -n '1,25p' ClockTimer.js)
          ! grep -q 'case "background-color"' ClockTimer.js
      - name: Commit patch and clean temporary files
        run: |
          rm .github/scripts/fix-host-background-bleed.py
          rm .github/workflows/fix-host-background-bleed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js .github/scripts/fix-host-background-bleed.py .github/workflows/fix-host-background-bleed.yml
          git commit -m "Prevent host background from bleeding into active ring"
          git push
