name: Refine numberpad acknowledgement

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/refine-numberpad-acknowledgement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply refinement
        run: python .github/scripts/refine_numberpad_acknowledgement.py

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate behavior anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text()
          css = Path('app.css').read_text()
          required = [
              'function numberPadHasChanges()',
              'return numberPadHasChanges() ? "reset" : "close";',
              'numberPadConfirm.disabled = !changed || (!autocorrect && !valid);',
              'function closeNumberPad({ discardPrepared = true, allowChanged = false } = {})',
              'if (!allowChanged && numberPadHasChanges()) return false;',
              'closeNumberPad({ discardPrepared: false, allowChanged: true })',
              'getNumberPadClearAction() !== "reset"',
              'resetNumberPadPendingValue();',
              'numberPadState.mode === "percent" || numberPadHasChanges()',
          ]
          for item in required:
              assert item in app, item
          assert 'numberPadState?.locked' not in app
          assert 'numberPadState.locked' not in app
          assert 'data-action="reset"' in css
          assert '.number-pad-settings:disabled' in css
          PY

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css
          git commit -m "Require acknowledgement for numberpad changes"
          git push origin rename-prestart-latency

      - name: Remove temporary patch files
        if: always()
        run: |
          git fetch origin rename-prestart-latency
          git reset --hard origin/rename-prestart-latency
          git rm -f .github/scripts/refine_numberpad_acknowledgement.py .github/workflows/refine-numberpad-acknowledgement.yml
          git commit -m "Remove numberpad acknowledgement patch files"
          git push origin rename-prestart-latency
