name: Validate TimeRange RingContainer refactor

on:
  push:
    branches:
      - refactor-time-range-layers

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          node --check TimeRange.js
          node --check RingContainer.js
          node --check ClockTimer.js

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Ring layer refactor tests
        working-directory: tests
        run: node time-range-ring-container.mjs

      - name: ClockTimer UI state integration
        working-directory: tests
        run: node clock-timer-ui-state.mjs

      - name: Custom range integration
        working-directory: tests
        run: node custom-trip-range.mjs && node custom-range-goals.mjs
