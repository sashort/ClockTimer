name: Inspect TimeRange animation removals
'on':
  push:
    branches:
      - time-range-animation-rework
    paths:
      - '.github/workflows/inspect-animation-rework.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-range-animation-target
      - name: Show removal call sites
        run: |
          grep -n -C 8 'removeAnimated' ClockTimer.js || true
          echo '--- direct removes ---'
          grep -n -C 4 '\.remove();' ClockTimer.js | head -n 800 || true
