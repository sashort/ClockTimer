name: Finalize TimeRange animation rework
'on':
  push:
    branches:
      - time-range-animation-rework
    paths:
      - '.github/workflows/inspect-animation-rework.yml'
      - '.github/scripts/fix_time_range_animation_removals.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@v4
      - name: Preserve compatibility patch
        run: cp .github/scripts/fix_time_range_animation_removals.py /tmp/fix_time_range_animation_removals.py
      - name: Switch to target branch
        run: |
          git fetch origin time-range-animation-target
          git checkout -B time-range-animation-target origin/time-range-animation-target
      - name: Apply compatibility patch
        run: python /tmp/fix_time_range_animation_removals.py
      - name: Syntax check
        run: |
          node --check TimeRange.js
          node --check ClockTimer.js
      - name: Verify final animation flow
        run: |
          grep -Fq 'renderStartTime' TimeRange.js
          grep -Fq '#releaseTimeRangeTimingAnimation(' ClockTimer.js
          test "$(grep -c '#releaseTimeRangeTimingAnimation(' ClockTimer.js)" -ge 6
          grep -Fq 'static calculateClipPath({' TimeRange.js
          grep -Fq 'TimeRangeClass.suspendLayout(' ClockTimer.js
      - name: Commit target branch
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add TimeRange.js ClockTimer.js
          git commit -m "Handle removal during TimeRange timing animations"
          git push origin time-range-animation-target
