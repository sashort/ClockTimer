name: Pipe background CSS to face
on:
  push:
    paths:
      - '.github/workflows/pipe-background-css.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/pipe-background-css.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify attribute API removed
        run: |
          ! grep -q '"background-color"' ClockTimer.js
          grep -q '#syncFaceBackgroundFromExternalCSS' ClockTimer.js
      - name: Commit functional change and self-clean
        run: |
          rm .github/scripts/pipe-background-css.py .github/workflows/pipe-background-css.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/pipe-background-css.py .github/workflows/pipe-background-css.yml
          git commit -m 'Pipe host background color into clock face'
          git push
