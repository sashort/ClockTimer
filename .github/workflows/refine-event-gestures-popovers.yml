name: Refine event gestures and popovers
on:
  push:
    paths:
      - '.github/workflows/refine-event-gestures-popovers.yml'
      - '.github/scripts/refine_event_gestures_popovers.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refinements
        run: python .github/scripts/refine_event_gestures_popovers.py
      - name: Syntax checks
        run: |
          node --check ClockTimer.js
          node --check app.js
      - name: Verify refinements
        run: |
          grep -Fq '"latencyStarted"' ClockTimer.js
          ! grep -Fq '"latencyStart"' ClockTimer.js
          grep -Fq '#scopeToggle").addEventListener("pointerup"' app.js
          grep -Fq '#renderedTimeButton").addEventListener("pointerup"' app.js
          grep -Fq 'numberPadConfirm.addEventListener("pointerup"' app.js
          grep -Fq 'numberPadSettings.addEventListener("pointerup"' app.js
          grep -Fq 'openDialogElement(numberPadDialog' app.js
          grep -Fq 'popover.classList.remove("popover-immediate-close")' app.js
          grep -Fq 'safeStorageSet(STORAGE.renderedTimeMode, clockTimer.renderedTimeMode)' app.js
      - name: Commit source refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js app.js
          git commit -m "Refine pointer event and popover lifecycle handling"
          git push origin HEAD:rename-prestart-latency
      - name: Remove refinement workflow
        run: |
          git rm -f .github/scripts/refine_event_gestures_popovers.py .github/workflows/refine-event-gestures-popovers.yml
          git commit -m "Remove event gesture refinement workflow"
          git push origin HEAD:rename-prestart-latency
