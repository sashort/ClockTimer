name: Refine trip settings timestamp

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/refine-trip-settings-timestamp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0

      - name: Apply trip settings timestamp refinement
        run: python .github/scripts/refine-trip-settings-timestamp.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -q 'tripSettingsSession' app.js
          grep -q 'Set To ${tripStartsNowState.label}' app.js
          grep -q 'data-trip-start-now-target="scheduled-start"' index.html
          grep -q 'data-trip-start-now-target="actual-start"' index.html
          grep -q 'trip-now-actions.is-selecting' app.css

      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/refine-trip-settings-timestamp.py
          rm -f .github/workflows/refine-trip-settings-timestamp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app.css index.html .github/scripts/refine-trip-settings-timestamp.py .github/workflows/refine-trip-settings-timestamp.yml
          git commit -m 'Stage trip settings values and timestamp selection'
          git push origin HEAD:rename-prestart-latency
