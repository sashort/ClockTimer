name: Provision speech backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provision-speech-lightsail.yml"
  workflow_dispatch:

concurrency:
  group: clocktimer-speech-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SPEECH_REF: 37e66e8402cda3455cf8a00d6df3133ac6a34f73
      WHISPER_CPP_REF: a44e07845931421bb6f3447ce0010ed9dc76a118

    steps:
      - name: Checkout tested speech branch
        uses: actions/checkout@v4
        with:
          ref: 37e66e8402cda3455cf8a00d6df3133ac6a34f73

      - name: Validate provisioning scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n speech/provision-lightsail.sh
          bash -n speech/configure-apache.sh
          node --check speech/verify-local.mjs

      - name: Configure SSH
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_SSH_KEY: ${{ secrets.LAMP_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LAMP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts

          connected=0
          for attempt in $(seq 1 30); do
            if ssh-keyscan -T 10 -H "$LAMP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            then
              connected=1
              break
            fi

            echo "SSH host scan failed (attempt $attempt); retrying."
            sleep 10
          done

          if [ "$connected" -ne 1 ]; then
            echo "Unable to reach Lightsail SSH endpoint." >&2
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Package speech runtime
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/clocktimer-speech-deploy.tgz \
            speech/server.js \
            speech/protocol.js \
            speech/grammar.js \
            speech/whisper-service.js \
            speech/package.json \
            speech/clocktimer-speech.service \
            speech/whisper-server-grammar.patch

      - name: Upload speech runtime
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail
          uploaded=0

          for attempt in $(seq 1 20); do
            if scp \
              -o ConnectTimeout=15 \
              -i ~/.ssh/id_ed25519 \
              /tmp/clocktimer-speech-deploy.tgz \
              speech/provision-lightsail.sh \
              speech/verify-local.mjs \
              speech/configure-apache.sh \
              "$LAMP_USER@$LAMP_HOST:/tmp/"
            then
              uploaded=1
              break
            fi

            echo "Speech upload failed (attempt $attempt); retrying."
            sleep 10
          done

          if [ "$uploaded" -ne 1 ]; then
            echo "Unable to upload speech runtime." >&2
            exit 1
          fi

      - name: Launch detached speech provisioning
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail

          launched=0

          for attempt in $(seq 1 20); do
            if
            ssh \
              -o ConnectTimeout=15 \
              -i ~/.ssh/id_ed25519 \
              "$LAMP_USER@$LAMP_HOST" \
              "set -euo pipefail
               STATUS=/tmp/clocktimer-speech-provision.status
               PIDFILE=/tmp/clocktimer-speech-provision.pid
               LOG=/tmp/clocktimer-speech-provision.log
  
               if [ -f \"\$PIDFILE\" ]; then
                 OLD_PID=\$(cat \"\$PIDFILE\" 2>/dev/null || true)
                 if [ -n \"\$OLD_PID\" ] && kill -0 \"\$OLD_PID\" 2>/dev/null; then
                   echo \"Provisioning already running as PID \$OLD_PID\"
                   exit 0
                 fi
               fi
  
               rm -f \"\$STATUS\" \"\$PIDFILE\"
               : > \"\$LOG\"
  
               cp /tmp/provision-lightsail.sh /tmp/clocktimer-speech-provision.sh
               cp /tmp/verify-local.mjs /tmp/verify-speech-local.mjs
               chmod 755 /tmp/clocktimer-speech-provision.sh
  
               nohup env \
                 WHISPER_CPP_REF='$WHISPER_CPP_REF' \
                 bash /tmp/clocktimer-speech-provision.sh \
                 >\"\$LOG\" 2>&1 </dev/null &
  
               NEW_PID=\$!
               echo \"\$NEW_PID\" > \"\$PIDFILE\"
               echo \"Started detached provisioning as PID \$NEW_PID\""
            then
              launched=1
              break
            fi

            echo "Detached provisioning launch failed (attempt $attempt); retrying."
            sleep 10
          done

          if [ "$launched" -ne 1 ]; then
            echo "Unable to launch detached speech provisioning." >&2
            exit 1
          fi

      - name: Wait for detached speech provisioning
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 180); do
            STATUS=$(
              ssh \
                -o BatchMode=yes \
                -o ConnectTimeout=10 \
                -i ~/.ssh/id_ed25519 \
                "$LAMP_USER@$LAMP_HOST" \
                'cat /tmp/clocktimer-speech-provision.status 2>/dev/null || echo running' \
                2>/dev/null ||
              true
            )

            case "$STATUS" in
              success*)
                echo "Detached speech provisioning succeeded."
                ssh \
                  -o ConnectTimeout=10 \
                  -i ~/.ssh/id_ed25519 \
                  "$LAMP_USER@$LAMP_HOST" \
                  'tail -n 100 /tmp/clocktimer-speech-provision.log || true'
                exit 0
                ;;
              failure:*)
                echo "Detached speech provisioning failed: $STATUS" >&2
                ssh \
                  -o ConnectTimeout=10 \
                  -i ~/.ssh/id_ed25519 \
                  "$LAMP_USER@$LAMP_HOST" \
                  'tail -n 180 /tmp/clocktimer-speech-provision.log || true' \
                  || true
                exit 1
                ;;
            esac

            if [ $((attempt % 6)) -eq 0 ]; then
              echo "Speech provisioning still running (probe $attempt)."
              ssh \
                -o ConnectTimeout=10 \
                -i ~/.ssh/id_ed25519 \
                "$LAMP_USER@$LAMP_HOST" \
                'tail -n 30 /tmp/clocktimer-speech-provision.log || true' \
                || true
            fi

            sleep 10
          done

          echo "Timed out waiting for detached speech provisioning." >&2
          ssh \
            -o ConnectTimeout=10 \
            -i ~/.ssh/id_ed25519 \
            "$LAMP_USER@$LAMP_HOST" \
            'tail -n 180 /tmp/clocktimer-speech-provision.log || true' \
            || true
          exit 1

      - name: Configure Apache speech proxy
        shell: bash
        env:
          LAMP_HOST: ${{ secrets.LAMP_HOST }}
          LAMP_USER: ${{ secrets.LAMP_USER }}
        run: |
          set -euo pipefail
          ssh \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "$LAMP_USER@$LAMP_HOST" \
            'bash /tmp/configure-apache.sh'

      - name: Verify public WebSocket route
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --omit=dev \
            --ignore-scripts \
            --prefix speech

          node --input-type=module <<'NODE'
          import WebSocket from "./speech/node_modules/ws/wrapper.mjs";

          const socket =
              new WebSocket(
                  "wss://wmof.sashort-apps.com/api/speech/stream",
                  {
                      headers: {
                          Origin:
                              "https://wmof.sashort-apps.com"
                      }
                  }
              );

          await new Promise(
              (resolve, reject) => {
                  const timer =
                      setTimeout(
                          () =>
                              reject(
                                  new Error(
                                      "Timed out verifying the public speech WebSocket route."
                                  )
                              ),
                          15000
                      );

                  socket.on(
                      "open",
                      () => {
                          socket.send(
                              JSON.stringify({
                                  type:
                                      "session-start",
                                  sessionId:
                                      "public-route-test",
                                  language:
                                      "en-US",
                                  context: {},
                                  audio: {
                                      encoding:
                                          "pcm_s16le",
                                      sampleRate:
                                          16000,
                                      channels:
                                          1
                                  }
                              })
                          );

                          socket.send(
                              JSON.stringify({
                                  type: "ping",
                                  at: 424242
                              })
                          );
                      }
                  );

                  socket.on(
                      "message",
                      data => {
                          const message =
                              JSON.parse(
                                  data.toString()
                              );

                          if (
                              message.type === "pong" &&
                              message.at === 424242
                          ) {
                              clearTimeout(timer);
                              resolve();
                          }
                      }
                  );

                  socket.on(
                      "unexpected-response",
                      (_request, response) =>
                          reject(
                              new Error(
                                  "Public WebSocket returned HTTP " +
                                  response.statusCode
                              )
                          )
                  );

                  socket.on(
                      "error",
                      reject
                  );
              }
          );

          socket.close();
          console.log(
              "Public speech WebSocket route verified."
          );
          NODE
