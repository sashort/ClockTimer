name: Vosk speech routing tests
on:
  push:
    branches: [pocketsphinx-experiment]
  pull_request:
    paths:
      - 'Vosk*.js'
      - 'SpeechMenu.js'
      - 'SpeechGrammarContext.js'
      - 'lang/en-US/speech-patterns.json'
      - 'StateTransactions.js'
      - 'ClockTimer.js'
      - 'ActionFunctions.js'
      - 'AsyncPersistence.js'
      - 'app.js'
      - 'tests/application-coordinator.mjs'
      - 'tests/trip-replay-identity.mjs'
      - 'tests/app-state-transactions.mjs'
      - 'tests/speech-failfast.mjs'
      - 'tests/vosk-*.mjs'
      - '.github/workflows/vosk-speech-tests.yml'
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: |
          node tests/template-language-references.mjs
          node tests/standalone-settings-page.mjs
          node tests/graphical-settings-layout.mjs
          node tests/shared-page-templates.mjs
          python tests/build-version.py
          node tests/application-coordinator.mjs
          node tests/speech-failfast.mjs
          node tests/async-command-lifecycle.mjs
          node tests/app-state-transactions.mjs --coordinator-end-trip
          node tests/app-state-transactions.mjs --commands-close
          node tests/app-state-transactions.mjs --sync-voice
          node tests/app-state-transactions.mjs --range-permissions
          node tests/app-state-transactions.mjs --voicepad-continuation
          node tests/app-state-transactions.mjs --interval-actions
          node tests/app-state-transactions.mjs --break-boundaries --voice-feedback
          node tests/app-state-transactions.mjs --break-end-stream --voice-feedback
          node tests/app-state-transactions.mjs --down-timing
          node tests/app-state-transactions.mjs --down-break
          node tests/app-state-transactions.mjs --pin-editing
          node tests/app-state-transactions.mjs --voice-code
          node tests/app-state-transactions.mjs --voice-code-adapter
          node tests/clock-state-transactions.mjs
          TZ=UTC node tests/clock-timer-fsm.mjs
          TZ=America/New_York node tests/clock-timer-fsm.mjs
          node tests/trip-replay-identity.mjs
          node tests/async-persistence.mjs
          node tests/vosk-phrase-list-compiler.mjs
          node tests/spoken-duration.mjs
          node tests/spoken-time.mjs
          node tests/speech-value-preprocessor.mjs
          node tests/legacy-vosk-values.mjs
          node tests/vosk-grammar-router.mjs
          node tests/speech-grammar-context.mjs
          node tests/pocketsphinx-grammar-catalog.mjs
          node tests/vosk-speechmenu-context.mjs
          node tests/speech-chain-actions.mjs
