name: Add tick overwrite
on:
  push:
    paths:
      - '.github/workflows/add-tick-overwrite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add-tick-overwrite.py
      - run: node --check ClockTimer.js
      - name: Verify tick overwrite
        run: |
          grep -q '#processElapsedOverwriteRanges(' ClockTimer.js
          grep -q 'range.removeAttribute(' ClockTimer.js
          grep -q 'startTime:' ClockTimer.js
      - name: Commit
        run: |
          rm .github/scripts/add-tick-overwrite.py .github/workflows/add-tick-overwrite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add tick-driven overwrite handoff'
          git push
