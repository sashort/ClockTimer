name: Update TimeRange rounded overlay

on:
  push:
    paths:
      - '.github/workflows/update-timerange-rounded-overlay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rounded overlay
        run: python .github/scripts/update-timerange-rounded-overlay.py
      - name: Syntax check
        run: node --check TimeRange.js
      - name: Targeted checks
        run: |
          grep -q '#contourLayer' TimeRange.js
          grep -q 'radial-gradient(circle at center' TimeRange.js
          grep -q ':host(\[overlapping\]) #contour' TimeRange.js
          grep -q '#updateContour();' TimeRange.js
      - name: Commit change and cleanup
        run: |
          rm .github/scripts/update-timerange-rounded-overlay.py
          rm .github/workflows/update-timerange-rounded-overlay.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TimeRange.js .github/scripts/update-timerange-rounded-overlay.py .github/workflows/update-timerange-rounded-overlay.yml
          git commit -m 'Render TimeRange rounded contour overlay'
          git push
