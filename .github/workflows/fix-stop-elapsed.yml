name: Fix stop elapsed cleanup
on:
  push:
    paths:
      - .github/workflows/fix-stop-elapsed.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-stop-elapsed.py
      - name: Verify
        run: |
          node --check ClockTimer.js
          grep -q 'time-range\[type="elapsed"\]' ClockTimer.js
      - name: Commit
        run: |
          rm .github/scripts/fix-stop-elapsed.py .github/workflows/fix-stop-elapsed.yml .github/workflows/inspect-stop-elapsed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ClockTimer.js .github/scripts/fix-stop-elapsed.py .github/workflows/fix-stop-elapsed.yml .github/workflows/inspect-stop-elapsed.yml
          git commit -m 'Remove elapsed ranges on stop'
          git push
