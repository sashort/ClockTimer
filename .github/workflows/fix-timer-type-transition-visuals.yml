name: Fix timer type transition visuals
'on':
  push:
    branches:
      - rename-prestart-latency
    paths:
      - '.github/workflows/fix-timer-type-transition-visuals.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply transition visual fix
        run: python .github/scripts/fix_timer_type_transition_visuals.py
      - name: Syntax checks
        run: |
          node --check ClockTimer.js
          node --check TimeRange.js
      - name: Verify timer-type semantic overlay behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("ClockTimer.js").read_text()

          transition_start = text.index("        #transitionTimerType(")
          transition_end = text.index("        #getStateChangeActiveRing()", transition_start)
          transition = text[transition_start:transition_end]
          assert "stateChangeVisual.timerTypeTransition" in transition

          sync_start = text.index("        #syncStateChangeVisuals(")
          sync_end = text.index("        #beginStateChangeVisuals()", sync_start)
          sync = text[sync_start:sync_end]
          assert "semanticCoverageOnly" in sync
          assert "this.#getStateChangeFinalCoverage()" in sync
          assert '"hold"' in sync
          assert '"keep"' in sync

          overlay_start = text.index("        #syncStateChangeOverlayRecord(")
          overlay_end = text.index("        #syncStateChangeVisuals(", overlay_start)
          overlay = text[overlay_start:overlay_end]
          suspend = overlay.index("TimeRangeClass?.suspendLayout?.(")
          append = overlay.index("record.ring.appendChild(", suspend)
          assert suspend < append
          PY
      - name: Commit source fix
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Fix timer type transition visual artifacts" || exit 0
          git push origin HEAD:rename-prestart-latency
