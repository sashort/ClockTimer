name: Patch ClockTimer responsive border width

on:
  push:
    paths:
      - '.github/workflows/patch-clocktimer-responsive-border-width.yml'
      - '.github/scripts/patch_clocktimer_responsive_border_width.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/patch_clocktimer_responsive_border_width.py
      - name: Syntax check
        run: node --check ClockTimer.js
      - name: Verify responsive border width
        run: grep -Fq 'var(--clock-timer-border-width, clamp(2px, 1.5cqi, 7px))' ClockTimer.js
      - name: Commit source change
        run: |
          git config user.name "sashort"
          git config user.email "95879519+sashort@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Make ClockTimer border width responsive" || exit 0
          git push origin main
