name: Finalize Auto goal source

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/inspect-pending-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
          fetch-depth: 0
      - name: Prefer explicit Total goal on a Standard tie
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ClockTimer.js")
          text = path.read_text()
          old = '''            if (totalTime < tripTime) {'''
          new = '''            if (\n                totalTime < tripTime ||\n                (\n                    totalTime === tripTime &&\n                    tripScope === "standard"\n                )\n            ) {'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one Auto total-time comparison, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          node --check ClockTimer.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClockTimer.js
          git commit -m "Preserve explicit goal source on Auto ties"
          git push origin HEAD:rename-prestart-latency
