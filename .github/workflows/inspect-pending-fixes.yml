name: Inspect pending fixes

on:
  push:
    branches:
      - rename-prestart-latency
    paths:
      - .github/workflows/inspect-pending-fixes.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-prestart-latency
      - name: Inspect exact goal locations
        run: |
          echo '=== definitions ==='
          grep -n '^        #handleTripGoalChange' ClockTimer.js || true
          grep -n '^        #clearLocal' ClockTimer.js || true
          grep -n '^        #buildSummarySnapshot' ClockTimer.js || true
          grep -n '^        #getTripSummary' ClockTimer.js || true
          grep -n '^        #getTotalSummary' ClockTimer.js || true
          echo '=== auto sync references ==='
          grep -n '#autoSyncTripGoal' ClockTimer.js || true
          echo '=== goal attribute presence checks ==='
          grep -n -B 3 -A 5 'hasAttribute("total-goal")' ClockTimer.js || true
